         , MAX_BY("configurationItem"."configurationItemStatus", "configurationItem"."configurationitemcapturetime") "SSMStatus"
         , "configurationItem"."resourceId" "SSMEC2InstanceId"
         , ARBITRARY("configurationItem"."arn") "SSMArn"
         FROM
           (cid_crcd_config
         CROSS JOIN UNNEST("configurationitems") t (configurationItem))
         WHERE (("configurationItem"."resourcetype" = 'AWS::SSM::ManagedInstanceInventory') AND (CAST(date_parse("dt", '%Y-%m-%d') AS "Date") >= date_add('month', -6, current_date)))
         GROUP BY "configurationItem"."resourceId"
      )
      SELECT
        r.AccountId
      , r.Region
      , r.AvailabilityZone
      , r.PartitionDate
      , r.ConfigItemCaptureTime
      , r.ConfigEventResourceId
      , r.StateTransitionReason
      , r.InstanceId
      , r.Arn
      , r.TagName
      , r.TAG1
      , r.TAG2
      , r.TAG3
      , r.TAG4
      , r.AllTags
      , r.CreationTime
      , r.LaunchTime
      , r.InstanceType
      , r.PlatformDetails
      , r.Architecture
      , r.KeyName
      , r.AmiId
      , r.PrivateIp
      , r.PublicIp
      , r.IPv6Address
      , r.PrivateDnsName
      , r.PublicDnsName
      , r.State
      , r.ConfigItemStatus
      , ssm.SSMPartitionDate
      , ssm.SSMConfigItemCaptureTime
      , ssm.SSMStatus
      , ssm.SSMArn
      FROM
        (resource_info r
      LEFT JOIN ssm_info ssm ON ((r.Accountid = ssm.SSMAccountId) AND (r.Region = ssm.SSMRegion) AND (r.InstanceId = ssm.SSMEC2InstanceId)))
