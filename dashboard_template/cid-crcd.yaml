  config_inventory_ec2:
    dependsOn: {}
    data: |-
      CREATE OR REPLACE VIEW "${athena_database_name}".config_inventory_ec2 AS
      WITH
        resource_info AS (
         SELECT
           ARBITRARY("accountId") "AccountId"
         , ARBITRARY("region") "Region"
