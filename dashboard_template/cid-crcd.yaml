      FROM
        resource_info r
  v_ai_governance_compliance:
    dependsOn: {}
    data: "CREATE OR REPLACE VIEW \"${athena_database_name}\".v_ai_governance_compliance AS\nSELECT\n  \"\
      accountId\" accountid\n, \"region\" region\n, \"configurationItem\".\"resourcetype\" resourcetype\n\
      , \"configurationItem\".\"resourceId\" resourceid\n, \"configurationItem\".\"resourceName\" resourcename\n\
      , \"configurationItem\".\"configurationitemcapturetime\" capture_time\n, \"dt\" dt\n, CAST(date_parse(\"\
      dt\", '%Y-%m-%d') AS timestamp) snapshot_date\n, \"json_extract_scalar\"(rule, '$.configRuleName')\
      \ config_rule_name\n, \"json_extract_scalar\"(rule, '$.complianceType') compliance_type\n, \"json_extract_scalar\"\
      (\"configurationItem\".\"configuration\", '$.targetResourceType') target_resource_type\n, \"json_extract_scalar\"\
      (\"configurationItem\".\"configuration\", '$.targetResourceId') target_resource_id\nFROM\n  ((cid_crcd_config\n\
      CROSS JOIN UNNEST(\"configurationitems\") t (configurationItem))\nCROSS JOIN UNNEST(CAST(\"json_extract\"\
      (\"configurationItem\".\"configuration\", '$.configRuleList') AS array(json))) u (rule))\nWHERE (regexp_like(\"\
      dt\", '^[0-9]{4}-[0-9]{2}-[0-9]{2}$')\n  AND (datasource = 'ConfigSnapshot')\n  AND (\"configurationItem\"\
      .\"resourcetype\" = 'AWS::Config::ResourceCompliance')\n  AND ((\"json_extract_scalar\"(\"configurationItem\"\
      .\"configuration\", '$.targetResourceType') LIKE '%Bedrock%')\n    OR (\"json_extract_scalar\"(\"\
      configurationItem\".\"configuration\", '$.targetResourceType') LIKE '%AgentCore%')\n    OR (\"json_extract_scalar\"\
      (\"configurationItem\".\"configuration\", '$.targetResourceType') LIKE '%SageMaker%')))"
  v_ai_governance_agents:
    dependsOn: {}
    data: "CREATE OR REPLACE VIEW \"${athena_database_name}\".v_ai_governance_agents AS\nSELECT\n  \"accountId\"\
      \ accountid\n, \"region\" region\n, \"configurationItem\".\"resourceId\" agent_id\n, \"configurationItem\"\
      .\"resourceName\" agent_name\n, \"configurationItem\".\"configurationitemcapturetime\" capture_time\n\
      , \"dt\" dt\n, CAST(date_parse(\"dt\", '%Y-%m-%d') AS timestamp) snapshot_date\n, \"json_extract_scalar\"\
      (\"configurationItem\".\"configuration\", '$.modelId') model_id\n, \"json_extract_scalar\"(\"configurationItem\"\
      .\"configuration\", '$.guardrailConfiguration.guardrailIdentifier') guardrail_id\n, (CASE WHEN (\"\
      json_extract_scalar\"(\"configurationItem\".\"configuration\", '$.guardrailConfiguration.guardrailIdentifier')\
      \ IS NOT NULL) THEN 'Applied' ELSE 'Missing' END) guardrail_status\n, \"json_extract_scalar\"(\"configurationItem\"\
      .\"configuration\", '$.roleArn') iam_role_arn\n, (CASE WHEN (\"json_extract_scalar\"(\"configurationItem\"\
      .\"configuration\", '$.roleArn') IS NOT NULL) THEN 'Assigned' ELSE 'Missing' END) iam_role_status\n\
      , (CASE WHEN (\"json_extract_scalar\"(\"configurationItem\".\"configuration\", '$.networkConfiguration.networkMode')\
      \ = 'PRIVATE') THEN 'Private' ELSE 'Public' END) network_mode\n, (CASE WHEN (\"json_extract_scalar\"\
      (\"configurationItem\".\"configuration\", '$.networkConfiguration.networkMode') = 'PRIVATE') THEN\
      \ 'Compliant' ELSE 'Non-Compliant' END) network_compliance\n, (CASE WHEN (\"json_extract_scalar\"\
      (\"configurationItem\".\"configuration\", '$.tracingConfiguration.enabled') = 'true') THEN 'Enabled'\
      \ ELSE 'Disabled' END) tracing_enabled\n, \"json_extract_scalar\"(\"configurationItem\".\"configuration\"\
      , '$.status') agent_status\nFROM\n  (cid_crcd_config\nCROSS JOIN UNNEST(\"configurationitems\") t\
      \ (configurationItem))\nWHERE (regexp_like(\"dt\", '^[0-9]{4}-[0-9]{2}-[0-9]{2}$')\n  AND (datasource\
      \ = 'ConfigSnapshot')\n  AND (\"configurationItem\".\"resourcetype\" = 'AWS::BedrockAgentCore::Runtime'))"
  v_ai_governance_remediation:
    dependsOn: {}
    data: "CREATE OR REPLACE VIEW \"${athena_database_name}\".v_ai_governance_remediation AS\nWITH findings\
      \ AS (\nSELECT\n  \"accountId\" accountid\n, \"region\" region\n, \"configurationItem\".\"resourceId\"\
      \ resourceid\n, \"configurationItem\".\"configurationitemcapturetime\" capture_time\n, \"dt\" dt\n\
      , CAST(date_parse(\"dt\", '%Y-%m-%d') AS timestamp) snapshot_date\n, \"json_extract_scalar\"(rule,\
      \ '$.configRuleName') config_rule_name\n, \"json_extract_scalar\"(rule, '$.complianceType') compliance_type\n\
      , \"json_extract_scalar\"(\"configurationItem\".\"configuration\", '$.targetResourceType') resource_type_extracted\n\
      , \"json_extract_scalar\"(\"configurationItem\".\"configuration\", '$.targetResourceId') target_resource_id\n\
      , (CASE WHEN (\"json_extract_scalar\"(\"configurationItem\".\"configuration\", '$.targetResourceType')\
      \ LIKE '%AgentCore%') THEN 'High'\n        WHEN (\"json_extract_scalar\"(\"configurationItem\".\"\
      configuration\", '$.targetResourceType') LIKE '%Bedrock%') THEN 'Medium'\n        WHEN (\"json_extract_scalar\"\
      (\"configurationItem\".\"configuration\", '$.targetResourceType') LIKE '%SageMaker%') THEN 'Medium'\n\
      \        ELSE 'Low' END) priority\nFROM\n  ((cid_crcd_config\nCROSS JOIN UNNEST(\"configurationitems\"\
      ) t (configurationItem))\nCROSS JOIN UNNEST(CAST(\"json_extract\"(\"configurationItem\".\"configuration\"\
      , '$.configRuleList') AS array(json))) u (rule))\nWHERE (regexp_like(\"dt\", '^[0-9]{4}-[0-9]{2}-[0-9]{2}$')\n\
      \  AND (datasource = 'ConfigSnapshot')\n  AND (\"configurationItem\".\"resourcetype\" = 'AWS::Config::ResourceCompliance')\n\
      \  AND (\"json_extract_scalar\"(rule, '$.complianceType') = 'NON_COMPLIANT')\n  AND ((\"json_extract_scalar\"\
      (\"configurationItem\".\"configuration\", '$.targetResourceType') LIKE '%Bedrock%')\n    OR (\"json_extract_scalar\"\
      (\"configurationItem\".\"configuration\", '$.targetResourceType') LIKE '%AgentCore%')\n    OR (\"\
      json_extract_scalar\"(\"configurationItem\".\"configuration\", '$.targetResourceType') LIKE '%SageMaker%')))\n\
      )\nSELECT\n  f.*\n, MIN(f.snapshot_date) OVER (PARTITION BY f.resourceid) first_seen\n, MAX(f.snapshot_date)\
      \ OVER (PARTITION BY f.resourceid) last_seen\n, (date_diff('day', MIN(f.snapshot_date) OVER (PARTITION\
      \ BY f.resourceid), MAX(f.snapshot_date) OVER (PARTITION BY f.resourceid)) + 1) days_open\n, (CASE\
      \ WHEN (MAX(f.snapshot_date) OVER (PARTITION BY f.resourceid) = MAX(f.snapshot_date) OVER ()) THEN\
      \ 'Open' ELSE 'Resolved' END) finding_status\nFROM findings f"
  v_ai_governance_inventory:
    dependsOn: {}
    data: "CREATE OR REPLACE VIEW \"${athena_database_name}\".v_ai_governance_inventory AS\nSELECT\n  \"\
      accountId\" accountid\n, \"region\" region\n, \"configurationItem\".\"resourcetype\" resourcetype\n\
      , \"configurationItem\".\"resourceId\" resourceid\n, \"configurationItem\".\"resourceName\" resourcename\n\
      , \"configurationItem\".\"configurationitemcapturetime\" capture_time\n, \"dt\" dt\n, CAST(date_parse(\"\
      dt\", '%Y-%m-%d') AS timestamp) snapshot_date\n, \"configurationItem\".\"resourcecreationtime\" creation_time\n\
      , (CASE WHEN (\"configurationItem\".\"resourcetype\" = 'AWS::BedrockAgentCore::Runtime') THEN \"json_extract_scalar\"\
      (\"configurationItem\".\"configuration\", '$.modelId')\n        WHEN (\"configurationItem\".\"resourcetype\"\
      \ = 'AWS::Bedrock::ApplicationInferenceProfile') THEN \"json_extract_scalar\"(\"configurationItem\"\
      .\"configuration\", '$.modelId')\n        ELSE null END) model_id\n, (CASE WHEN (\"configurationItem\"\
      .\"resourcetype\" = 'AWS::BedrockAgentCore::Runtime') THEN \"json_extract_scalar\"(\"configurationItem\"\
      .\"configuration\", '$.guardrailConfiguration.guardrailIdentifier') ELSE null END) guardrail_id\n\
      , (CASE WHEN (\"configurationItem\".\"resourcetype\" = 'AWS::BedrockAgentCore::Runtime') THEN \"json_extract_scalar\"\
      (\"configurationItem\".\"configuration\", '$.roleArn')\n        WHEN (\"configurationItem\".\"resourcetype\"\
      \ = 'AWS::Bedrock::KnowledgeBase') THEN \"json_extract_scalar\"(\"configurationItem\".\"configuration\"\
      , '$.roleArn')\n        ELSE null END) iam_role_arn\n, (CASE WHEN (\"configurationItem\".\"resourcetype\"\
      \ IN ('AWS::BedrockAgentCore::Runtime', 'AWS::BedrockAgentCore::BrowserCustom', 'AWS::BedrockAgentCore::CodeInterpreterCustom'))\
      \ THEN \"json_extract_scalar\"(\"configurationItem\".\"configuration\", '$.networkConfiguration.networkMode')\
      \ ELSE null END) network_mode\n, (CASE WHEN (\"configurationItem\".\"resourcetype\" = 'AWS::Bedrock::Guardrail')\
      \ THEN \"json_extract_scalar\"(\"configurationItem\".\"configuration\", '$.kmsKeyArn')\n        WHEN\
      \ (\"configurationItem\".\"resourcetype\" = 'AWS::Bedrock::KnowledgeBase') THEN \"json_extract_scalar\"\
      (\"configurationItem\".\"configuration\", '$.serverSideEncryptionConfiguration.kmsKeyArn')\n     \
      \   WHEN (\"configurationItem\".\"resourcetype\" = 'AWS::SageMaker::EndpointConfig') THEN \"json_extract_scalar\"\
      (\"configurationItem\".\"configuration\", '$.kmsKeyId')\n        WHEN (\"configurationItem\".\"resourcetype\"\
      \ = 'AWS::Bedrock::Prompt') THEN \"json_extract_scalar\"(\"configurationItem\".\"configuration\",\
      \ '$.customerEncryptionKeyArn')\n        WHEN (\"configurationItem\".\"resourcetype\" = 'AWS::BedrockAgentCore::Gateway')\
      \ THEN \"json_extract_scalar\"(\"configurationItem\".\"configuration\", '$.kmsKeyArn')\n        WHEN\
      \ (\"configurationItem\".\"resourcetype\" = 'AWS::BedrockAgentCore::Memory') THEN \"json_extract_scalar\"\
      (\"configurationItem\".\"configuration\", '$.encryptionKeyArn')\n        ELSE null END) encryption_key\n\
      FROM\n  (cid_crcd_config\nCROSS JOIN UNNEST(\"configurationitems\") t (configurationItem))\nWHERE\
      \ (regexp_like(\"dt\", '^[0-9]{4}-[0-9]{2}-[0-9]{2}$')\n  AND (datasource = 'ConfigSnapshot')\n  AND\
      \ (\"configurationItem\".\"resourcetype\" IN ('AWS::Bedrock::Guardrail', 'AWS::Bedrock::KnowledgeBase',\
      \ 'AWS::Bedrock::Prompt', 'AWS::Bedrock::ApplicationInferenceProfile', 'AWS::BedrockAgentCore::Runtime',\
      \ 'AWS::BedrockAgentCore::Gateway', 'AWS::BedrockAgentCore::Memory', 'AWS::BedrockAgentCore::BrowserCustom',\
      \ 'AWS::BedrockAgentCore::CodeInterpreterCustom', 'AWS::SageMaker::EndpointConfig', 'AWS::SageMaker::Model')))"
  v_ai_governance_relationships:
    dependsOn:
      views:
      - v_ai_governance_inventory
    data: "CREATE OR REPLACE VIEW \"${athena_database_name}\".v_ai_governance_relationships AS\nWITH\n \
      \ inv AS (\n   SELECT *\n   FROM\n     \"${athena_database_name}\".v_ai_governance_inventory\n   WHERE (dt = (SELECT\
      \ max(dt)\nFROM\n  \"${athena_database_name}\".v_ai_governance_inventory\n))\n) \nSELECT\n  a.accountid\n, a.region\n\
      , a.resourcetype source_type\n, a.resourceid source_id\n, COALESCE(a.resourcename, a.resourceid) source_name\n\
      , (CASE WHEN (a.guardrail_id IS NOT NULL) THEN 'Protected by guardrail' ELSE 'No guardrail attached'\
      \ END) relationship\n, 'AWS::Bedrock::Guardrail' target_type\n, COALESCE(a.guardrail_id, 'NONE') target_id\n\
      , COALESCE(g.resourcename, a.guardrail_id, 'No guardrail') target_name\n, 1 edge_count\nFROM\n  (inv\
      \ a\nLEFT JOIN inv g ON ((g.resourceid = a.guardrail_id) AND (g.resourcetype = 'AWS::Bedrock::Guardrail')))\n\
      WHERE (a.resourcetype = 'AWS::BedrockAgentCore::Runtime')\nUNION ALL SELECT\n  a.accountid\n, a.region\n\
      , a.resourcetype\n, a.resourceid\n, COALESCE(a.resourcename, a.resourceid)\n, 'Invokes model'\n, 'Foundation\
      \ model'\n, a.model_id\n, a.model_id\n, 1\nFROM\n  inv a\nWHERE ((a.resourcetype = 'AWS::BedrockAgentCore::Runtime')\
      \ AND (a.model_id IS NOT NULL))\nUNION ALL SELECT\n  a.accountid\n, a.region\n, a.resourcetype\n,\
      \ a.resourceid\n, COALESCE(a.resourcename, a.resourceid)\n, 'Assumes IAM role'\n, 'AWS::IAM::Role'\n\
      , a.iam_role_arn\n, element_at(split(a.iam_role_arn, '/'), -1)\n, 1\nFROM\n  inv a\nWHERE ((a.resourcetype\
      \ = 'AWS::BedrockAgentCore::Runtime') AND (a.iam_role_arn IS NOT NULL))\nUNION ALL SELECT\n  r.accountid\n\
      , r.region\n, r.resourcetype\n, r.resourceid\n, COALESCE(r.resourcename, r.resourceid)\n, 'Encrypted\
      \ by KMS key'\n, 'AWS::KMS::Key'\n, r.encryption_key\n, element_at(split(r.encryption_key, '/'), -1)\n\
      , 1\nFROM\n  inv r\nWHERE (r.encryption_key IS NOT NULL)"
