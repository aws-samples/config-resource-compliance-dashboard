  SheetId: 277f8693-2af0-4f19-967c-f579621b0a2c
  TextBoxes:
  - Content: "<text-box>\n  <br/>\n  <inline font-size=\"20px\">\n    <b>Compliance\
      \ tracker</b>\n  </inline>\n  <br/>\n  <inline color=\"#bdbdbd\" font-size=\"\
      14px\">Track compliance of AWS resources, conformance packs and AWS Config rules.</inline>\n\
      \  <br/>\n  <inline color=\"#bdbdbd\" font-size=\"14px\">Filter by account,\
      \ region and compliance at the top. Use controls below (or click on a line on\
      \ the\_</inline>\n  <inline color=\"#bdbdbd\" font-size=\"14px\">\n    <b>AWS\
      \ Resources Compliance Status\_</b>\n  </inline>\n  <inline color=\"#bdbdbd\"\
      \ font-size=\"14px\">or\_</inline>\n  <inline color=\"#bdbdbd\" font-size=\"\
      14px\">\n    <b>Conformance Packs Compliance Status</b>\n  </inline>\n  <inline\
      \ color=\"#bdbdbd\" font-size=\"14px\">\_tables) to apply additional filters.</inline>\n\
      \  <br/>\n  <inline color=\"#bdbdbd\" font-size=\"14px\">Shows normalized AWS\
      \ Config rule and conformance pack names. For example, 'my-conformance-pack-[random-text]'\
      \ is displayed as 'my-conformance-pack'.</inline>\n</text-box>"
    SheetTextBoxId: a8c02621-85c4-4def-8ea9-15ef34104236
  - Content: |-
      <text-box>
        <inline font-size="36px">
          <b>Compliance Summary</b>
        </inline>
        <br/>
        <inline color="#bdbdbd" font-size="16px">Visualize your current compliance status and the history of your compliance.</inline>
        <br/>
        <inline color="#bdbdbd" font-size="16px">Use controls at the top to filter by account, AWS Region, compliance type.</inline>
      </text-box>
    SheetTextBoxId: 572e99b1-0420-469c-86ac-225eb324c6d0
  - Content: "<text-box>\n  <br/>\n  <inline font-size=\"20px\">\n    <b>Conformance\
      \ pack compliance</b>\n  </inline>\n  <br/>\n  <inline color=\"#bdbdbd\">The\
      \ compliance score is calculated by the number of compliant rule-resources over\
      \ the total number of possible\_</inline>\n  <inline color=\"#bdbdbd\" font-size=\"\
      14px\">rule-resource combinations (see</inline>\n  <inline color=\"#9d9d9d\"\
      \ font-size=\"14px\">\_</inline>\n  <inline color=\"#2f8ee7\" font-size=\"14px\"\
      >\n    <a href=\"https://aws.amazon.com/blogs/mt/announcing-aws-config-compliance-scores-for-conformance-pack/\"\
      \ target=\"_blank\">documentation</a>\n  </inline>\n  <inline color=\"#9d9d9d\"\
      \ font-size=\"14px\">\_</inline>\n  <inline color=\"#bdbdbd\" font-size=\"14px\"\
      >for details).</inline>\n</text-box>"
    SheetTextBoxId: 9bb3369d-2d18-47cf-baf1-fd96bf3ae4e8
