  SheetId: 46b75277-8701-45ff-adf3-8bfe9f7faa01
  TextBoxes:
  - Content: "<text-box>\n  <inline font-size=\"36px\">\n    <b>Configuration Events\
      \ on your AWS resources</b>\n  </inline>\n  <br/>\n  <inline color=\"#bdbdbd\"\
      \ font-size=\"16px\">Find which resources were recently created, updated or\
      \ deleted and see which accounts and AWS Regions are delivering AWS Config data.\_\
      </inline>\n  <br/>\n  <br/>\n  <inline color=\"#bdbdbd\" font-size=\"16px\"\
      >Except where otherwise noted, the visuals are based on all events from your\
      \ AWS environments, sourced from AWS Config configuration history records. These\
      \ files are generated each time a resource is being changed and its compliance\
      \ evaluated. The fields\_</inline>\n  <inline color=\"#bdbdbd\" font-size=\"\
      16px\">\n    <b>Event Timestamp</b>\n  </inline>\n  <inline color=\"#bdbdbd\"\
      \ font-size=\"16px\">,\_</inline>\n  <inline color=\"#bdbdbd\" font-size=\"\
      16px\">\n    <b>Deletion Timestamp</b>\n  </inline>\n  <inline color=\"#bdbdbd\"\
      \ font-size=\"16px\">\_and\_</inline>\n  <inline color=\"#bdbdbd\" font-size=\"\
      16px\">\n    <b>Evaluation Timestamp</b>\n  </inline>\n  <inline color=\"#bdbdbd\"\
      \ font-size=\"16px\">\_indicate when that configuration change happened (UTC\
      \ timezone).</inline>\n  <br/>\n  <br/>\n  <inline color=\"#bdbdbd\" font-size=\"\
      16px\">Use the controls at the top to filter by account and AWS Region. All\
      \ graphs show normalized AWS Config rule and conformance pack names. For example,\
      \ the rule 'a-rule-[random-text]' is displayed as 'a-rule', the conformance\
      \ pack 'a-conformance-pack-[random-text]' is displayed as 'a-conformance-pack'.</inline>\n\
      </text-box>"
    SheetTextBoxId: cf446e9f-0802-43a2-852a-3d4c52ca6809
  - Content: |-
      <text-box>
        <br/>
        <inline font-size="20px">
          <b>Deleted Resources</b>
        </inline>
        <br/>
        <inline color="#bdbdbd" font-size="14px">AWS resources that were deleted recently, use the control on the right to specify the date range.</inline>
      </text-box>
    SheetTextBoxId: ede04840-0cf1-44e0-8c32-832f4d1249b8
  - Content: |-
      <text-box>
        <br/>
        <inline font-size="20px">
          <b>All AWS Config events</b>
        </inline>
        <br/>
        <inline color="#bdbdbd" font-size="14px">Use controls at the top to filter by account and region, use controls on the right to apply additional filters.</inline>
      </text-box>
    SheetTextBoxId: 980118a0-9b17-4b24-9b90-e9e90b53ef12
  - Content: |-
      <text-box>
        <br/>
        <inline font-size="20px">
          <b/>
        </inline>
        <inline font-size="20px">
          <b>AWS Config coverage</b>
        </inline>
      </text-box>
    SheetTextBoxId: 0948a1a6-0905-4841-be62-66f0edd3355d
  - Content: "<text-box>\n  <inline font-size=\"16px\">\n    <b>Latest AWS Config\
      \ data import</b>\n  </inline>\n  <inline color=\"#bdbdbd\" font-size=\"16px\"\
      >\n    <b>\_</b>\n  </inline>\n  <br/>\n  <br/>\n  <inline color=\"#bdbdbd\"\
      \ font-size=\"14px\">\n    <b>S</b>\n  </inline>\n  <inline color=\"#bdbdbd\"\
      \ font-size=\"14px\">hows the latest data imported into the dashboard and can\
      \ help confirm that you are receiving data from all accounts and AWS Regions.\_\
      </inline>\n  <br/>\n  <br/>\n  <inline color=\"#bdbdbd\" font-size=\"14px\"\
      >This is based AWS Config snapshot files, which are generated on a schedule\
      \ for each account and Region and contain the status of all resources, regardless\
      \ of configuration changes. The field\_</inline>\n  <inline color=\"#bdbdbd\"\
      \ font-size=\"14px\">\n    <b>Latest Data Import</b>\n  </inline>\n  <inline\
      \ color=\"#bdbdbd\" font-size=\"14px\">\_indicates the time when the Config\
      \ snapshot file was last generated. The dashboard is designed to import AWS\
      \ Config data up to yesterday, older data may indicate problems with AWS Config\
      \ delivery of files in that account-region.</inline>\n</text-box>"
    SheetTextBoxId: 83950359-7c91-4e55-b1ff-b4f7b3e9fd49
  - Content: |-
      <text-box>
        <inline font-size="16px">
          <b>Heat map of resource change events recorded by AWS Config</b>
        </inline>
        <br/>
        <br/>
        <inline color="#bdbdbd" font-size="14px">Shows the number of resource change configurations recorded by AWS Config in the date range specified on the right. This shows the accounts and AWS Regions that are most active.</inline>
      </text-box>
    SheetTextBoxId: cce5926e-b1d1-4853-838d-5d1b25e5972c
