  Name: account-name-id
- DataSetIdentifier: config_inventory_ec2
  Expression: '{instances_in_account_region_az}/{instances_in_account_region}'
  Name: instances_az_coverage
- DataSetIdentifier: config_inventory_ec2
  Expression: distinctCountOver(instanceid, [accountid, region], PRE_FILTER)
  Name: instances_in_account_region
- DataSetIdentifier: config_inventory_ec2
  Expression: distinctCountOver(instanceid, [accountid, region, availabilityzone],
    PRE_FILTER)
  Name: instances_in_account_region_az
- DataSetIdentifier: config_inventory_lambda
  Expression: ifelse(isNull({account_name}), accountid, concat({account_name}, ' ',
    accountid))
  Name: account-name-id
- DataSetIdentifier: config_inventory_rds
  Expression: ifelse(isNull({account_name}), accountid, concat({account_name}, ' ',
