AnalysisDefaults:
  DefaultNewSheetConfiguration:
    InteractiveLayoutConfiguration:
      Grid:
        CanvasSizeOptions:
          ScreenCanvasSizeOptions:
            ResizeOption: RESPONSIVE
    SheetContentType: INTERACTIVE
CalculatedFields:
- DataSetIdentifier: config_compliance
  Expression: ifelse(isNull({account_name}), accountid, concat({account_name}, ' ',
    accountid))
  Name: account-name-id
- DataSetIdentifier: config_compliance
  Expression: distinct_count({compliant-rule})/(distinct_count({non-compliant-rule})+distinct_count({compliant-rule}))
  Name: compliance-score
- DataSetIdentifier: config_compliance
  Expression: '1'
  Name: compliance-target
- DataSetIdentifier: config_compliance
  Expression: ifelse(compliancetype='COMPLIANT',pkruleid, NULL)
  Name: compliant-rule
- DataSetIdentifier: config_compliance
  Expression: |-
    ifelse(startsWith(rulename, 'securityhub', CASE_INSENSITIVE), 'Security Hub',
           startsWith(rulename, 'crcd-', CASE_INSENSITIVE), 'Threat-Informed Security Posture',
           contains(rulename, 'required-tags', CASE_INSENSITIVE), 'Required tags',
           contains(rulename, 'required-tag', CASE_INSENSITIVE), 'Required tags',
           contains(rulename, 'requiredtags', CASE_INSENSITIVE), 'Required tags',
           contains(rulename, 'requiredtag', CASE_INSENSITIVE), 'Required tags',
           contains(rulename, 'tagged', CASE_INSENSITIVE), 'Required tags',
           'Other')
  Name: crcd-classification-lv1
- DataSetIdentifier: config_compliance
  Expression: |-
    ifelse(startsWith(rulename, 'crcd-ia-'), 'Initial Access'
    , contains(rulename, 'root-account-mfa-enabled')
        OR contains(rulename, 'iam-root-access-key-check')
        OR contains(rulename, 'iam-user-mfa-enabled')
        OR contains(rulename, 'mfa-enabled-for-iam-console-access')
        OR contains(rulename, 'ec2-launch-template-imdsv2-check')
        OR contains(rulename, 'ec2-imdsv2-check')
        OR contains(rulename, 'autoscaling-launchconfig-requires-imdsv2')
        OR contains(rulename, 's3-bucket-level-public-access-prohibited')
        OR contains(rulename, 's3-account-level-public-access-blocks-periodic')
        OR contains(rulename, 's3-access-point-public-access-blocks')
        OR contains(rulename, 's3-access-point-in-vpc-only')
        OR contains(rulename, 's3-bucket-public-write-prohibited')
        OR contains(rulename, 's3-bucket-public-read-prohibited')
        OR contains(rulename, 'vpc-sg-port-restriction-check') , 'Initial Access'
     , 'Undefined')
  Name: crcd-classification-lv2
- DataSetIdentifier: config_compliance
  Expression: |-
    ifelse(contains(rulename, 'root-account-mfa-enabled')
        OR contains(rulename, 'iam-root-access-key-check')
        OR contains(rulename, 'iam-user-mfa-enabled')
        OR contains(rulename, 'mfa-enabled-for-iam-console-access')
        OR startsWith(rulename, 'crcd-ia-iam-')
        , 'IAM Protection',
        contains(rulename, 'ec2-launch-template-imdsv2-check')
        OR contains(rulename, 'ec2-imdsv2-check')
        OR contains(rulename, 'autoscaling-launchconfig-requires-imdsv2')
        OR startsWith(rulename, 'crcd-ia-ec2-')
        , 'EC2 Protection',
        contains(rulename, 's3-bucket-level-public-access-prohibited')
        OR contains(rulename, 's3-account-level-public-access-blocks-periodic')
        OR contains(rulename, 's3-access-point-public-access-blocks')
        OR contains(rulename, 's3-access-point-in-vpc-only')
        OR contains(rulename, 's3-bucket-public-write-prohibited')
        OR contains(rulename, 's3-bucket-public-read-prohibited')
        OR startsWith(rulename, 'crcd-ia-s3-')
        , 'S3 Protection',
        contains(rulename, 'vpc-sg-port-restriction-check')
        OR startsWith(rulename, 'crcd-ia-ra-')
        , 'Resource Access Protection'
        , 'Undefined')
  Name: crcd-classification-lv3
- DataSetIdentifier: config_compliance
  Expression: |-
    ifelse(
        maxOver(compliancesampledate, [], PRE_AGG) = compliancesampledate,
        1,
        0
    )
  Name: isLatestComplianceStatus
- DataSetIdentifier: config_compliance
  Expression: ifelse(compliancetype='NON_COMPLIANT',pkruleid, NULL)
  Name: non-compliant-rule
- DataSetIdentifier: config_compliance_conformance_pack
  Expression: ifelse(isNull({account_name}), accountid, concat({account_name}, ' ',
    accountid))
  Name: account-name-id
- DataSetIdentifier: config_compliance_conformance_pack
  Expression: sum(compliantrulecount)/(sum(compliantrulecount)+sum(noncompliantrulecount))
  Name: compliance-score
- DataSetIdentifier: config_compliance_conformance_pack
  Expression: 'concat(toString(noncompliantrulecount), '' out of '', toString(totalrulecount),
    '' rules are not compliant'') '
  Name: compliance-status
- DataSetIdentifier: config_compliance_conformance_pack
  Expression: '1'
  Name: compliance-target
- DataSetIdentifier: config_compliance_conformance_pack
  Expression: |-
    ifelse(
        maxOver(compliancesampledate, [], PRE_AGG) = compliancesampledate,
        1,
        0
    )
  Name: isLatestComplianceStatus
- DataSetIdentifier: config_compliance_resource
  Expression: ifelse(isNull({account_name}), accountid, concat({account_name}, ' ',
    accountid))
  Name: account-name-id
- DataSetIdentifier: config_compliance_resource
  Expression: distinct_count({compliant-resource})/(distinct_count({non-compliant-resource})+distinct_count({compliant-resource}))
  Name: compliance-score
- DataSetIdentifier: config_compliance_resource
  Expression: '1'
  Name: compliance-target
- DataSetIdentifier: config_compliance_resource
  Expression: ifelse(compliancetype='COMPLIANT',pkresourceid, NULL)
  Name: compliant-resource
- DataSetIdentifier: config_compliance_resource
  Expression: |-
    ifelse(
        maxOver(compliancesampledate, [], PRE_AGG) = compliancesampledate,
        1,
        0
    )
  Name: isLatestComplianceStatus
- DataSetIdentifier: config_compliance_resource
  Expression: ifelse(compliancetype='NON_COMPLIANT',pkresourceid,NULL)
  Name: non-compliant-resource
- DataSetIdentifier: config_event
  Expression: ifelse(isNull({account_name}), accountid, concat({account_name}, ' ',
    accountid))
  Name: account-name-id
- DataSetIdentifier: config_event
  Expression: dateDiff(now(), {latest-data-import}, "DD")
  Name: config-file-delay
- DataSetIdentifier: config_event
  Expression: '1'
  Name: event
- DataSetIdentifier: config_event
  Expression: max(configitemcapturetime, [accountid,region])
  Name: latest-ci-event
- DataSetIdentifier: config_event
  Expression: max(partitiondate, [accountid,region])
  Name: latest-data-import
- DataSetIdentifier: config_event_delivery
  Expression: ifelse(isNull({account_name}), accountid, concat({account_name}, ' ',
    accountid))
  Name: account-name-id
- DataSetIdentifier: config_event_delivery
  Expression: dateDiff(now(), latestpartitiondate, "DD")
  Name: config-snapshot-delay
- DataSetIdentifier: config_event_rule_evaluation
  Expression: ifelse(isNull({account_name}), accountid, concat({account_name}, ' ',
    accountid))
  Name: account-name-id
- DataSetIdentifier: config_event_rule_evaluation
  Expression: ifelse(isNull(conformancepackname), 'N/A', normalizedconformancepackname)
  Name: conformance-pack-or-standalone
- DataSetIdentifier: config_event_rule_evaluation
  Expression: concat(ifelse(isNull(conformancepackname), 'Standalone Rule', normalizedconformancepackname),
    '-', rulename)
  Name: conformance-pack-or-standalone-rule
- DataSetIdentifier: config_event_rule_evaluation
  Expression: concat(targetresourceid, ' [', targetresourcetype, ']')
  Name: resource-type-id
- DataSetIdentifier: config_inventory
  Expression: ifelse(isNull({account_name}), accountid, concat({account_name}, ' ',
    accountid))
  Name: account-name-id
- DataSetIdentifier: config_inventory_ebs
  Expression: ifelse(isNull({account_name}), accountid, concat({account_name}, ' ',
    accountid))
  Name: account-name-id
- DataSetIdentifier: config_inventory_ec2
