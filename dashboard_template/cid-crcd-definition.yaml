  TextBoxes:
  - Content: "<text-box>\n  <inline font-size=\"36px\">\n    <b>Tag Compliance Summary</b>\n\
      \  </inline>\n  <br/>\n  <inline color=\"#bdbdbd\" font-size=\"16px\">All visuals\
      \ include all AWS Config rules whose name contains \"</inline>\n  <inline color=\"\
      #bdbdbd\" font-family=\"Amazon Ember\" font-size=\"16px\">required-tags</inline>\n\
      \  <inline color=\"#bdbdbd\" font-size=\"16px\">\", \"</inline>\n  <inline color=\"\
      #bdbdbd\" font-family=\"Amazon Ember\" font-size=\"16px\">required-tag</inline>\n\
      \  <inline color=\"#bdbdbd\" font-size=\"16px\">\", \"requiredtags\" or \"requiredtag\"\
      \ (case insensitive) created from the managed rule</inline>\n  <inline color=\"\
      #9d9d9d\" font-size=\"16px\">\_</inline>\n  <inline color=\"#2f8ee7\" font-size=\"\
      16px\">\n    <a href=\"https://docs.aws.amazon.com/config/latest/developerguide/required-tags.html\"\
      \ target=\"_blank\">REQUIRED_TAGS</a>\n  </inline>\n  <inline color=\"#bdbdbd\"\
      \ font-size=\"16px\">, and also all rules whose name contains \"tagged\" (case\
      \ insensitive) created from the several\_</inline>\n  <inline color=\"#2f8ee7\"\
      \ font-size=\"16px\">\n    <a href=\"https://docs.aws.amazon.com/config/latest/developerguide/managed-rules-by-aws-config.html\"\
      \ target=\"_blank\">managed rules</a>\n  </inline>\n  <inline color=\"#bdbdbd\"\
      \ font-size=\"16px\">\_ending with \"-tagged\".</inline>\n  <br/>\n  <inline\
      \ color=\"#bdbdbd\" font-size=\"16px\">Identify untagged resources across accounts,\
      \ Regions, resource types. Use controls at the top to filter by account, AWS\
      \ Region, resource type and compliance type.</inline>\n</text-box>"
    SheetTextBoxId: 96d55e28-e5bf-4c8d-ad1a-a516a5d0f88a
  - Content: "<text-box>\n  <br/>\n  <inline font-size=\"20px\">\n    <b>Tag compliance\
