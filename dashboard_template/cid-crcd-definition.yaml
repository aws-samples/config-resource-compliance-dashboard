  SheetId: c55f5b01-4fe4-4e62-9161-e2f02de4a25b
  TextBoxes:
  - Content: "<text-box>\n  <inline font-size=\"36px\">\n    <b>Contributors to AWS\
      \ Config usage</b>\n  </inline>\n  <br/>\n  <inline color=\"#bdbdbd\" font-size=\"\
      16px\">Analyze AWS Config rules and resources that most contribute to AWS Config\
      \ cost.\_</inline>\n  <br/>\n  <br/>\n  <inline color=\"#bdbdbd\" font-size=\"\
      16px\">AWS Config cost is driven by the number of rule evaluations and configuration\
      \ item changes being recorded. AWS Config cost are complex and calculating them\
      \ precisely is outside the scope of this dashboard. This section reports the\
      \ number of configuration items changes that are recorded and the number of\
      \ AWS Config rule evaluations over time. You can track AWS Config cost per operation\
      \ on the AWS Config section under the Monitoring &amp; Observability tab of\
      \ the\_</inline>\n  <inline color=\"#2f8ee7\" font-size=\"16px\">\n    <a href=\"\
      https://docs.aws.amazon.com/guidance/latest/cloud-intelligence-dashboards/cudos-cid-kpi.html\"\
      \ target=\"_blank\">CUDOS dashboard</a>\n  </inline>\n  <inline color=\"#bdbdbd\"\
      \ font-size=\"16px\">.</inline>\n  <br/>\n  <br/>\n  <inline color=\"#bdbdbd\"\
      \ font-size=\"16px\">Use the controls at the top to filter by account and AWS\
      \ Region. All graphs show normalized AWS Config rule and conformance pack names.\
      \ For example, the rule '</inline>\n  <inline color=\"#bdbdbd\" font-family=\"\
      Amazon Ember\" font-size=\"16px\">a-rule-[random-text]</inline>\n  <inline color=\"\
      #bdbdbd\" font-size=\"16px\">' is displayed as 'a-rule', the conformance pack\
      \ 'a-conformance-pack-[random-text]' is displayed as 'a-conformance-pack'.</inline>\n\
      </text-box>"
    SheetTextBoxId: 57ea5aa2-1148-42df-afae-0629253bd39a
  - Content: |-
      <text-box>
        <inline font-size="20px">
          <b>AWS Config usage overview</b>
        </inline>
        <br/>
        <br/>
        <inline color="#bdbdbd">Shows the AWS Config rule evaluations and resource change events recorded in the specified time window. Use controls at the top to filter by account and AWS Region. Use the sliders on the right to control how many weeks of data are displayed on the weekly evolution controls, and how many days of data are displayed in the other controls in this section.</inline>
      </text-box>
    SheetTextBoxId: bdf39d29-79a2-48ea-a43d-094f2186f6a3
  - Content: "<text-box>\n  <br/>\n  <inline font-family=\"Amazon Ember\" font-size=\"\
      18px\">\n    <b>INSUFFICIENT_DATA compliance of c</b>\n  </inline>\n  <inline\
      \ font-size=\"18px\">\n    <b>onformance pack rules</b>\n  </inline>\n  <br/>\n\
      \  <inline color=\"#bdbdbd\">Conformance pack rules that have a compliance\_\
      </inline>\n  <inline color=\"#bdbdbd\" font-family=\"Amazon Ember\">status of\
      \ INSUFFICIENT_DATA do not have AWS resources in scope</inline>\n  <inline color=\"\
      #bdbdbd\">. Since you are charged for each rule evaluation regardless of the\
      \ outcome, rules that return\_</inline>\n  <inline color=\"#bdbdbd\" font-family=\"\
      Amazon Ember\">INSUFFICIENT_DATA</inline>\n  <inline color=\"#bdbdbd\">\_may\
      \ still incur costs.</inline>\n  <br/>\n  <br/>\n  <inline color=\"#bdbdbd\"\
      >Use controls at the top to filter by account and AWS Region. Use the slider\
      \ on the right to control how many days of data are displayed in this section.</inline>\n\
      </text-box>"
    SheetTextBoxId: e015ca90-3b8e-4571-b65e-6b29eacace93
  - Content: |-
      <text-box>
        <br/>
        <inline font-size="18px">
          <b>AWS Config rule evaluations</b>
        </inline>
        <br/>
        <inline color="#bdbdbd" font-size="14px">Find the AWS Config rules that are evaluated the most. See each evaluation over time and to which resource they were applied. Conformance pack rules with INSUFFICIENT_DATA compliance are excluded.</inline>
        <br/>
        <br/>
        <inline color="#bdbdbd">Use controls at the top to filter by account and Region. Use the slider on the right to control how many days of data are displayed in this section. Additional filters for this section are also available on the right.</inline>
      </text-box>
    SheetTextBoxId: 81765ef8-ac80-432c-947f-d956fec6b017
  - Content: |-
      <text-box>
        <br/>
        <inline font-size="20px">
          <b>Resource configuration changes recorded by AWS Config</b>
        </inline>
        <br/>
        <inline color="#bdbdbd">A resource change record is created by AWS Config whenever a resource undergoes a configuration change or a relationship change. You pay per change record delivered by AWS Config.</inline>
        <br/>
        <br/>
        <inline color="#bdbdbd">Use controls at the top to filter by account and AWS Region. Use the slider on the right to control how many days of data are displayed in this section. Additional filters for this section are also on the right.</inline>
      </text-box>
    SheetTextBoxId: 91ff4ebc-7309-4a96-b4f3-327b05f079a3
  - Content: |-
      <text-box>
        <br/>
        <inline font-size="18px">
          <b>AWS Config rule evaluation heat maps</b>
        </inline>
        <br/>
        <inline color="#bdbdbd" font-size="14px">Distribution of AWS Config rule evaluations per compliance type, account and region.</inline>
        <br/>
        <inline color="#bdbdbd">Use controls at the top to filter by account and region. Use the slider on the right to control how many days of data are displayed in this section.</inline>
      </text-box>
    SheetTextBoxId: 75417c6f-15e1-44d2-9bb8-049dccdfcde1
  - Content: "<text-box>\n  <br/>\n  <inline font-size=\"20px\">\n    <b>De-duplication\
      \ of AWS Config rules</b>\n  </inline>\n  <br/>\n  <inline color=\"#bdbdbd\"\
      >AWS Config rules continuously evaluate your AWS resource configurations for\
      \ desired settings, responding to changes or running periodic checks. While\
      \ AWS Config provides multiple deployment options\u2014including individual\
      \ rules, conformance packs, Security Hub standards, and AWS Control Tower controls\u2014\
      many customers inadvertently implement duplicate rules across these services.\
      \ This duplication leads to significant disadvantages: unnecessary costs from\
      \ redundant evaluations, governance complexity that complicates compliance management,\
      \ and potentially inconsistent remediation actions for the same compliance issues.\
      \ To optimize compliance efforts and reduce costs, organizations should develop\
      \ a strategic approach that eliminates rule duplication across their AWS environments.\_\
      </inline>\n  <br/>\n  <br/>\n  <inline color=\"#bdbdbd\">This section supports\
      \ regular auditing of rules and conformance packs to eliminate redundancy. Review\
      \ and consolidate overlapping rules across different compliance standards and\
      \ deployment options to maintain effectiveness while optimizing costs:</inline>\n\
      \  <br/>\n  <ul>\n    <li class=\"ql-indent-0\">\n      <inline color=\"#bdbdbd\"\
      >The control\_</inline>\n      <inline color=\"#bdbdbd\">\n        <b>Rule evaluation\
      \ filter</b>\n      </inline>\n      <inline color=\"#bdbdbd\">\_below lists\
      \ the\_</inline>\n      <inline color=\"#bdbdbd\">\n        <i>evaluation</i>\n\
      \      </inline>\n      <inline color=\"#bdbdbd\">\_performed by the rule, extracted\
      \ from the rule name. For example 'cloudtrail-enabled-conformance-pack-jkvfdxrsfr'\
      \ becomes 'coudtrail-enabled' and you will be able to see if that rule is deployed\
      \ more than once. The values on the list are not always unique for the same\
      \ rule\_</inline>\n      <inline color=\"#bdbdbd\">\n        <i>evaluation</i>\n\
      \      </inline>\n      <inline color=\"#bdbdbd\">. For example, AWS Control\
      \ Tower deploys the rule 'AWSControlTower_AWS-GR_DETECT_CLOUDTRAIL_ENABLED_ON_SHARED_ACCOUNTS'\
      \ which is reduced to 'detect_cloudtrail_enabled_on_shared_accounts': same rule\
      \ evaluation as above, but with a completely different rule name. Use the search\
      \ box\_</inline>\n      <inline color=\"#bdbdbd\">\n        <b>Rule evaluation\
      \ filter</b>\n      </inline>\n      <inline color=\"#bdbdbd\">\_to find rules\
      \ that correlate to each other.</inline>\n    </li>\n    <li class=\"ql-indent-0\"\
      >\n      <inline color=\"#bdbdbd\">Once you select the core rule(s), the graph\
      \ and the table below are automatically filtered.</inline>\n    </li>\n  </ul>\n\
      \  <br/>\n  <br/>\n  <inline color=\"#bdbdbd\">Use controls at the top to filter\
      \ by account and AWS Region. Use the slider on the right to control how many\
      \ days of data are displayed in this section.</inline>\n</text-box>"
    SheetTextBoxId: 2263521b-de6e-41b5-9b9f-3efdd1dd1105
