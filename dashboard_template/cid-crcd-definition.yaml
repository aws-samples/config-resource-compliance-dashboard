  SheetId: 82d93f14-b6d7-4a79-90eb-936ef55fce70
  TextBoxes:
  - Content: "<text-box>\n  <inline font-size=\"20px\">\n    <b>EC2 inventory</b>\n\
      \  </inline>\n  <br/>\n  <inline color=\"#bdbdbd\" font-size=\"14px\">Use controls\
      \ on the right to apply additional filters. Click on an EC2 instance to filter\
      \ its attached volume(s) in the\_</inline>\n  <inline color=\"#bdbdbd\" font-size=\"\
      14px\">\n    <b>EBS volume inventory</b>\n  </inline>\n  <inline color=\"#bdbdbd\"\
      \ font-size=\"14px\">\_table below.</inline>\n</text-box>"
    SheetTextBoxId: f87fab62-71c6-462e-ac85-93babceb7ed2
  - Content: |-
      <text-box>
        <br/>
        <inline font-size="20px">
          <b>Resource inventory dashboard</b>
        </inline>
        <br/>
        <inline color="#bdbdbd" font-size="14px">Stats about your resources and a deep dive into EC2 and EBS.</inline>
      </text-box>
    SheetTextBoxId: f4ec8bf2-649a-4fe9-8935-3498c7caf110
  - Content: |-
      <text-box>
        <br/>
        <inline font-size="20px">
          <b>EBS volume inventory</b>
        </inline>
        <br/>
        <inline color="#bdbdbd" font-size="14px">Use controls on the right to apply additional filters.</inline>
      </text-box>
    SheetTextBoxId: 508915ae-cf35-408f-80c1-0a5a91c29b4a
  - Content: |-
      <text-box>
        <inline font-size="36px">
          <b>Inventory of your AWS Resources</b>
        </inline>
        <br/>
        <inline color="#bdbdbd" font-size="16px">All visuals in this inventory display the latest configuration status of your resources.</inline>
        <br/>
        <inline color="#bdbdbd" font-size="16px">Use the controls at the top to filter by account, AWS Region, custom tags.</inline>
      </text-box>
    SheetTextBoxId: 2f26a9ad-2297-4dee-8bc3-b9880f62013a
  - Content: |-
      <text-box>
        <br/>
        <inline font-size="20px">
          <b>Lambda inventory</b>
        </inline>
        <br/>
        <inline color="#bdbdbd" font-size="14px">Use controls on the right to apply additional filters.</inline>
      </text-box>
    SheetTextBoxId: b1ddee91-b695-4e57-a6e9-e08d67d9f934
  - Content: |-
      <text-box>
        <br/>
        <inline font-size="20px">
          <b>RDS inventory</b>
        </inline>
        <br/>
        <inline color="#bdbdbd" font-size="14px">Use controls on the right to apply additional filters.</inline>
      </text-box>
    SheetTextBoxId: 916f2aff-a9b7-4b89-95b8-100815691043
  - Content: |-
      <text-box>
        <br/>
        <inline font-size="20px">
          <b>Tag inventory</b>
        </inline>
        <br/>
        <inline color="#bdbdbd" font-size="14px">Distribution of tags across resource types.</inline>
      </text-box>
    SheetTextBoxId: 7941aeaa-6084-4ec4-a368-ffa8b1b1195d
  - Content: |-
      <text-box>
        <br/>
        <inline font-size="20px">
          <b>S3 inventory</b>
        </inline>
      </text-box>
    SheetTextBoxId: e0becb35-1887-475f-b67c-4d083f96de4f
  - Content: |-
      <text-box>
        <br/>
        <inline font-size="20px">
          <b>EC2 Availability Zone dashboard</b>
        </inline>
        <br/>
        <inline color="#bdbdbd" font-size="14px">Evaluate your resilience to AZ-level events by checking the distribution of your EC2 instances across Availability Zones. Use filters at the top to narrow down to your account or workload.</inline>
      </text-box>
    SheetTextBoxId: af22c4dc-aeba-4d9c-8a4c-32e53e004b5f
  - Content: |-
      <text-box>
        <br/>
        <inline font-size="20px">
          <b>AWS Systems Manager (SSM)</b>
        </inline>
        <br/>
        <inline color="#bdbdbd" font-size="14px">Visualize your managed EC2 instances and identify instances that are not managed by AWS Systems Manager (SSM). The status can be:</inline>
        <br/>
        <ul>
          <li class="ql-indent-0">
            <inline color="#bdbdbd" font-size="14px">Managed - the instance is managed by AWS Systems Manager.</inline>
          </li>
          <li class="ql-indent-0">
            <inline color="#bdbdbd" font-size="14px">Not managed - the instance is not managed by AWS Systems Manager.</inline>
          </li>
          <li class="ql-indent-0">
