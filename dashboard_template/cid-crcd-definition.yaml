  SheetId: e1abd968-7871-4010-b6a6-6914088429c8
  TextBoxes:
  - Content: "<text-box>\n  <inline font-size=\"36px\">\n    <b>Threat-Informed Security\
      \ Posture</b>\n  </inline>\n  <br/>\n  <inline color=\"#bdbdbd\" font-size=\"\
      16px\">This feature of the dashboard is developed in collaboration with the\_\
      </inline>\n  <inline color=\"#2f8ee7\" font-size=\"16px\">\n    <a href=\"https://aws.amazon.com/security-incident-response/\"\
      \ target=\"_blank\">AWS Security Incident Response</a>\n  </inline>\n  <inline\
      \ color=\"#bdbdbd\" font-size=\"16px\">\_(SIRS) team, a specialized 24/7 global\
      \ team that provides proactive and reactive security support to AWS customers\
      \ for security responsibilities on the customer side of the\_</inline>\n  <inline\
      \ color=\"#2f8ee7\" font-size=\"16px\">\n    <a href=\"https://aws.amazon.com/compliance/shared-responsibility-model/\"\
      \ target=\"_blank\">AWS Shared Responsibility Model</a>\n  </inline>\n  <inline\
      \ color=\"#bdbdbd\" font-size=\"16px\">. When SIRS security engineers support\
      \ a customer, they will help triage security findings and assist during potential\
      \ active security events in the customer's AWS environment. They provide security\
      \ recommendations and best practices to help prevent future security incidents.</inline>\n\
      \  <br/>\n  <br/>\n  <inline font-size=\"24px\">\n    <b>AWS Config Resource\
      \ Compliance Dashboard Conformance Pack</b>\n  </inline>\n  <br/>\n  <inline\
      \ color=\"#bdbdbd\" font-size=\"16px\">This dashboard provides fundamental security\
      \ posture checks that customers can perform on their AWS environment. To fully\
      \ take advantage of the feature, we recommend the\_</inline>\n  <inline color=\"\
      #bdbdbd\" font-size=\"16px\">\n    <b>AWS Config Resource Compliance Dashboard\
      \ (CRCD)\_</b>\n  </inline>\n  <inline color=\"#2f8ee7\" font-size=\"16px\"\
      >\n    <a href=\"https://github.com/aws-samples/config-resource-compliance-dashboard/tree/main/conformance_pack\"\
      \ target=\"_blank\">conformance pack</a>\n  </inline>\n  <inline color=\"#bdbdbd\"\
      \ font-size=\"16px\">, a comprehensive compliance monitoring solution that deploys\
      \ the\_</inline>\n  <inline color=\"#2f8ee7\" font-size=\"16px\">\n    <a href=\"\
      https://github.com/aws-samples/config-resource-compliance-dashboard/blob/main/conformance_pack/crcd-conformance-pack-specification.md\"\
      \ target=\"_blank\">standard and custom</a>\n  </inline>\n  <inline color=\"\
      #bdbdbd\" font-size=\"16px\">\_AWS Config rules recommended by AWS Security\
      \ Incident Response Service security engineers, based on their multi-year experience\
      \ supporting AWS customers during active security incidents. The dashboard\_\
      </inline>\n  <inline color=\"#2f8ee7\" font-size=\"16px\">\n    <a href=\"https://github.com/aws-samples/config-resource-compliance-dashboard/blob/main/conformance_pack/crcd-conformance-pack-specification.md#naming-convention\"\
      \ target=\"_blank\">classifies</a>\n  </inline>\n  <inline color=\"#2f8ee7\"\
      \ font-size=\"16px\">\_</inline>\n  <inline color=\"#bdbdbd\" font-size=\"16px\"\
      >AWS Config rules according to the tactics and techniques presented in the\_\
      </inline>\n  <inline color=\"#2f8ee7\" font-size=\"16px\">\n    <a href=\"https://aws-samples.github.io/threat-technique-catalog-for-aws/\"\
      \ target=\"_blank\">Threat Technique Catalog for AWS</a>\n  </inline>\n  <inline\
      \ color=\"#bdbdbd\" font-size=\"16px\">. The catalog is based on MITRE ATT&amp;CK\xAE\
      \ and is used to identify and categorize threat actor behaviors observed by\
      \ AWS.\_</inline>\n  <inline font-size=\"16px\">\n    <b>Disclaimer:\_</b>\n\
      \  </inline>\n  <inline color=\"#bdbdbd\" font-size=\"16px\">This feature is\
      \ designed to reduce common security risks, not eliminate them entirely. Remediating\
      \ identified misconfigurations does not guarantee protection from all security\
      \ incidents. Customers are encouraged to adopt a defense-in-depth approach as\
      \ part of their overall security posture.</inline>\n  <br/>\n  <br/>\n  <inline\
      \ color=\"#bdbdbd\" font-size=\"15px\">The visuals in this dashboard consider\
      \ only the AWS Config rules belonging to the AWS Config Resource Compliance\
      \ Dashboard\_</inline>\n  <inline color=\"#2f8ee7\" font-size=\"15px\">\n  \
      \  <a href=\"https://github.com/aws-samples/config-resource-compliance-dashboard/blob/main/conformance_pack/crcd-conformance-pack-specification.md\"\
      \ target=\"_blank\">conformance pack</a>\n  </inline>\n  <inline color=\"#bdbdbd\"\
      \ font-size=\"15px\">. If you do not install the conformance pack, the dashboard\
      \ will still display compliance information of the recommended standard AWS\
      \ Config rules that you may have already deployed.</inline>\n</text-box>"
    SheetTextBoxId: cc8f7d12-af17-4b50-8e7d-acee650f0f84
  - Content: "<text-box>\n  <inline font-size=\"32px\">Initial Access</inline>\n \
      \ <br/>\n  <br/>\n  <inline color=\"#2f8ee7\">\n    <a href=\"https://aws-samples.github.io/threat-technique-catalog-for-aws/Tactics/TA0001.html\"\
      \ target=\"_blank\">Initial Access</a>\n  </inline>\n  <inline color=\"#bdbdbd\"\
      >\_consists of techniques that use various entry vectors to gain their initial\
      \ foothold within an AWS environment. Techniques used to gain a foothold include\
      \ exploiting weaknesses on public-facing web servers. Footholds gained through\
      \ initial access may allow for continued access, like valid accounts and use\
      \ of external remote services, or may be limited-use due to changing passwords.</inline>\n\
      </text-box>"
    SheetTextBoxId: 6f347e7f-94e8-4727-8fad-d6d12ac2ebce
  - Content: "<text-box>\n  <br/>\n  <inline font-size=\"20px\">\n    <b>Initial Access\
      \ compliance tracker</b>\n  </inline>\n  <br/>\n  <inline color=\"#bdbdbd\"\
      \ font-size=\"14px\">Track compliance of AWS resources and AWS Config rules\
      \ in\_</inline>\n  <inline color=\"#bdbdbd\" font-size=\"14px\">\n    <b>Initial\
      \ Access</b>\n  </inline>\n  <inline color=\"#bdbdbd\" font-size=\"14px\">\_\
      category.</inline>\n  <br/>\n  <inline color=\"#bdbdbd\">Use controls at the\
      \ top to filter by account and AWS Region. Use controls on the right to apply\
      \ additional filters.</inline>\n  <br/>\n  <inline color=\"#bdbdbd\">Shows normalized\
      \ AWS Config rule names. For example, 'my-rule-[random-text]' is displayed as\
      \ 'my-rule'.</inline>\n</text-box>"
    SheetTextBoxId: e3f24e62-51da-46db-86f3-b30bc5dc1424
