# Config Resource Compliance Dashboard (CRCD) Customer Incident Response Team (CIRT) Conformance Pack 
# Rule Classification Reference Data
# 
# This file defines the classification taxonomy of the conformance pack's AWS Config rules
# based on the Threat Technique Catalog(TTC) for AWS (MITRE ATT&CK® framework)
# https://aws-samples.github.io/threat-technique-catalog-for-aws/
#
# Naming Convention: crcd-cirt-<lv1>-<lv2>-<rule-name>

# Schema Documentation
# 
# Rule Structure:
#   rule_name: string (follows naming convention crcd-cirt-<lv1>-<lv2>-<rule-name>)
#   rule_type: enum ["STANDARD", "CUSTOM"]
#     - STANDARD: AWS-managed Config rule
#     - CUSTOM: Custom Config rule backed by Lambda function
#   source_identifier: string
#     - For STANDARD rules: AWS managed rule identifier (e.g., "S3_BUCKET_PUBLIC_READ_PROHIBITED")
#     - For CUSTOM rules: "LAMBDA_NAME_PLACEHOLDER" (will be replaced by Lambda ARN)
#   classification: object
#     - level1: string (full Level 1 category name)
#     - level1_abbrev: string (Level 1 abbreviation used in rule name)
#     - level2: string (full Level 2 technique name)
#     - level2_abbrev: string (Level 2 abbreviation used in rule name)
#   description: string (brief description of what the rule checks)
#   rule_rationale: string (explanation of why this rule is recommended)
#   resource_types: array of strings (AWS resource types evaluated by this rule)
#     Usage:
#     - Maps to the Scope property in AWS::Config::ConfigRule for rules that are evaluated when a resource change event happens
#     Special cases:
#     - For account-level rules (e.g., ROOT_ACCOUNT_MFA_ENABLED), use empty array: [] - e.g. resource_types: []
#     - Account-level rules check AWS account settings, not specific resources
#     - For rules that are evaluated periodically, use empty array: []
#   parameters: object (rule-specific configuration parameters, empty object if none)
#     Special cases:
#     - For STANDARD rules, all parameters are supported and will not be repated in this file. We use empty object: {}   
#   source_details: array of objects (OPTIONAL - only for CUSTOM rules, defines when the rule is triggered)
#     - event_source: string (e.g., "aws.config")
#     - message_type: string (e.g., "ConfigurationItemChangeNotification", "ScheduledNotification", "OversizedConfigurationItemChangeNotification")
#     - maximum_execution_frequency: string (OPTIONAL - only for ScheduledNotification, e.g., "TwentyFour_Hours")
#     Usage:
#     - Maps to the SourceDetails property in AWS::Config::ConfigRule CloudFormation resources
#     - Defines the event sources that trigger Lambda function evaluation
#     - For periodic evaluations, use MessageType: ScheduledNotification with MaximumExecutionFrequency
#     - For change-triggered evaluations, use MessageType: ConfigurationItemChangeNotification
#     - For large configuration items, also include MessageType: OversizedConfigurationItemChangeNotification

# Classification Taxonomy
# Level 1 categories based on the Tactics on the Threat Technique Catalog for AWS
# Level 2 categories based on the Techniques on the Threat Technique Catalog for AWS
taxonomy:
  level1_classification:
    - name: "Initial Access"
      abbreviation: "ia"
      description: "Techniques used to gain initial access to AWS environments"
      
    - name: "Execution"
      abbreviation: "ex"
      description: "Techniques that result in adversary-controlled code running on AWS resources"
      
    - name: "Persistence"
      abbreviation: "p"
      description: "Techniques used to maintain access to AWS environments"
      
    - name: "Privilege Escalation"
      abbreviation: "pe"
      description: "Techniques used to gain higher-level permissions in AWS"
      
    - name: "Defense Evasion"
      abbreviation: "da"
      description: "Techniques used to avoid detection in AWS environments"
      
    - name: "Credential Access"
      abbreviation: "ca"
      description: "Techniques used to steal AWS credentials"
      
    - name: "Discovery"
      abbreviation: "d"
      description: "Techniques used to gain knowledge about AWS environments"
    
    - name: "Lateral Movement"
      abbreviation: "lm"
      description: "Techniques used to enter and control remote AWS accounts and or AWS services"
      
    - name: "Collection"
      abbreviation: "c"
      description: "Techniques used to gather data from AWS resources to follow through on the adversary's objectives"
    
    - name: "Exfiltration"
      abbreviation: "e"
      description: "Techniques used to steal data from AWS environments"
      
    - name: "Impact"
      abbreviation: "i"
      description: "Techniques used to disrupt availability or compromise integrity"

    - name: "Resource Development"
      abbreviation: "rd"
      description: "Techniques used to develop new resources for AWS that can be used to support targeting"

  level2_classification:
    - name: "S3 Protection"
      abbreviation: "s3"
      description: "Security controls for Amazon S3 buckets and objects"
      
    - name: "IAM Protection"
      abbreviation: "iam"
      description: "Identity and Access Management security controls"
      
    - name: "EC2 Protection"
      abbreviation: "ec2"
      description: "Elastic Compute Cloud security controls"
    
    - name: "Resource Access Protection"
      abbreviation: "ra"
      description: "Security controls for VPC firewalls"

    - name: "VPC Security"
      abbreviation: "vpc"
      description: "Virtual Private Cloud network security controls"
      
    - name: "KMS Encryption"
      abbreviation: "kms"
      description: "Key Management Service encryption controls"
      
    - name: "RDS Security"
      abbreviation: "rds"
      description: "Relational Database Service security controls"
      
    - name: "Lambda Security"
      abbreviation: "lambda"
      description: "AWS Lambda function security controls"
      
    - name: "Valid Accounts"
      abbreviation: "va"
      description: "Account access and authentication controls"
      
    - name: "API Security"
      abbreviation: "api"
      description: "API Gateway and API access controls"
      
    - name: "CloudTrail Logging"
      abbreviation: "ct"
      description: "CloudTrail audit logging controls"
      
    - name: "Config Monitoring"
      abbreviation: "cfg"
      description: "AWS Config monitoring and compliance controls"
      
    - name: "EBS Security"
      abbreviation: "ebs"
      description: "Elastic Block Store security controls"
      
    - name: "Secrets Management"
      abbreviation: "sm"
      description: "Secrets Manager and credential protection controls"

# ======================================================
# AWS Config Rules
# ======================================================
rules:
  # Initial Access - IAM Protection
  - rule_name: "crcd-cirt-ia-iam-root-account-mfa-enabled"
    rule_type: "STANDARD"
    source_identifier: "ROOT_ACCOUNT_MFA_ENABLED"
    classification:
      level1: "Initial Access"
      level1_abbrev: "ia"
      level2: "IAM Protection"
      level2_abbrev: "iam"
    description: "Checks if the root user of your AWS account requires multi-factor authentication for console sign-in"
    rule_rationale: "The AWS account root user has unrestricted access to all resources within that account, its usage must be protected by Multi-Factor Authentication (MFA)."
    resource_types: []
    parameters:
      MaximumExecutionFrequency: "TwentyFour_Hours"

  - rule_name: "crcd-cirt-ia-iam-iam-root-access-key-check"
    rule_type: "STANDARD"
    source_identifier: "IAM_ROOT_ACCESS_KEY_CHECK"
    classification:
      level1: "Initial Access"
      level1_abbrev: "ia"
      level2: "IAM Protection"
      level2_abbrev: "iam"
    description: "Checks whether the root user access key exists"
    rule_rationale: "Root access keys provide unrestricted access to all AWS resources and are high-value targets for attackers. Recommendation: do not create root access keys and delete any that exist."
    resource_types: []
    parameters:
      MaximumExecutionFrequency: "TwentyFour_Hours"
  
  - rule_name: "crcd-cirt-ia-iam-iam-root-not-used-regularly"
    rule_type: "CUSTOM"
    source_identifier: "LAMBDA_NAME_PLACEHOLDER"
    classification:
      level1: "Initial Access"
      level1_abbrev: "ia"
      level2: "IAM Protection"
      level2_abbrev: "iam"
    description: "Checks whether the root user is not used regularly"
    rule_rationale: "Root users have unrestricted access to all AWS resources and are high-value targets for attackers. Recommendation: use this user as little as possible."
    resource_types: []
    parameters:
      # Number of days to look back for root account usage. If root was used within this threshold, the account is marked NON_COMPLIANT.
      RootUsageThresholdDays: "5"
    source_details:
      - event_source: "aws.config"
        message_type: "ScheduledNotification"
        maximum_execution_frequency: "TwentyFour_Hours"

  - rule_name: "crcd-cirt-ia-iam-iam-user-access-key-check"
    rule_type: "CUSTOM"
    source_identifier: "LAMBDA_NAME_PLACEHOLDER"
    classification:
      level1: "Initial Access"
      level1_abbrev: "ia"
      level2: "IAM Protection"
      level2_abbrev: "iam"
    description: "Checks whether an IAM user access key exists"
    rule_rationale: "Access keys provide unrestricted access to all AWS resources and are high-value targets for attackers. Recommendation: do not create access keys and delete any that exist."
    resource_types:
      - "AWS::IAM::User"
    parameters: {}
    source_details:
      #- event_source: "aws.config"
      #  message_type: "ConfigurationItemChangeNotification"
      #- event_source: "aws.config"
      #  message_type: "OversizedConfigurationItemChangeNotification"
      - event_source: "aws.config"
        message_type: "ScheduledNotification"
        maximum_execution_frequency: "TwentyFour_Hours"

  - rule_name: "crcd-cirt-ia-iam-iam-user-mfa-enabled"
    rule_type: "STANDARD"
    source_identifier: "IAM_USER_MFA_ENABLED"
    classification:
      level1: "Initial Access"
      level1_abbrev: "ia"
      level2: "IAM Protection"
      level2_abbrev: "iam"
    description: "Checks if the AWS Identity and Access Management (IAM) users have multi-factor authentication (MFA) enabled."
    rule_rationale: "Multi-factor authentication provides an additional layer of security against compromised credentials. CIRT frequently responds to incidents where attackers gained access using stolen IAM user credentials that lacked MFA protection. Enabling MFA significantly reduces the risk of unauthorized access even when passwords are compromised."
    resource_types:
      - "AWS::IAM::User"
    parameters: {}

  - rule_name: "crcd-cirt-ia-iam-mfa-enabled-for-iam-console-access"
    rule_type: "STANDARD"
    source_identifier: "MFA_ENABLED_FOR_IAM_CONSOLE_ACCESS"
    classification:
      level1: "Initial Access"
      level1_abbrev: "ia"
      level2: "IAM Protection"
      level2_abbrev: "iam"
    description: "Checks if AWS multi-factor authentication (MFA) is enabled for all AWS Identity and Access Management (IAM) users that use a console password."
    rule_rationale: "Multi-factor authentication provides an additional layer of security against compromised credentials. CIRT frequently responds to incidents where attackers gained access using stolen IAM user credentials that lacked MFA protection. Enabling MFA significantly reduces the risk of unauthorized access even when passwords are compromised."
    resource_types:
      - "AWS::IAM::User"
    parameters: {}

  # Initial Access - S3 Protection
  - rule_name: "crcd-cirt-ia-s3-s3-bucket-public-read-prohibited"
    rule_type: "STANDARD"
    source_identifier: "S3_BUCKET_PUBLIC_READ_PROHIBITED"
    classification:
      level1: "Initial Access"
      level1_abbrev: "ia"
      level2: "S3 Protection"
      level2_abbrev: "s3"
    description: "Checks that S3 buckets do not allow public read access"
    rule_rationale: "Publicly readable S3 buckets are a common attack vector for initial access and data exposure. CIRT frequently observes unauthorized access through misconfigured S3 bucket permissions."
    resource_types:
      - "AWS::S3::Bucket"
    parameters: {}

  - rule_name: "crcd-cirt-ia-s3-s3-bucket-public-write-prohibited"
    rule_type: "STANDARD"
    source_identifier: "S3_BUCKET_PUBLIC_WRITE_PROHIBITED"
    classification:
      level1: "Initial Access"
      level1_abbrev: "ia"
      level2: "S3 Protection"
      level2_abbrev: "s3"
    description: "Checks that S3 buckets do not allow public write access"
    rule_rationale: "Publicly writable S3 buckets can be exploited for data injection, malware distribution, and resource abuse. CIRT has observed attackers using public write access for cryptocurrency mining and botnet operations."
    resource_types:
      - "AWS::S3::Bucket"
    parameters: {}

  # Initial Access - EC2 Security
  - rule_name: "crcd-cirt-ia-ec2-autoscaling-launchconfig-requires-imdsv2"
    rule_type: "STANDARD"
    source_identifier: "AUTOSCALING_LAUNCHCONFIG_REQUIRES_IMDSV2"
    classification:
      level1: "Initial Access"
      level1_abbrev: "ia"
      level2: "EC2 Security"
      level2_abbrev: "ec2"
    description: "Checks whether Amazon EC2 Auto Scaling groups have launch configurations that require Instance Metadata Service Version 2 (IMDSv2)"
    rule_rationale: "IMDSv2 provides enhanced security for instance metadata by requiring session-oriented requests, which prevents Server-Side Request Forgery (SSRF) attacks. CIRT has observed attackers exploiting IMDSv1 to steal IAM credentials from EC2 instances. Requiring IMDSv2 significantly reduces the risk of credential theft through metadata service exploitation."
    resource_types:
      - "AWS::AutoScaling::LaunchConfiguration"
    parameters: {}

  - rule_name: "crcd-cirt-ia-ec2-ec2-imdsv2-check"
    rule_type: "STANDARD"
    source_identifier: "EC2_IMDSV2_CHECK"
    classification:
      level1: "Initial Access"
      level1_abbrev: "ia"
      level2: "EC2 Security"
      level2_abbrev: "ec2"
    description: "Checks whether EC2 instances are configured to require Instance Metadata Service Version 2 (IMDSv2)"
    rule_rationale: "IMDSv2 protects against SSRF attacks that attempt to access instance metadata and steal IAM credentials. CIRT frequently investigates incidents where attackers exploited IMDSv1 vulnerabilities to gain unauthorized access to temporary credentials. Enforcing IMDSv2 on all EC2 instances is a critical security control to prevent credential theft."
    resource_types:
      - "AWS::EC2::Instance"
    parameters: {}

  - rule_name: "crcd-cirt-ia-ec2-ec2-launch-template-imdsv2-check"
    rule_type: "STANDARD"
    source_identifier: "EC2_LAUNCH_TEMPLATE_IMDSV2_CHECK"
    classification:
      level1: "Initial Access"
      level1_abbrev: "ia"
      level2: "EC2 Security"
      level2_abbrev: "ec2"
    description: "Checks whether EC2 launch templates are configured to require Instance Metadata Service Version 2 (IMDSv2)"
    rule_rationale: "Launch templates define the configuration for EC2 instances, and requiring IMDSv2 in templates ensures all instances launched from them are protected against metadata service exploitation. CIRT recommends enforcing IMDSv2 at the template level to prevent misconfigurations and ensure consistent security posture across all instances launched from the template."
    resource_types:
      - "AWS::EC2::LaunchTemplate"
    parameters: {}

  # Initial Access - S3 Protection
  - rule_name: "crcd-cirt-ia-s3-s3-access-point-in-vpc-only"
    rule_type: "STANDARD"
    source_identifier: "S3_ACCESS_POINT_IN_VPC_ONLY"
    classification:
      level1: "Initial Access"
      level1_abbrev: "ia"
      level2: "S3 Protection"
      level2_abbrev: "s3"
    description: "Checks whether Amazon S3 access points are configured to only allow access from within a VPC"
    rule_rationale: "S3 access points that allow public internet access increase the attack surface for data exfiltration and unauthorized access. CIRT recommends restricting S3 access points to VPC-only access to ensure data can only be accessed through controlled network paths. This prevents direct internet-based attacks and provides an additional layer of network-level security for sensitive data stored in S3."
    resource_types:
      - "AWS::S3::AccessPoint"
    parameters: {}

  - rule_name: "crcd-cirt-ia-s3-s3-access-point-public-access-blocks"
    rule_type: "STANDARD"
    source_identifier: "S3_ACCESS_POINT_PUBLIC_ACCESS_BLOCKS"
    classification:
      level1: "Initial Access"
      level1_abbrev: "ia"
      level2: "S3 Protection"
      level2_abbrev: "s3"
    description: "Checks whether Amazon S3 access points have public access block settings enabled"
    rule_rationale: "Public access block settings on S3 access points provide defense-in-depth protection against accidental public exposure of data. CIRT recommends enabling all public access block settings on S3 access points to prevent misconfigurations that could lead to data breaches. These settings work in conjunction with bucket policies and access point policies to ensure comprehensive protection against unauthorized public access."
    resource_types:
      - "AWS::S3::AccessPoint"
    parameters: {}

  - rule_name: "crcd-cirt-ia-s3-s3-account-level-public-access-blocks-periodic"
    rule_type: "STANDARD"
    source_identifier: "S3_ACCOUNT_LEVEL_PUBLIC_ACCESS_BLOCKS_PERIODIC"
    classification:
      level1: "Initial Access"
      level1_abbrev: "ia"
      level2: "S3 Protection"
      level2_abbrev: "s3"
    description: "Periodically checks whether Amazon S3 account-level public access block settings remain enabled"
    rule_rationale: "Continuous monitoring of account-level public access block settings ensures they remain enabled and have not been inadvertently disabled. CIRT recommends periodic evaluation to detect and alert on any changes to these critical security controls. This periodic check complements change-triggered evaluations and provides assurance that account-level protections are consistently maintained."
    resource_types: []
    parameters:
      MaximumExecutionFrequency: "TwentyFour_Hours"

  - rule_name: "crcd-cirt-ia-s3-s3-bucket-level-public-access-prohibited"
    rule_type: "STANDARD"
    source_identifier: "S3_BUCKET_LEVEL_PUBLIC_ACCESS_PROHIBITED"
    classification:
      level1: "Initial Access"
      level1_abbrev: "ia"
      level2: "S3 Protection"
      level2_abbrev: "s3"
    description: "Checks if S3 buckets are publicly accessible"
    rule_rationale: "Bucket-level public access blocks provide defense-in-depth protection against accidental exposure. CIRT recommends this control to prevent configuration errors from exposing sensitive data. This rule checks individual bucket settings and complements account-level public access blocks, ensuring comprehensive protection against unauthorized public access to S3 data."
    resource_types:
      - "AWS::S3::Bucket"
    parameters: {}

  - rule_name: "crcd-cirt-ia-ra-vpc-sg-port-restriction-check"
    rule_type: "STANDARD"
    source_identifier: "VPC_SG_PORT_RESTRICTION_CHECK"
    classification:
      level1: "Initial Access"
      level1_abbrev: "ia"
      level2: "Resource Access Protection"
      level2_abbrev: "ra"
    description: "Checks whether security groups allow unrestricted inbound ports"
    rule_rationale: "Unrestricted inbound ports enable lateral movement within AWS environments. CIRT frequently observes attackers exploiting open ports to move between resources."
    resource_types:
      - "AWS::EC2::SecurityGroup"
    parameters: {}


# Naming Convention Documentation
naming_convention:
  format: "crcd-cirt-<lv1>-<lv2>-<rule-name>"
  components:
    - name: "crcd-cirt"
      description: "Fixed prefix identifying CRCD CIRT conformance pack rules"
    - name: "lv1"
      description: "Level 1 classification abbreviation (e.g., ia, p, pe)"
    - name: "lv2"
      description: "Level 2 classification abbreviation (e.g., s3, iam, vpc)"
    - name: "rule-name"
      description: "Descriptive rule name in kebab-case"
  examples:
    - "crcd-cirt-ia-s3-s3-bucket-public-read-prohibited"
    - "crcd-cirt-p-va-iam-root-access-key-check"
    - "crcd-cirt-pe-iam-iam-policy-no-statements-with-admin-access"

