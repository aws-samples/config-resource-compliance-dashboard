  # *************************************************************************************************************************
  # *************************************************************************************************************************
  # Transient bucket - Case 2.1 (multi-account, Dashboard account) ONLY.
  # In a multi-account deployment the AWS Config Logs bucket lives in the AWS Config account and its
  # objects are replicated (cross-account, same-region) into this transient bucket in the Dashboard
  # account. Because this bucket is in the same account as the Producer Lambda, it triggers the
  # Lambda directly (native S3 event notification), exactly like the AWS Config Logs bucket does in
  # a single-account deployment (case 1). This bucket is NOT created in case 1.
  #
  # - Versioning is enabled because S3 replication requires the destination bucket to be versioned.
  # - Objects are expired after 5 days (they are transient: once pre-processed they are not needed).
  # - Encryption mirrors the Dashboard bucket: a new KMS key when the AWS Config Logs bucket is
  #   KMS-encrypted (IsConfigLogsBucketKms), otherwise SSE-S3 (AES256).
  # *************************************************************************************************************************
  # *************************************************************************************************************************

  TransientBucket:
  # checkov:skip=CKV_AWS_18: No need of Access Logging, customers will add it if required
    Type: AWS::S3::Bucket
    Condition: IsDashboardAccountDeployment
    DependsOn: LambdaInvocationPermissionTransientBucket
    DeletionPolicy: "Delete"
    UpdateReplacePolicy: "Delete"
    Properties:
      BucketName: !Sub '${TransientBucketNamePrefix}-${AWS::AccountId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - !If
            - IsCreatePreProcessingResourcesKms
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: 'aws:kms'
                KMSMasterKeyID: !GetAtt DashboardBucketKmsKey.Arn
              BucketKeyEnabled: true
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256
      # Replication into this bucket requires versioning to be enabled.
      VersioningConfiguration:
        Status: Enabled
      # Transient data: expire objects (and noncurrent versions) after 5 days.
      LifecycleConfiguration:
        Rules:
          - Id: ExpireTransientConfigFiles
            Status: Enabled
            ExpirationInDays: 5
            NoncurrentVersionExpiration:
              NoncurrentDays: 5
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 5
      # Deliver every new (replicated) object straight to the Producer Lambda, same as case 1.
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: 's3:ObjectCreated:*'
            Function: !GetAtt ConfigFilePreprocessingProducerLambda.Arn
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      # BSC12 risk mitigation
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

