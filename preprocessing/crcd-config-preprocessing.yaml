              - "s3:ReplicateDelete"
            Resource: !Sub "${TransientBucket.Arn}/*"
          - Sid: "ReplicationPermissionsBucket"
            Effect: "Allow"
            Principal:
              AWS: !Ref ConfigAccountId
            Action:
              - "s3:List*"
              - "s3:GetBucketVersioning"
              - "s3:PutBucketVersioning"
            Resource: !GetAtt TransientBucket.Arn


