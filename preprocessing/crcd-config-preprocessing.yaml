  ConditionIsConfigLogsBucketKms:
    Description: "Development: the AWS Config Logs bucket is encrypted with a KMS key"
    Value: !If [IsConfigLogsBucketKms, 'true', 'false']

  ConditionIsCreatePreProcessingResourcesKms:
    Description: "Development: create preprocessing resources AND the AWS Config Logs bucket is KMS-encrypted"
    Value: !If [IsCreatePreProcessingResourcesKms, 'true', 'false']

  ConditionIsConfigureS3EventNotificationToLambdaJobProducer:
    Description: "Development: case 1 - configure the S3 event notification to trigger the Producer Lambda directly"
    Value: !If [IsConfigureS3EventNotificationToLambdaJobProducer, 'true', 'false']
