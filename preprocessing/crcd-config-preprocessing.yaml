  # bucket name (not !GetAtt TransientBucket.Arn) to avoid a circular dependency: the bucket's
  # NotificationConfiguration references the Lambda, and this permission must exist before it.
  LambdaInvocationPermissionTransientBucket:
    Type: AWS::Lambda::Permission
    Condition: IsDashboardAccountDeployment
    DeletionPolicy: "Delete"
    UpdateReplacePolicy: "Delete"
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ConfigFilePreprocessingProducerLambda
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:${AWS::Partition}:s3:::${TransientBucketNamePrefix}-${AWS::AccountId}-${AWS::Region}"

  # Case 2.1 (multi-account): authorize replication into the transient bucket from the AWS Config
  # account. The replication service role is created in the AWS Config account (step 2.2) and does
  # not exist yet here, so - like the main dashboard stack - we grant the whole AWS Config account
  # root; the role's own IAM policy (step 2.2) is what actually uses these permissions.
  TransientBucketReplicationPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: IsDashboardAccountDeployment
    DeletionPolicy: "Delete"
    UpdateReplacePolicy: "Delete"
    Properties:
