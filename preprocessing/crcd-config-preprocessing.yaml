  # KMS key that encrypts the Dashboard bucket, created only when the AWS Config Logs bucket is
  # KMS-encrypted. The preprocessing components (producer Lambda, script uploader, Fargate task)
  # get the required kms permissions via their IAM roles; the key policy trusts the account root.
  DashboardBucketKmsKey:
    Type: AWS::KMS::Key
    Condition: IsCreatePreProcessingResourcesKms
    DeletionPolicy: "Delete"
    UpdateReplacePolicy: "Delete"
    Properties:
      Description: "CRCD Preprocessing - Key that encrypts the Dashboard bucket (created when the AWS Config Logs bucket is KMS-encrypted)"
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Id: crcd-preprocessing-dashboardkey-policy
        Statement:
          - Sid: 'Enable IAM user permissions'
            Effect: Allow
            Principal:
              AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root"
            Action: 'kms:*'
            Resource: '*'
          # Case 2.1 (multi-account) only: allow the AWS Config account to use this key to encrypt
          # the objects it replicates into the transient bucket. The replication role is created in
          # the AWS Config account (step 2.2) and does not exist yet, so - like the main dashboard
          # stack - we grant the AWS Config account root; the role's own IAM policy (step 2.2) uses it.
          - !If
            - IsDashboardAccountDeploymentKms
            - Sid: 'Allow AWS Config account use the key for replication'
              Effect: Allow
