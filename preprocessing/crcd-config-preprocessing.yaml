# Config Compliance Resource Dashboard - preprocessing 
# In environments with a large number of resources, AWS Config may generate files that are bigger that 32MB (uncompressed).
# This will break an Athena service limit and make it impossible to run queries, as all queries that try to open one of those files will fail.
# These resources will pre-process AWS Config files and generate smaller files that can potentially avoid the issue.


# The following use cases are supported
#
# 1. Single-account deployment (all in the AWS Config account) - supports standalone accounts and AWS Organizations
#    The AWS Config account and the Dashboard account are the same account (ConfigAccountId = DashboardAccountId = this account).
#    The AWS Config Logs bucket is the source of data, the Producer Lambda is triggered directly from that bucket,
#    and preprocessing writes the result files to a new Dashboard bucket created in the same account.
#    If the AWS Config Logs bucket is encrypted with a KMS key, the Dashboard bucket is also encrypted (with a new key this template creates).
#
# 2. Multi-account deployment (preprocessing runs in the Dashboard account, AWS Config Logs bucket is in the AWS Config account)
#    The AWS Config account replicates its AWS Config files into a transient bucket in the Dashboard account, and
#    preprocessing runs within the Dashboard account reading from that transient bucket. Deployed in two steps:
#
#    2.1 - Run this template on the Dashboard account FIRST.
#    Installs the preprocessing resources (Producer Lambda + its role, VPC/Fargate, DynamoDB, Dashboard bucket) and
#    the transient bucket (versioned, with a tight lifecycle) that receives the replicated AWS Config files and is the
#    source that triggers the Producer Lambda. Outputs the transient bucket name for use in step 2.2.
#
#    2.2 - Run on the AWS Config account SECOND.
#    Installs cross-account S3 replication from the AWS Config Logs bucket to the transient bucket from step 2.1 (its
#    name is provided as an input): the replication configuration, the replication IAM role, and, if the AWS Config
#    Logs bucket is KMS-encrypted, the KMS grants needed for replication.


AWSTemplateFormatVersion: '2010-09-09'
Description: 'AWS Config Resource Compliance Dashboard (CRCD) - Preprocessing AWS Config files using AWS Fargate'

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      -
        Label:
          default: "AWS Config logging - the source of data for the preprocessing job, where your AWS Config files are delivered"
        Parameters:
          - ConfigAccountId
          - ConfigBucketName
          - ConfigBucketKmsKeyArn
      -
        Label: 
          default: "Preprocessing destination - where you will deploy the dashboard and where its data is"
        Parameters:
          - DashboardAccountId
          - ConfigureS3EventNotificationToLambdaJobProducer
      -
        Label:
          default: "Multi-account deployment - configure replication of config data"
        Parameters:
          - ConfigureS3Replication
          - TransientBucketNameForReplication
          - TransientBucketKmsKeyArn
      -
        Label:
          default: "Technical Parameters (DO NOT CHANGE)"
        Parameters:
          - DashboardBucketNamePrefix
          - TransientBucketNamePrefix
          - PreProcessingLambdaProducerName
          - DynamoDBJobTrackingTableName
          - LambdaSupportJobTriggerConfigurationName
          - LambdaSupportScriptUploaderName
          - LambdaSupportECSServiceRoleName
          - PreProcessingCrossAccountReplicationRole
          - PreProcessingReplicationConfigurationLambdaName
    
    ParameterLabels:
      ConfigAccountId:
        default: "AWS Config account ID"
      ConfigBucketName:
        default: "AWS Config Logs bucket"
      ConfigBucketKmsKeyArn:
        default: "AWS Config Logs bucket KMS key ARN (optional)"
      DashboardAccountId:
        default: "Dashboard account ID"
      DashboardBucketNamePrefix:
        default: "Dashboard bucket (prefix)"
      TransientBucketNamePrefix:
        default: "Transient bucket (prefix)"
      DynamoDBJobTrackingTableName:
        default: "Dynamo DB tracking table"
      ConfigureS3EventNotificationToLambdaJobProducer:
        default: "Configure S3 event notification to trigger the job automatically on every new AWS Config file"
      LambdaSupportJobTriggerConfigurationName:
        default: "Name of the Lambda function that performs supporting configurations: S3 object notification"
      PreProcessingLambdaProducerName:
        default: "Name of the Lambda function that triggers the preprocessing job"
      LambdaSupportScriptUploaderName:
        default: "Name of the Lambda function that uploads the preprocessing script to S3"
      LambdaSupportECSServiceRoleName:
        default: "Name of the Lambda function that ensures the ECS service-linked role exists"
      ConfigureS3Replication:
        default: "Configure cross-account replication of AWS Config files to the transient bucket"
      TransientBucketNameForReplication:
        default: "Transient bucket name (replication destination)"
      TransientBucketKmsKeyArn:
        default: "Transient bucket KMS key ARN (required if the AWS Config Logs bucket is KMS-encrypted)"
      PreProcessingCrossAccountReplicationRole:
        default: "Name of the IAM role used for cross-account replication of AWS Config files"
      PreProcessingReplicationConfigurationLambdaName:
        default: "Name of the Lambda function that configures S3 replication on the AWS Config Logs bucket"


Parameters:
  ConfigAccountId:
    Type: String
    Description: "The ID of the AWS account that contains the Amazon S3 bucket collecting AWS Config files (Required)."
    AllowedPattern: '\d{12}'
    MinLength: 12
    ConstraintDescription: "AWS Config account ID is missing or incorrect: AWS account IDs must be a 12-digit number."

  ConfigBucketName:
    Type: String
    Description: "Name of the Amazon S3 bucket collecting AWS Config files (Required)."
    MinLength: 1
    AllowedPattern: '^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$'
    ConstraintDescription: "AWS Config Logs bucket name is missing or does not satisfy the Amazon S3 naming convention."

  ConfigBucketKmsKeyArn:
    Type: String
    Default: ""
    Description: "Optional. If your AWS Config Logs bucket is encrypted with a KMS key, provide the key's ARN here so the preprocessing job can decrypt the source files. When provided, the Dashboard bucket created by this template will also be encrypted with a new KMS key. Leave empty if the bucket is not encrypted with KMS."
    AllowedPattern: '^$|^arn:(aws|aws-us-gov|aws-cn):kms:\w+(?:-\w+)+:\d{12}:key\/[A-Za-z0-9]+(?:-[A-Za-z0-9]+)+$'
    ConstraintDescription: "The KMS key ARN does not satisfy the conventions for a KMS Amazon Resource Name [arn:<aws_partition>:kms:<aws_region>:<account_id>:key/<key_id>]."

  DashboardAccountId:
    Type: String
    Description: "The ID of the AWS account that will contain the dashboard's data pipeline resources and the Amazon S3 bucket that is used as source of data for the dashboard. Insert the value of \"AWS Config account ID\" if you want to deploy the dashboard in the same account where AWS Config files are collected. To deploy the dashboard on a dedicated account, insert another existing AWS account ID (Required)."
    AllowedPattern: '\d{12}'
    MinLength: 12
    ConstraintDescription: "Dashboard account ID is missing or incorrect: AWS account IDs must be a 12-digit number."

  DashboardBucketNamePrefix:
    Type: String
    Description: "Prefix of the Amazon S3 bucket that will store the transformed AWS Config files. This will be the source of data for the dashboard. The Dashboard bucket will be created with the prefix you specify here, account ID and region will be added automatically (Required)."
    AllowedPattern: '^[a-z0-9][a-z0-9-]{1,30}[a-z0-9]$'
    MinLength: 1
    Default: 'crcd-dashboard-bucket' 
    ConstraintDescription: "Dashboard bucket prefix name is missing or does not satisfy the Amazon S3 naming convention."

  TransientBucketNamePrefix:
    Type: String
    Description: "Prefix of the Amazon S3 bucket that receives the replicated AWS Config files in a multi-account (Dashboard account) deployment. The Transient bucket will be created with the prefix you specify here, account ID and region will be added automatically (Required)."
    AllowedPattern: '^[a-z0-9][a-z0-9-]{1,30}[a-z0-9]$'
    MinLength: 1
    Default: 'crcd-transient-bucket'
    ConstraintDescription: "Transient bucket prefix name is missing or does not satisfy the Amazon S3 naming convention."

  PreProcessingLambdaProducerName:
    Type: String
    Default: "crcd-config-preprocessing-producer"
    MinLength: 1
    ConstraintDescription: "Required: AWS Lambda function that triggers the preprocessing job of AWS Config files."
    Description: "Name of the AWS Lambda function that triggers the preprocessing job of AWS Config files (Required)."


  DynamoDBJobTrackingTableName:
    Type: String
    Default: 'CRCDPreprocessingJobTracking'
    MinLength: 1
    ConstraintDescription: "Required: name of the Amazon DynamoDB table used to track the activities of the preprocessing job."
    Description: "Name of the Amazon DynamoDB table used to track the activities of the preprocessing job (Required)."

  # The way the notification is built is different
  # Case 1: s3 notification from the Config Logs bucket directly to the lambda producer
  # Case 2.1: s3 notification from the transient bucket to the lambda producer
  # Case 2.2: not used 
  ConfigureS3EventNotificationToLambdaJobProducer:
    Type: "String"
    Description:  "Only used when deploying in the AWS Config account (single-account deployment); ignored when deploying in a dedicated Dashboard account. Select 'yes' to let this template configure the S3 event notification on the AWS Config Logs bucket that triggers the preprocessing job whenever a new AWS Config file is delivered. Select 'no' if you already have S3 event notifications configured on the AWS Config Logs bucket, in which case you must configure them manually."
    AllowedValues: ['<select>', 'yes', 'no']
    Default: "<select>" # This value is used below, careful if you change it

  # *** Multi-account deployment - replication of config data (only used in the AWS Config account step, case 2.2) ***

  ConfigureS3Replication:
    Type: "String"
    Description: "Only used in a multi-account deployment when running this template in the AWS Config account setup; ignored otherwise. Select 'yes' to let this template configure cross-account S3 replication from the AWS Config Logs bucket to the transient bucket in the Dashboard account. Select 'no' if you already have an S3 replication configuration on the AWS Config Logs bucket, in which case you must configure it manually (this template will not modify existing replication)."
    AllowedValues: ['<select>', 'yes', 'no']
    Default: "<select>"

  TransientBucketNameForReplication:
    Type: String
    Default: ""
    Description: "Only used in a multi-account deployment when running this template in the AWS Config account setup. The name of the transient bucket in the Dashboard account that receives the replicated AWS Config files - copy the value of the 'TransientBucketName' output from the Dashboard account setup. Leave empty otherwise."

  TransientBucketKmsKeyArn:
    Type: String
    Default: ""
    Description: "Only used in a multi-account deployment when running this template in the AWS Config account setup, and only if the AWS Config Logs bucket is KMS-encrypted. The ARN of the KMS key that encrypts the transient bucket - copy the value of the 'DashboardBucketKmsKeyArn' output from the Dashboard account setup. Leave empty if the AWS Config Logs bucket is not KMS-encrypted."
    AllowedPattern: '^$|^arn:(aws|aws-us-gov|aws-cn):kms:\w+(?:-\w+)+:\d{12}:key\/[A-Za-z0-9]+(?:-[A-Za-z0-9]+)+$'
    ConstraintDescription: "The KMS key ARN does not satisfy the conventions for a KMS Amazon Resource Name [arn:<aws_partition>:kms:<aws_region>:<account_id>:key/<key_id>]."

  LambdaSupportJobTriggerConfigurationName:
    Type: "String"
    Default: "crcd-support-configure-s3-notification-preprocessing-job"
    MinLength: 1
    ConstraintDescription: "Required: AWS Lambda function that configures S3 notifications on the AWS Config Logs bucket."
    Description: "Name of the AWS Lambda function that configures S3 notifications on the AWS Config Logs bucket (Required)."

  LambdaSupportScriptUploaderName:
    Type: "String"
    Default: "crcd-support-upload-preprocessing-script"
    MinLength: 1
    ConstraintDescription: "Required: AWS Lambda function that uploads the preprocessing script to S3."
    Description: "Name of the AWS Lambda function that uploads the preprocessing script to S3 (Required)."

  LambdaSupportECSServiceRoleName:
    Type: "String"
    Default: "crcd-support-ensure-ecs-service-role"
    MinLength: 1
    ConstraintDescription: "Required: AWS Lambda function that ensures the ECS service-linked role exists."
    Description: "Name of the AWS Lambda function that ensures the ECS service-linked role exists (Required)."

  PreProcessingCrossAccountReplicationRole:
    Type: "String"
    # cannot concatenate with source bucket name as there is a limit on 64 characters for role names
    Default: "crcd-preproc-s3replication-role"
    MinLength: 1
    ConstraintDescription: "Required: name of the IAM role used for cross-account replication of AWS Config files."
    Description: "Name of the S3 service role used to replicate AWS Config files from the AWS Config Logs bucket to the transient bucket (Required)."

  PreProcessingReplicationConfigurationLambdaName:
    Type: "String"
    Default: "crcd-support-configure-s3-replication-preprocessing"
    MinLength: 1
    ConstraintDescription: "Required: AWS Lambda function that configures S3 replication on the AWS Config Logs bucket."
    Description: "Name of the AWS Lambda function that configures S3 replication on the AWS Config Logs bucket (Required)."

Conditions:
  IsConfigureS3EventNotificationToLambdaJobProducer:
    # Case 1 ONLY: configure the S3 event notification on the AWS Config Logs bucket to trigger the
    # Producer Lambda directly (same account). This condition is deliberately false in case 2.1
    # (the transient bucket in the Dashboard account wires its own notification to the Producer
    # Lambda) and case 2.2 (the AWS Config account only sets up S3 replication, no notification).
    # some customers may already have S3 notifications out of the AWS Config Logs bucket
    # we must not override that - and users will have to do that manually later
    Fn::And:
    - !Equals [!Ref ConfigureS3EventNotificationToLambdaJobProducer, 'yes']
    - !Condition IsConfigAccountDeployment

  # The AWS Config Logs bucket is encrypted with a KMS key. When set, the preprocessing job needs
  # kms:Decrypt on that key to read the source files, and the Dashboard bucket is created encrypted
  # with a new KMS key that this template provisions.
  IsConfigLogsBucketKms:
    !Not [!Equals [!Ref ConfigBucketKmsKeyArn, '']]

  # Single-account deployment: the full preprocessing stack is deployed in the AWS Config account,
  # i.e. the AWS Config account, the Dashboard account, and the current (deploying) account are all
  # the same. This is the functionality currently built.
  # NOTE: unlike the main dashboard stack, we do NOT compare bucket names here - in preprocessing
  # the source AWS Config Logs bucket and the created Dashboard bucket are always different buckets.
  IsConfigAccountDeployment:
    Fn::And:
      - !Equals [!Ref ConfigAccountId, !Ref 'AWS::AccountId']
      - !Equals [!Ref ConfigAccountId, !Ref DashboardAccountId]

  # Case 2.2: this stack is run in the AWS Config account of a multi-account deployment, whose only
  # job is to set up the S3 replication from the AWS Config Logs bucket to the Transient bucket on the Dashboard account. 
  # That is, we are deploying in the AWS Config account (ConfigAccountId == the current account) and it is a
  # multi-account setup (ConfigAccountId != DashboardAccountId). Mutually exclusive with case 1
  # (needs Config == Dashboard) and case 2.1 (needs Dashboard == the current account).
  IsConfigAccountNotificationDeployment:
    Fn::And:
      - !Equals [!Ref ConfigAccountId, !Ref 'AWS::AccountId']
      - !Not [!Equals [!Ref ConfigAccountId, !Ref DashboardAccountId]]

  # True when this stack configures the S3 event notification on the AWS Config Logs bucket. Today
  # this is only case 1 (single account, to the Producer Lambda directly). The support Lambda that
  # performs the configuration reads the NotificationConfiguration supplied by the trigger resource.
  IsConfigureBucketNotification:
    !Condition IsConfigureS3EventNotificationToLambdaJobProducer

  # The Dashboard-bucket KMS resources (the KMS key, bucket encryption, and the roles' kms grants) are
  # created whenever we create preprocessing resources (use case 1 or 2.1) AND the AWS Config Logs
  # bucket is encrypted with a KMS key.
  IsCreatePreProcessingResourcesKms:
    Fn::And:
      - !Condition IsCreatePreProcessingResources
      - !Condition IsConfigLogsBucketKms

  # Resources common to use case 1 (single account) and use case 2.1 (Dashboard account) - e.g. the
  # Producer Lambda, VPC/Fargate, DynamoDB tracking table, Dashboard bucket. Both of those use cases
  # deploy in the Dashboard account, so these resources are created whenever this stack runs in the
  # Dashboard account (DashboardAccountId == the current account). In use case 2.2 (run in the AWS
  # Config account) DashboardAccountId != the current account, so these resources are not created.
  IsCreatePreProcessingResources:
    !Equals [!Ref DashboardAccountId, !Ref 'AWS::AccountId']

  # Case 2.1 only: this stack is run in the Dashboard account of a multi-account deployment. We are
  # deploying in the Dashboard account (DashboardAccountId == the current account) AND it is a
  # multi-account setup (ConfigAccountId != DashboardAccountId).
  # Mutually exclusive with case 1 (needs Config == Dashboard) and case 2.2 (needs Config == current).
  IsDashboardAccountDeployment:
    Fn::And:
      - !Equals [!Ref DashboardAccountId, !Ref 'AWS::AccountId']
      - !Not [!Equals [!Ref ConfigAccountId, !Ref DashboardAccountId]]

  # Case 2.1 where the AWS Config Logs bucket (in the AWS Config account) is encrypted with a KMS key.
  IsDashboardAccountDeploymentKms:
    Fn::And:
      - !Condition IsDashboardAccountDeployment
      - !Condition IsConfigLogsBucketKms

  # Case 1 (single-account) where the AWS Config Logs bucket is encrypted with a KMS key. Only in
  # this case do the preprocessing components read the AWS Config Logs bucket directly, so only here
  # do they need kms:Decrypt on the customer-provided source key (ConfigBucketKmsKeyArn). In case 2.1
  # the components read the transient bucket instead, which is encrypted with the template's own
  # DashboardBucketKmsKey, so the source key grant must NOT be added there.
  IsConfigAccountDeploymentKms:
    Fn::And:
      - !Condition IsConfigAccountDeployment
      - !Condition IsConfigLogsBucketKms

  # Case 2.2: configure cross-account S3 replication from the AWS Config Logs bucket to the transient
  # bucket. Gated by the yes/no toggle so customers who already manage replication can opt out.
  IsConfigureS3Replication:
    Fn::And:
      - !Condition IsConfigAccountNotificationDeployment
      - !Equals [!Ref ConfigureS3Replication, 'yes']

  # Case 2.2 replication where the buckets are KMS-encrypted. Driven by the destination (transient
  # bucket) key ARN being provided; the ValidateReplicationKmsArns rule enforces that the source and
  # destination key ARNs are supplied together (both or none).
  IsS3ReplicationKms:
    Fn::And:
      - !Condition IsConfigureS3Replication
      - !Not [!Equals [!Ref TransientBucketKmsKeyArn, '']]

Rules:
  MandatoryConfigAccountId:
    Assertions:
      - Assert: !Not
        - !Equals
          - !Ref ConfigAccountId
          - ''
        AssertDescription: "AWS Config account ID is required"

  MandatoryDashboardAccountId:
    Assertions:
      - Assert: !Not
        - !Equals
          - !Ref DashboardAccountId
          - ''
        AssertDescription: "Dashboard account ID is required"

  MandatoryConfigBucketName:
    Assertions:
      - Assert: !Not
         - !Equals
          - !Ref ConfigBucketName
          - ''
        AssertDescription: "AWS Config Logs bucket name is required"

  MandatoryDashboardBucketNamePrefix:
    Assertions:
      - Assert: !Not
        - !Equals
          - !Ref DashboardBucketNamePrefix
          - ''
        AssertDescription: "Dashboard bucket name prefix is required"

  MandatoryTransientBucketNamePrefix:
    Assertions:
      - Assert: !Not
        - !Equals
          - !Ref TransientBucketNamePrefix
          - ''
        AssertDescription: "Transient bucket name prefix is required"
  
  MandatoryPreProcessingLambdaProducerName:
    Assertions:
      - Assert: !Not
        - !Equals
          - !Ref PreProcessingLambdaProducerName
          - ''
        AssertDescription: "Lambda function name is required"


  MandatoryLambdaSupportJobTriggerConfigurationName:
    Assertions:
      - Assert: !Not
        - !Equals
          - !Ref LambdaSupportJobTriggerConfigurationName
          - ''
        AssertDescription: "Lambda function name is required"

  MandatoryLambdaSupportScriptUploaderName:
    Assertions:
      - Assert: !Not
        - !Equals
          - !Ref LambdaSupportScriptUploaderName
          - ''
        AssertDescription: "Lambda function name is required"

  MandatoryLambdaSupportECSServiceRoleName:
    Assertions:
      - Assert: !Not
        - !Equals
          - !Ref LambdaSupportECSServiceRoleName
          - ''
        AssertDescription: "Lambda function name is required"

  MandatoryDynamoDBJobTrackingTableName:
    Assertions:
      - Assert: !Not
        - !Equals
          - !Ref DynamoDBJobTrackingTableName
          - ''
        AssertDescription: "DynamoDB tracking table name is required"


  # confirm this is needed and enforced in case 1 only. 
  ValidateConfigureS3EventNotificationToLambdaJobProducer:
    # This parameter is only consumed in use case 1 (single account), where the notification on the
    # AWS Config Logs bucket triggers the Producer Lambda directly and the user must choose whether
    # this template configures it.
    # In use case 2.1 (dedicated Dashboard account) the notification from the transient bucket to the
    # Producer Lambda is wired automatically since we control all resources, so the parameter is
    # ignored and must not be forced off '<select>'.
    # In use case 2.2 (AWS Config account step of a multi-account deployment) the parameter is also
    # ignored (that step only sets up S3 replication, no notification).
    # The RuleCondition below is exactly the case 1 condition (IsConfigAccountDeployment):
    # ConfigAccountId == this account AND ConfigAccountId == DashboardAccountId. Rules cannot use
    # !Condition, so the logic is spelled out here. This isolates case 1 from case 2.2, which also
    # runs in the AWS Config account but has ConfigAccountId != DashboardAccountId.
    RuleCondition: !And
      - !Equals [!Ref ConfigAccountId, !Ref 'AWS::AccountId']
      - !Equals [!Ref ConfigAccountId, !Ref DashboardAccountId]
    Assertions:
      - Assert: !Not
        - !Equals
          - !Ref ConfigureS3EventNotificationToLambdaJobProducer
          - '<select>'
        AssertDescription: "REQUIRED when deploying in the AWS Config account (i.e. single-account deployment). Select 'yes' to let this template configure the S3 event notification on the AWS Config Logs bucket - it will trigger the Producer Lambda directly. Select 'no' if you already have S3 event notifications on the AWS Config Logs bucket and will configure them manually. This parameter is ignored when deploying in a dedicated Dashboard account."

  MandatoryPreProcessingCrossAccountReplicationRole:
    Assertions:
      - Assert: !Not
        - !Equals
          - !Ref PreProcessingCrossAccountReplicationRole
          - ''
        AssertDescription: "Cross-account replication role name is required"

  MandatoryPreProcessingReplicationConfigurationLambdaName:
    Assertions:
      - Assert: !Not
        - !Equals
          - !Ref PreProcessingReplicationConfigurationLambdaName
          - ''
        AssertDescription: "Replication configuration Lambda function name is required"

  # ConfigureS3Replication is REQUIRED in use case 2.2 (AWS Config account step of a multi-account
  # deployment), ignored otherwise. The RuleCondition is exactly the case 2.2 condition
  # (IsConfigAccountNotificationDeployment): ConfigAccountId == this account AND
  # ConfigAccountId != DashboardAccountId. Rules cannot use !Condition, so it is spelled out here.
  ValidateConfigureS3Replication:
    RuleCondition: !And
      - !Equals [!Ref ConfigAccountId, !Ref 'AWS::AccountId']
      - !Not [!Equals [!Ref ConfigAccountId, !Ref DashboardAccountId]]
    Assertions:
      - Assert: !Not
        - !Equals
          - !Ref ConfigureS3Replication
          - '<select>'
        AssertDescription: "REQUIRED when deploying in the AWS Config account setup of a multi-account deployment. Select 'yes' to let this template configure S3 replication of AWS Config files from the AWS Config Logs bucket to the transient bucket. Select 'no' if you already have S3 replication configured on the AWS Config Logs bucket and will configure it manually."

  # In use case 2.2, the transient bucket name is always required, and the two KMS key ARNs must be
  # provided together (both or none): if the AWS Config Logs bucket is KMS-encrypted the transient
  # bucket key ARN must be supplied, and vice-versa. RuleCondition is the case 2.2 condition.
  ValidateReplicationKmsArns:
    RuleCondition: !And
      - !Equals [!Ref ConfigAccountId, !Ref 'AWS::AccountId']
      - !Not [!Equals [!Ref ConfigAccountId, !Ref DashboardAccountId]]
    Assertions:
      - Assert: !Not
        - !Equals
          - !Ref TransientBucketNameForReplication
          - ''
        AssertDescription: "REQUIRED in the AWS Config account setup: provide the transient bucket name (the 'TransientBucketName' output from the Dashboard account setup)."
      - Assert: !Or
        - !Equals [!Ref ConfigBucketKmsKeyArn, '']
        - !Not [!Equals [!Ref TransientBucketKmsKeyArn, '']]
        AssertDescription: "The AWS Config Logs bucket is KMS-encrypted (ConfigBucketKmsKeyArn is set), so the transient bucket KMS key ARN (TransientBucketKmsKeyArn) is also required. Provide the 'DashboardBucketKmsKeyArn' output from the Dashboard account setup."
      - Assert: !Or
        - !Equals [!Ref TransientBucketKmsKeyArn, '']
        - !Not [!Equals [!Ref ConfigBucketKmsKeyArn, '']]
        AssertDescription: "A transient bucket KMS key ARN (TransientBucketKmsKeyArn) was provided, so the AWS Config Logs bucket KMS key ARN (ConfigBucketKmsKeyArn) is also required. Provide both KMS key ARNs or neither."




Resources:

  # *************************************************************************************************************************
  # *************************************************************************************************************************
  # S3 buckets and resources that deal with S3 buckets
  # *************************************************************************************************************************
  # *************************************************************************************************************************

  # S3 notifications to trigger the Lambda Job Producer function - only if user selected that
  # S3 Bucket Permission for Lambda - AWS Config Logs bucket to trigger this Lambda on each new object
  LambdaInvocationPermissionPreprocessingJobProducer:
    Type: AWS::Lambda::Permission
    Condition: IsConfigureS3EventNotificationToLambdaJobProducer
    DeletionPolicy: "Delete"
    UpdateReplacePolicy: "Delete"
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ConfigFilePreprocessingProducerLambda # Lambda to trigger
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:${AWS::Partition}:s3:::${ConfigBucketName}"


  ConfigBucketNotificationConfigurationLambdaJobProducerTrigger:
    Type: Custom::ConfigBucketLambdaJobProducer
    Condition: IsConfigureS3EventNotificationToLambdaJobProducer
    DependsOn:
    - LambdaInvocationPermissionPreprocessingJobProducer
    Properties:
      ServiceToken: !GetAtt ConfigBucketNotificationConfigurationLambdaJobProducer.Arn
      Bucket: !Ref ConfigBucketName
      # this is needed so that the Lambda function deletes only S3 notification configurations if they have this name
      # passing it here and as part of NotificationConfiguration so that I do not have to hard-code this string on the Lambda code 
      EventNotificationName: "CRCDPreprocessingJobTrigger"
      NotificationConfiguration:
        LambdaFunctionConfigurations:
        - Events: ['s3:ObjectCreated:*']
          LambdaFunctionArn: !GetAtt ConfigFilePreprocessingProducerLambda.Arn
          # this is needed so that the Lambda function deletes only S3 notification configurations if they have this name
          Id: "CRCDPreprocessingJobTrigger"

  ConfigBucketNotificationConfigurationLambdaJobProducerRole:
    Type: AWS::IAM::Role
    # Shared by case 1 and case 2.2 (see IsConfigureBucketNotification).
    Condition: IsConfigureBucketNotification
    Properties:
      RoleName: "crcd-preproc-s3-notification-config-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3BucketNotificationPolicyJobProducer
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 's3:PutBucketNotification'
                  - 's3:GetBucketNotification'
                Resource: !Sub "arn:${AWS::Partition}:s3:::${ConfigBucketName}"

  # Lambda triggered by CloudFormation to configure bucket notification on AWS Config AWS Config Logs bucket
