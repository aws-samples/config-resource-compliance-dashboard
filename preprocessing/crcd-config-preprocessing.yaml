      Code:
        ZipFile: |
          import boto3
          import json
          import urllib.parse
          from datetime import datetime
          import os
          import re

          PATTERN = r'^(?P<org_id>[\w-]+)?/?AWSLogs/(?P<account_id>\d+)/Config/(?P<region>[\w-]+)/(?P<year>\d+)/(?P<month>\d+)/(?P<day>\d+)/(?P<type>ConfigSnapshot|ConfigHistory)/[^//]+$'

          DEFAULT_CONFIG_OBJECT_SIZE_THRESHOLD = 200000


          def extract_s3_records(event):
              """
              Normalize the incoming event into a flat list of S3 event-notification records,
              regardless of how the notification was delivered:
                - Direct S3 event notification -> the record already has an 's3' key
                  (From the AWS Config Logs bucket or from the transient bucket)
                - S3 -> SQS                                         -> the S3 event is JSON in record['body']
                - S3 -> SNS (and S3 -> SNS -> SQS)                  -> the S3 event is JSON under 'Message'
              The SQS/SNS branches are kept for robustness if a customer fronts the notification with
              their own queue/topic.
              S3 'TestEvent' messages (sent when a notification is first configured) carry 
              no 's3' records and are skipped.
              """
              s3_records = []
              for record in event.get('Records', []):
                  # Case 1: direct S3 notification
                  if 's3' in record:
                      s3_records.append(record)
                      continue

                  # S3 -> SQS or SNS-to-SQS: the payload is JSON in the message body
                  payload = record.get('body')
                  # Direct SNS to Lambda: the payload is under Sns.Message
                  if payload is None and 'Sns' in record:
                      payload = record['Sns'].get('Message')
                  if payload is None:
                      print('SKIPPING: record is neither an S3, SQS nor SNS event.')
                      continue

                  try:
                      parsed = json.loads(payload)
                  except (ValueError, TypeError):
                      print('SKIPPING: message body is not valid JSON.')
                      continue

                  # S3 -> SNS -> SQS: the S3 event is nested one more level under 'Message'
                  if isinstance(parsed, dict) and 'Message' in parsed and 'Records' not in parsed:
                      try:
                          parsed = json.loads(parsed['Message'])
                      except (ValueError, TypeError):
                          print('SKIPPING: nested SNS Message is not valid JSON.')
                          continue

                  for inner in parsed.get('Records', []):
                      if 's3' in inner:
                          s3_records.append(inner)
              return s3_records


          def lambda_handler(event, context):
              tracking_table_name = os.environ["DYNAMODB_TRACKING_TABLE_NAME"]
              dynamodb = boto3.resource('dynamodb').Table(tracking_table_name)
              dashboard_bucket_name = os.environ["DASHBOARD_BUCKET_NAME"]

              ecs = boto3.client('ecs')
              cluster_arn = os.environ["ECS_CLUSTER_ARN"]
              task_definition = os.environ["ECS_TASK_DEFINITION_ARN"]
              subnets = os.environ["ECS_TASK_SUBNETS"].split(",")
              security_groups = os.environ["ECS_TASK_SECURITY_GROUPS"].split(",")

              size_threshold = DEFAULT_CONFIG_OBJECT_SIZE_THRESHOLD
              size_threshold_parameter = os.environ.get("CONFIG_OBJECT_SIZE_THRESHOLD_BYTES", "")
              try:
                  size_threshold = int(size_threshold_parameter) if size_threshold_parameter.strip() else DEFAULT_CONFIG_OBJECT_SIZE_THRESHOLD
              except ValueError:
                  print(f"Warning: CONFIG_OBJECT_SIZE_THRESHOLD_BYTES '{size_threshold_parameter}' is not a valid integer. Using default value of {DEFAULT_CONFIG_OBJECT_SIZE_THRESHOLD} bytes.")

              records = extract_s3_records(event)
              for record in records:
                  bucket = record['s3']['bucket']['name']
                  key = urllib.parse.unquote_plus(record['s3']['object']['key'])

                  match = re.match(PATTERN, key)
                  if not match:
                      print(f'SKIPPING: Cannot match {key} as AWS Config file, skipping.')
                      continue

                  object_size = record['s3']['object']['size']

                  filename = os.path.basename(key)
                  filename = filename.replace('.json.gz', '')

                  parts = filename.split('_')
                  if len(parts) >= 2:
                      timestamp_and_random = f"{parts[-2]}_{parts[-1]}"
                  else:
                      timestamp_and_random = filename

                  run_id = timestamp_and_random

                  if object_size < size_threshold:
                      print(f"Object size {object_size} bytes is below threshold of {size_threshold} bytes. Copying directly to destination bucket.")
                      s3_client = boto3.client('s3')
                      try:
                          s3_client.copy_object(
                              CopySource={'Bucket': bucket, 'Key': key},
                              Bucket=dashboard_bucket_name,
                              Key=key
                          )
                          dynamodb.put_item(
                              Item={
                                  'source_file': key,
                                  'job_run_id': run_id,
                                  'status': 'COMPLETED',
                                  'start_time': datetime.now().isoformat(),
                                  'end_time': datetime.now().isoformat(),
                                  'object_size': object_size,
                                  'processing_method': 'DIRECT_COPY',
                                  'ttl': int((datetime.now().timestamp()) + (90 * 24 * 60 * 60))
                              }
                          )
                          print(f"Successfully copied {key} to {dashboard_bucket_name}/{key}")
                      except Exception as e:
                          print(f"Error copying object {key}: {str(e)}")
                          dynamodb.put_item(
                              Item={
                                  'source_file': key,
                                  'job_run_id': run_id,
                                  'status': 'FAILED',
                                  'start_time': datetime.now().isoformat(),
                                  'object_size': object_size,
                                  'error_message': str(e),
                                  'ttl': int((datetime.now().timestamp()) + (90 * 24 * 60 * 60))
                              }
                          )
                          raise
                  else:
                      dynamodb.put_item(
                          Item={
                              'source_file': key,
                              'job_run_id': run_id,
                              'status': 'STARTED',
                              'start_time': datetime.now().isoformat(),
                              'object_size': object_size,
                              'processing_method': 'FARGATE',
                              'ttl': int((datetime.now().timestamp()) + (90 * 24 * 60 * 60))
                          }
                      )

                      try:
                          response = ecs.run_task(
                              cluster=cluster_arn,
                              taskDefinition=task_definition,
                              launchType='FARGATE',
                              networkConfiguration={
                                  'awsvpcConfiguration': {
                                      'subnets': subnets,
                                      'securityGroups': security_groups,
                                      'assignPublicIp': 'ENABLED'
                                  }
                              },
                              overrides={
                                  'containerOverrides': [{
                                      'name': 'crcd-preprocessing',
                                      'environment': [
                                          {'name': 'SOURCE_PATH', 'value': f's3://{bucket}/{key}'},
                                          {'name': 'DESTINATION_BUCKET', 'value': dashboard_bucket_name},
                                          {'name': 'TRACKING_TABLE_NAME', 'value': tracking_table_name},
                                          {'name': 'JOB_RUN_ID', 'value': run_id}
                                      ]
                                  }]
                              }
                          )

                          task_arn = response['tasks'][0]['taskArn'] if response['tasks'] else 'UNKNOWN'
                          print(f"Started Fargate task {task_arn} for {key} with run ID: {run_id}")

                      except Exception as e:
                          print(f"Error starting Fargate task for {key}: {str(e)}")
                          dynamodb.update_item(
                              Key={'source_file': key, 'job_run_id': run_id},
                              UpdateExpression="SET #status = :s, error_message = :e",
                              ExpressionAttributeNames={'#status': 'status'},
                              ExpressionAttributeValues={':s': 'FAILED', ':e': str(e)}
                          )
                          raise

              return {
                  'statusCode': 200,
                  'body': json.dumps('Successfully processed S3 event')
              }
      

  # log group for the lambda, with retention period
  ConfigFilePreprocessingProducerLambdaLogGroup:
  # checkov:skip=CKV_AWS_158: No KMS encryption needed
    Type: AWS::Logs::LogGroup
    Condition: IsCreatePreProcessingResources
    DeletionPolicy: "Delete"
    UpdateReplacePolicy: "Delete"
    Properties:
      LogGroupName: !Sub "/aws/lambda/${PreProcessingLambdaProducerName}"
      RetentionInDays: 14
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W84
            reason: "No KMS encryption needed"

  # *************************************************************************************************************************
  # *************************************************************************************************************************
  # Dynamo DB table to track the preprocessing activities
  # *************************************************************************************************************************
  # *************************************************************************************************************************

  # DynamoDB Table
  CRCDJobTrackingTable:
  # checkov:skip=CKV_AWS_119: This is a tracking table, no need for encryption
  # checkov:skip=CKV_AWS_28: This is a tracking table, no need for point-in-time recovery
    Type: AWS::DynamoDB::Table
    Condition: IsCreatePreProcessingResources
    DeletionPolicy: "Delete"
    UpdateReplacePolicy: "Delete"
    Properties:
      TableName: !Ref DynamoDBJobTrackingTableName
      AttributeDefinitions:
        - AttributeName: source_file
          AttributeType: S
        - AttributeName: job_run_id
          AttributeType: S
      KeySchema:
        - AttributeName: source_file
          KeyType: HASH
        - AttributeName: job_run_id
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true


  # *************************************************************************************************************************
  # *************************************************************************************************************************
  # Fargate task that performs the streaming split of AWS Config files
  # *************************************************************************************************************************
  # *************************************************************************************************************************

  # -----------------------------------------------------------------------------------------------------------------------
  # Dedicated VPC for the preprocessing Fargate task.
  # The stack creates its own isolated VPC so it never touches the customer's existing networking:
  #   - No customer VPC/subnet/route-table inputs are required.
  #   - The gateway endpoints attach only to our route table, so their scoped policies cannot affect any
  #     other workload in the account.
  # This is a PUBLIC VPC: the task gets a public IP and egresses via the Internet Gateway to pull its
  # public container image (public ECR) and PyPI packages, while S3 and DynamoDB traffic (the sensitive
  # Config-data path) stays on the AWS private network via the gateway endpoints below.
  # -----------------------------------------------------------------------------------------------------------------------
  PreProcessingVPC:
  # checkov:skip=CKV2_AWS_11: VPC flow logs not required for this isolated, single-purpose preprocessing VPC
    Type: AWS::EC2::VPC
    Condition: IsCreatePreProcessingResources
    DeletionPolicy: "Delete"
    UpdateReplacePolicy: "Delete"
    Properties:
      CidrBlock: 10.0.0.0/24
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: crcd-preprocessing-vpc
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W60
            reason: "Flow logs are not required for this isolated, single-purpose preprocessing VPC"

  PreProcessingInternetGateway:
    Type: AWS::EC2::InternetGateway
    Condition: IsCreatePreProcessingResources
    DeletionPolicy: "Delete"
    UpdateReplacePolicy: "Delete"
    Properties:
      Tags:
        - Key: Name
          Value: crcd-preprocessing-igw

  PreProcessingVPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Condition: IsCreatePreProcessingResources
    Properties:
      VpcId: !Ref PreProcessingVPC
      InternetGatewayId: !Ref PreProcessingInternetGateway

  PreProcessingPublicSubnet1:
    Type: AWS::EC2::Subnet
    Condition: IsCreatePreProcessingResources
    Properties:
      VpcId: !Ref PreProcessingVPC
      CidrBlock: 10.0.0.0/25
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: crcd-preprocessing-public-subnet-1

  PreProcessingPublicSubnet2:
    Type: AWS::EC2::Subnet
    Condition: IsCreatePreProcessingResources
    Properties:
      VpcId: !Ref PreProcessingVPC
      CidrBlock: 10.0.0.128/25
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: crcd-preprocessing-public-subnet-2

  PreProcessingPublicRouteTable:
    Type: AWS::EC2::RouteTable
    Condition: IsCreatePreProcessingResources
    Properties:
      VpcId: !Ref PreProcessingVPC
      Tags:
        - Key: Name
          Value: crcd-preprocessing-public-rtb

  PreProcessingDefaultRoute:
    Type: AWS::EC2::Route
    Condition: IsCreatePreProcessingResources
    DependsOn: PreProcessingVPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PreProcessingPublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref PreProcessingInternetGateway

  PreProcessingPublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: IsCreatePreProcessingResources
    Properties:
      SubnetId: !Ref PreProcessingPublicSubnet1
      RouteTableId: !Ref PreProcessingPublicRouteTable

  PreProcessingPublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Condition: IsCreatePreProcessingResources
    Properties:
      SubnetId: !Ref PreProcessingPublicSubnet2
      RouteTableId: !Ref PreProcessingPublicRouteTable

  # Security group for the Fargate task. Egress only, restricted to HTTPS (443). No ingress rules
  # (the task never accepts inbound connections). Outbound 443 is required so the task can pull its
  # public container image (public ECR), install Python dependencies (PyPI), and reach the AWS
  # service endpoints it uses (S3, DynamoDB, CloudWatch Logs).
  PreProcessingFargateSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: IsCreatePreProcessingResources
    DeletionPolicy: "Delete"
    UpdateReplacePolicy: "Delete"
    Properties:
      GroupDescription: "CRCD preprocessing Fargate task - outbound HTTPS (443) only, no inbound"
      VpcId: !Ref PreProcessingVPC
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: "Outbound HTTPS to pull the public container image and PyPI packages, and to reach AWS service endpoints (S3, DynamoDB, CloudWatch Logs)"
      Tags:
        - Key: Name
          Value: crcd-preprocessing-fargate-sg
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W5
            reason: "The Fargate task requires outbound internet access to pull its public container image and PyPI packages; egress is intentionally restricted to TCP port 443"
          - id: W40
            reason: "Egress is intentionally restricted to a single protocol/port (TCP 443) rather than all protocols"

  # -----------------------------------------------------------------------------------------------------------------------
  # Gateway VPC endpoints for S3 and DynamoDB (both free).
  # These keep the Fargate task's S3 (Config file content) and DynamoDB (job tracking) traffic on the
  # AWS private network instead of egressing via the internet gateway to the public service endpoints.
  # They attach only to our dedicated route table, so their scoped policies never affect other workloads.
  # -----------------------------------------------------------------------------------------------------------------------

  # Gateway endpoint for S3 (free). Carries the Fargate task's Config file reads and split-output writes.
  # The endpoint policy restricts access through this endpoint to only the source AWS Config Logs bucket
  # and the Dashboard bucket (and their objects).
  PreProcessingS3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: IsCreatePreProcessingResources
    Properties:
      VpcId: !Ref PreProcessingVPC
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PreProcessingPublicRouteTable
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # The Dashboard bucket is the destination in both cases (write outputs, read the split script).
          - Sid: "AllowCRCDDashboardBucketAccess"
            Effect: Allow
            Principal: "*"
            Action:
              - "s3:GetObject"
              - "s3:PutObject"
              - "s3:ListBucket"
            Resource:
              - !GetAtt DashboardBucket.Arn
              - !Sub "${DashboardBucket.Arn}/*"
          # Case 1 (single-account): the Fargate task streams the source files directly from the AWS
          # Config Logs bucket through this endpoint. In case 2.1 the source is the transient bucket
          # (statement below) and the AWS Config Logs bucket is in another account, so it must NOT be
          # reachable through this endpoint.
          - !If
            - IsConfigAccountDeployment
            - Sid: "AllowCRCDConfigLogsBucketAccess"
              Effect: Allow
              Principal: "*"
              Action:
                - "s3:GetObject"
                - "s3:ListBucket"
              Resource:
                - !Sub "arn:${AWS::Partition}:s3:::${ConfigBucketName}"
                - !Sub "arn:${AWS::Partition}:s3:::${ConfigBucketName}/*"
            - !Ref "AWS::NoValue"
          # Case 2.1 (multi-account): the Fargate task streams the replicated source files from the
          # transient bucket through this endpoint, so the endpoint policy must allow it too. Built
          # from the bucket name (not !GetAtt TransientBucket.Arn) to avoid a dependency cycle.
          - !If
            - IsDashboardAccountDeployment
            - Sid: "AllowCRCDTransientBucketAccess"
              Effect: Allow
              Principal: "*"
              Action:
                - "s3:GetObject"
                - "s3:ListBucket"
              Resource:
                - !Sub "arn:${AWS::Partition}:s3:::${TransientBucketNamePrefix}-${AWS::AccountId}-${AWS::Region}"
                - !Sub "arn:${AWS::Partition}:s3:::${TransientBucketNamePrefix}-${AWS::AccountId}-${AWS::Region}/*"
            - !Ref "AWS::NoValue"

  # Gateway endpoint for DynamoDB (free). Carries the Fargate task's job tracking table updates.
  # The endpoint policy restricts access through this endpoint to only the CRCD job tracking table.
  PreProcessingDynamoDBGatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: IsCreatePreProcessingResources
    Properties:
      VpcId: !Ref PreProcessingVPC
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.dynamodb"
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PreProcessingPublicRouteTable
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: "AllowCRCDJobTrackingTableAccess"
            Effect: Allow
            Principal: "*"
            Action:
              - "dynamodb:GetItem"
              - "dynamodb:UpdateItem"
            Resource:
              - !GetAtt CRCDJobTrackingTable.Arn

  ECSServiceLinkedRoleLambdaRole:
    Type: AWS::IAM::Role
    Condition: IsCreatePreProcessingResources
    DeletionPolicy: "Delete"
    UpdateReplacePolicy: "Delete"
    Properties:
      RoleName: "crcd-preproc-ecs-service-role-lambda-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: CreateServiceLinkedRole
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - iam:CreateServiceLinkedRole
                  # iam:GetRole is needed by the exponential-backoff check that confirms the
                  # service-linked role has propagated after creation.
                  - iam:GetRole
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/ecs.amazonaws.com/*"

  ECSServiceLinkedRoleLambda:
  # NOTE: we intentionally do NOT declare a CloudWatch LogGroup for this function in CloudFormation.
  # It is a support Lambda that is called once, and it runs on stack DELETE (its Delete handler).
  # Its async log writes re-create the /aws/lambda/... group after CloudFormation deletes it,
  # leaving an orphan the Lambda service owns (which then blocks a later re-deploy).
  # checkov:skip=CKV_AWS_115: One-time execution
  # checkov:skip=CKV_AWS_116: No DLQ needed
    Type: AWS::Lambda::Function
    Condition: IsCreatePreProcessingResources
    DeletionPolicy: "Delete"
    UpdateReplacePolicy: "Delete"
    Properties:
      FunctionName: !Sub "${LambdaSupportECSServiceRoleName}"
      Description: "CRCD Dashboard Preprocessing - Creates ECS service-linked role if it does not already exist (one-time execution)"
      Runtime: python3.14
      Timeout: 180
      MemorySize: 128
      Architectures:
        - "x86_64"
      Handler: index.lambda_handler
      Role: !GetAtt ECSServiceLinkedRoleLambdaRole.Arn
      Environment:
        Variables:
          # Exponential backoff configuration for confirming the ECS service-linked role
          # has propagated (IAM is eventually consistent). Both values are configurable.
          ECS_SERVICE_LINKED_ROLE_MAX_ATTEMPTS: "5"
          ECS_SERVICE_LINKED_ROLE_BASE_DELAY_SECONDS: "3"
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          import os
          import time

          def lambda_handler(event, context):
              try:
                  if event['RequestType'] in ['Create', 'Update']:
                      iam = boto3.client('iam')
                      role_name = 'AWSServiceRoleForECS'
                      max_attempts = int(os.environ.get('ECS_SERVICE_LINKED_ROLE_MAX_ATTEMPTS', '5'))
                      base_delay = float(os.environ.get('ECS_SERVICE_LINKED_ROLE_BASE_DELAY_SECONDS', '3'))

                      created = False
                      try:
                          iam.create_service_linked_role(AWSServiceName='ecs.amazonaws.com')
                          created = True
                          print("Created ECS service-linked role")
                      except iam.exceptions.InvalidInputException:
                          print("ECS service-linked role already exists, skipping")

                      # IAM is eventually consistent. When we just created the role, ECS
                      # CreateCluster can fail with "Unable to assume the service linked role"
                      # if it runs before the role has propagated. Confirm the role is
                      # retrievable using exponential backoff (delay = base * 2**attempt),
                      # and fail explicitly if it never appears after max_attempts.
                      if created:
                          for attempt in range(max_attempts):
                              delay = base_delay * (2 ** attempt)
                              time.sleep(delay)
                              try:
                                  iam.get_role(RoleName=role_name)
                                  print(f"ECS service-linked role available after {attempt + 1} attempt(s)")
                                  break
                              except iam.exceptions.NoSuchEntityException:
                                  print(f"Attempt {attempt + 1}/{max_attempts}: role not yet available, backed off {delay}s")
                          else:
                              msg = (f"ECS service-linked role '{role_name}' did not become "
                                     f"available after {max_attempts} attempts")
                              print(msg)
                              cfnresponse.send(event, context, cfnresponse.FAILED, {'Error': msg})
                              return
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
              except Exception as e:
                  print(f"Error: {str(e)}")
                  cfnresponse.send(event, context, cfnresponse.FAILED, {'Error': str(e)})
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W92
            reason: "This function does not need reserved concurrent executions"

  EnsureECSServiceLinkedRole:
    Type: Custom::ECSServiceLinkedRole
    Condition: IsCreatePreProcessingResources
    Properties:
      ServiceToken: !GetAtt ECSServiceLinkedRoleLambda.Arn

  PreProcessingECSCluster:
    Type: AWS::ECS::Cluster
    Condition: IsCreatePreProcessingResources
    DependsOn: EnsureECSServiceLinkedRole
    DeletionPolicy: "Delete"
    UpdateReplacePolicy: "Delete"
    Properties:
      ClusterName: "crcd-preprocessing-cluster"
      CapacityProviders:
        - FARGATE
      DefaultCapacityProviderStrategy:
        - CapacityProvider: FARGATE
          Weight: 1

  # Role assumed by ECS to pull images and write logs (task execution role)
  PreProcessingTaskExecutionRole:
    Type: AWS::IAM::Role
    Condition: IsCreatePreProcessingResources
    DeletionPolicy: "Delete"
    UpdateReplacePolicy: "Delete"
    Properties:
      RoleName: "crcd-preprocessing-task-execution-role"
      Description: "CRCD Dashboard Preprocessing - Allows ECS to pull container images and write logs"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  # Role assumed by the container itself to access S3 and DynamoDB (task role)
  PreProcessingTaskRole:
    Type: AWS::IAM::Role
    Condition: IsCreatePreProcessingResources
    DeletionPolicy: "Delete"
    UpdateReplacePolicy: "Delete"
    Properties:
      RoleName: "crcd-preprocessing-task-role"
      Description: "CRCD Dashboard Preprocessing - Allows the preprocessing container to read from the AWS Config Logs bucket, write to Dashboard bucket, and update DynamoDB"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: crcd-preprocessing-s3-dynamodb
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Read the split script (both cases). The source object it streams is granted per-case below.
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub '${DashboardBucket.Arn}/crcd-scripts/*'
              # Case 1 (single-account): the task streams the source files directly from the AWS Config Logs bucket.
              - !If
                - IsConfigAccountDeployment
                - Effect: Allow
                  Action:
                    - s3:GetObject
                  Resource: !Sub "arn:${AWS::Partition}:s3:::${ConfigBucketName}/*"
                - !Ref "AWS::NoValue"
              # Case 2.1 (multi-account): the task streams the replicated source files from the
              # transient bucket. Built from the bucket name (not !GetAtt TransientBucket.Arn) to
              # avoid a dependency cycle: the transient bucket -> Producer Lambda (notification) ->
              # task definition -> this task role -> transient bucket.
              - !If
                - IsDashboardAccountDeployment
                - Effect: Allow
                  Action:
                    - s3:GetObject
                  Resource: !Sub "arn:${AWS::Partition}:s3:::${TransientBucketNamePrefix}-${AWS::AccountId}-${AWS::Region}/*"
                - !Ref "AWS::NoValue"
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource:
                  - !Sub '${DashboardBucket.Arn}/*'
              # ListBucket on the destination (both cases) and the per-case source bucket.
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource:
                  - !GetAtt DashboardBucket.Arn
              - !If
                - IsConfigAccountDeployment
                - Effect: Allow
                  Action:
                    - s3:ListBucket
                  Resource: !Sub "arn:${AWS::Partition}:s3:::${ConfigBucketName}"
                - !Ref "AWS::NoValue"
              - !If
                - IsDashboardAccountDeployment
                - Effect: Allow
                  Action:
                    - s3:ListBucket
                  Resource: !Sub "arn:${AWS::Partition}:s3:::${TransientBucketNamePrefix}-${AWS::AccountId}-${AWS::Region}"
                - !Ref "AWS::NoValue"
              - Effect: Allow
                Action:
                  - dynamodb:UpdateItem
                  - dynamodb:GetItem
                Resource: !GetAtt CRCDJobTrackingTable.Arn
              # Case 1 (single-account) with a KMS-encrypted source: decrypt the source Config files
              # read directly from the AWS Config Logs bucket, using the customer-provided source key.
              - !If
                - IsConfigAccountDeploymentKms
                - Effect: Allow
                  Action:
                    - kms:Decrypt
                  Resource: !Ref ConfigBucketKmsKeyArn
                - !Ref "AWS::NoValue"
              # When the Dashboard bucket is KMS-encrypted (case 1 or 2.1): decrypt the split script
              # and encrypt the split output objects. In case 2.1 this same key also encrypts the
              # transient bucket, so this covers decrypting the replicated source files too.
              - !If
                - IsCreatePreProcessingResourcesKms
                - Effect: Allow
                  Action:
                    - kms:Decrypt
                    - kms:Encrypt
                    - kms:GenerateDataKey
                  Resource: !GetAtt DashboardBucketKmsKey.Arn
                - !Ref "AWS::NoValue"

  PreProcessingTaskLogGroup:
  # checkov:skip=CKV_AWS_158: No KMS encryption needed
    Type: AWS::Logs::LogGroup
    Condition: IsCreatePreProcessingResources
    DeletionPolicy: "Delete"
    UpdateReplacePolicy: "Delete"
    Properties:
      LogGroupName: "/ecs/crcd-preprocessing-task"
      RetentionInDays: 14
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W84
            reason: "No KMS encryption needed"

  # Lambda that uploads the preprocessing script to S3 during stack creation
  ScriptUploaderLambdaRole:
    Type: AWS::IAM::Role
    Condition: IsCreatePreProcessingResources
    DeletionPolicy: "Delete"
    UpdateReplacePolicy: "Delete"
    Properties:
      RoleName: "crcd-preproc-script-uploader-lambda-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3DashboardBucketAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub '${DashboardBucket.Arn}/crcd-scripts/*'
              # When the Dashboard bucket is KMS-encrypted, uploading the script requires these key actions.
              - !If
                - IsCreatePreProcessingResourcesKms
                - Effect: Allow
                  Action:
                    - kms:Encrypt
                    - kms:GenerateDataKey
                  Resource: !GetAtt DashboardBucketKmsKey.Arn
                - !Ref "AWS::NoValue"

  ScriptUploaderLambda:
  # NOTE: we intentionally do NOT declare a CloudWatch LogGroup for this function in CloudFormation.
  # It is a support Lambda that is called once, and it runs on stack DELETE (its Delete handler).
  # Its async log writes re-create the /aws/lambda/... group after CloudFormation deletes it,
  # leaving an orphan the Lambda service owns (which then blocks a later re-deploy).
  # checkov:skip=CKV_AWS_115: This is called only once by the CFN template.
  # checkov:skip=CKV_AWS_116: No DLQ by design. If this lambda fails, the whole CFN template fails.
    Type: AWS::Lambda::Function
    Condition: IsCreatePreProcessingResources
    DeletionPolicy: "Delete"
    UpdateReplacePolicy: "Delete"
    Properties:
      FunctionName: !Sub "${LambdaSupportScriptUploaderName}"
      Description: "CRCD Dashboard Preprocessing - Uploads the preprocessing Python script to S3 (one-time execution)"
      Runtime: python3.14
      Timeout: 120
      MemorySize: 128
      Architectures:
        - "x86_64"
      Handler: index.lambda_handler
      Role: !GetAtt ScriptUploaderLambdaRole.Arn
      Code:
        ZipFile: |
          import boto3
          import cfnresponse

          def lambda_handler(event, context):
              try:
                  if event['RequestType'] in ['Create', 'Update']:
                      s3 = boto3.client('s3')
                      bucket = event['ResourceProperties']['Bucket']
                      key = event['ResourceProperties']['Key']
                      content = event['ResourceProperties']['Content']

                      s3.put_object(
                          Bucket=bucket,
                          Key=key,
                          Body=content,
                          ContentType='text/x-python'
                      )

                      cfnresponse.send(event, context, cfnresponse.SUCCESS,
                                       {'Message': f'Uploaded to s3://{bucket}/{key}'})

                  elif event['RequestType'] == 'Delete':
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {})

              except Exception as e:
                  cfnresponse.send(event, context, cfnresponse.FAILED, {'Error': str(e)})
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W92
            reason: "This function does not need reserved concurrent executions"

  # Custom Resource that triggers the script upload
  PreProcessingScript:
    Type: Custom::ScriptUploader
    Condition: IsCreatePreProcessingResources
    Properties:
      ServiceToken: !GetAtt ScriptUploaderLambda.Arn
      Bucket: !Ref DashboardBucket
      Key: "crcd-scripts/crcd_preprocessing_task.py"
      Content: |
        import gzip
        import io
        import json
        import os
        import re
        import urllib.parse
        import uuid
        from datetime import datetime
        from decimal import Decimal

        import boto3
        import ijson


        class DecimalEncoder(json.JSONEncoder):
            def default(self, obj):
                if isinstance(obj, Decimal):
                    if obj == int(obj):
                        return int(obj)
                    return float(obj)
                return super().default(obj)


        SOURCE_SNAPSHOT_PATTERN = re.compile(
            r'^(?P<account_id>\d+)_Config_(?P<region>[\w-]+)_(?P<type>ConfigSnapshot)_(?P<timestamp>\d{8}T\d{6}Z)_(?P<uuid>[\w-]+)\.json\.gz$'
        )
        SOURCE_HISTORY_PATTERN = re.compile(
            r'^(?P<account_id>\d+)_Config_(?P<region>[\w-]+)_(?P<type>ConfigHistory)_(?P<resource_type>[^_]+(?:_[^_]+)*)_(?P<timestamp>\d{8}T\d{6}Z)_(?P<end_timestamp>\d{8}T\d{6}Z)_(?P<sequence>\d+)\.json\.gz$'
        )


        def parse_source_filename(source_key):
            filename = os.path.basename(source_key)
            match = SOURCE_SNAPSHOT_PATTERN.match(filename)
            if match:
                return match.groupdict()
            match = SOURCE_HISTORY_PATTERN.match(filename)
            if match:
                return match.groupdict()
            return None


        def decode_s3_key(s3_path):
            if not s3_path.startswith('s3://'):
                return s3_path
            parts = s3_path[5:].split('/', 1)
            if len(parts) < 2:
                return s3_path
            bucket = parts[0]
            key = urllib.parse.unquote(parts[1])
            return f"s3://{bucket}/{key}"


        def get_relative_path(source_path):
            decoded_path = decode_s3_key(source_path)
            parts = decoded_path.replace('s3://', '').split('/', 1)
            if len(parts) > 1:
                return parts[1]
            return ''


        def get_destination_key(source_path, filename):
            relative_path = get_relative_path(source_path)
            dir_path = os.path.dirname(relative_path)
            if dir_path:
                return f"{dir_path}/{filename}"
            return filename


        def compress_json(data):
            json_bytes = json.dumps(data, cls=DecimalEncoder).encode('utf-8')
            buffer = io.BytesIO()
            with gzip.GzipFile(mode='wb', fileobj=buffer) as gz:
                gz.write(json_bytes)
            buffer.seek(0)
            return buffer.getvalue()


        def build_output_filename(account_id, region, config_type, timestamp, sequence_number):
            seq = sequence_number % 100000
            random_part = uuid.uuid4().hex[:12]
            return f"{account_id}_Config_{region}_{config_type}_{timestamp}_{seq:05d}_{random_part}.json.gz"


        BATCH_SIZE = 500


        class StreamingConfigSplitter:

            def __init__(self, source_bucket, source_key, dest_bucket, dest_prefix="",
                         tracking_table_name=None, job_run_id=None):
                self.source_bucket = source_bucket
                self.source_key = source_key
                self.dest_bucket = dest_bucket
                self.dest_prefix = dest_prefix.rstrip('/')
                self.tracking_table_name = tracking_table_name
                self.job_run_id = job_run_id

                self.s3 = boto3.client('s3')
                self.dynamodb_table = None
                if tracking_table_name:
                    self.dynamodb_table = boto3.resource('dynamodb').Table(tracking_table_name)

                self.file_version = "1.0"
                self.config_snapshot_id = ""

                self.source_meta = parse_source_filename(source_key)
                if not self.source_meta:
                    raise ValueError(
                        f"Source key does not match expected AWS Config filename pattern: "
                        f"{os.path.basename(source_key)}"
                    )

            def process(self):
                source_path = f"s3://{self.source_bucket}/{self.source_key}"
                print(f"Processing: {source_path}")
                print(f"Destination: s3://{self.dest_bucket}/{self.dest_prefix}/")
                print(f"Batch size: {BATCH_SIZE} items per file")

                item_count = 0
                file_count = 0
                error_count = 0
                batch = []

                try:
                    stream = self._open_stream()
                    parser = ijson.parse(stream)

                    in_items_array = False
                    builder = None
                    depth = 0

                    for prefix, event, value in parser:
                        if prefix == 'fileVersion':
                            self.file_version = value
                        elif prefix == 'configSnapshotId':
                            self.config_snapshot_id = value
                        elif prefix == 'configurationItems' and event == 'start_array':
                            in_items_array = True
                            continue
                        elif prefix == 'configurationItems' and event == 'end_array':
                            in_items_array = False
                            continue

                        if in_items_array:
                            if event == 'start_map' and prefix == 'configurationItems.item':
                                builder = ijson.ObjectBuilder()
                                builder.event(event, value)
                                depth = 1
                            elif builder is not None:
                                builder.event(event, value)
                                if event in ('start_map', 'start_array'):
                                    depth += 1
                                elif event in ('end_map', 'end_array'):
                                    depth -= 1

                                if depth == 0:
                                    item = builder.value
                                    builder = None
                                    batch.append(item)
                                    item_count += 1

                                    if len(batch) >= BATCH_SIZE:
                                        try:
                                            self._write_batch(batch, file_count + 1)
                                            file_count += 1
                                        except Exception as e:
                                            error_count += len(batch)
                                            print(f"Error writing batch {file_count + 1}: {e}")
                                        batch = []

                                    if item_count % 5000 == 0:
                                        print(f"Progress: {item_count} items read, {file_count} files written")

                    if batch:
                        try:
                            self._write_batch(batch, file_count + 1)
                            file_count += 1
                        except Exception as e:
                            error_count += len(batch)
                            print(f"Error writing final batch: {e}")

                    print(f"\nProcessing complete:")
                    print(f"  Items processed: {item_count}")
                    print(f"  Files written: {file_count}")
                    print(f"  Items with errors: {error_count}")

                    self._update_tracking('COMPLETED', item_count)

                except Exception as e:
                    print(f"Fatal error: {e}")
                    self._update_tracking('FAILED', item_count, str(e))
                    raise

                return item_count

            def _open_stream(self):
                response = self.s3.get_object(Bucket=self.source_bucket, Key=self.source_key)
                raw_stream = response['Body']
                if self.source_key.endswith('.gz'):
                    return gzip.GzipFile(fileobj=raw_stream)
                return raw_stream

            def _write_batch(self, batch, batch_number):
                output = {
                    "fileVersion": self.file_version,
                    "configSnapshotId": self.config_snapshot_id,
                    "configurationItems": batch
                }

                filename = build_output_filename(
                    account_id=self.source_meta['account_id'],
                    region=self.source_meta['region'],
                    config_type=self.source_meta['type'],
                    timestamp=self.source_meta['timestamp'],
                    sequence_number=batch_number
                )

                source_path = f"s3://{self.source_bucket}/{self.source_key}"
                dest_key = get_destination_key(source_path, filename)
                if self.dest_prefix:
                    dest_key = f"{self.dest_prefix}/{dest_key}" if dest_key else self.dest_prefix

                compressed = compress_json(output)

                self.s3.put_object(
                    Bucket=self.dest_bucket,
                    Key=dest_key,
                    Body=compressed,
                    ContentType='application/json',
                    ContentEncoding='gzip'
                )

            def _update_tracking(self, status, processed_count, error_message=None):
                if not self.dynamodb_table or not self.job_run_id:
                    return
                try:
                    update_expr = "SET #status = :status, end_time = :end_time, processed_items = :count"
                    expr_values = {
                        ':status': status,
                        ':end_time': datetime.now().isoformat(),
                        ':count': processed_count
                    }
                    if error_message:
                        update_expr += ", error_message = :error_message"
                        expr_values[':error_message'] = error_message

                    self.dynamodb_table.update_item(
                        Key={
                            'source_file': self.source_key,
                            'job_run_id': self.job_run_id
                        },
                        UpdateExpression=update_expr,
                        ExpressionAttributeNames={'#status': 'status'},
                        ExpressionAttributeValues=expr_values
                    )
                except Exception as e:
                    print(f"Warning: failed to update tracking table: {e}")


        def main():
            source_path = os.environ['SOURCE_PATH']
            dest_bucket = os.environ['DESTINATION_BUCKET']
            dest_prefix = os.environ.get('DESTINATION_PREFIX', '')
            tracking_table = os.environ.get('TRACKING_TABLE_NAME')
            job_run_id = os.environ.get('JOB_RUN_ID')

            decoded_path = decode_s3_key(source_path)
            parts = decoded_path.replace('s3://', '').split('/', 1)
            source_bucket = parts[0]
            source_key = parts[1] if len(parts) > 1 else ''

            splitter = StreamingConfigSplitter(
                source_bucket=source_bucket,
                source_key=source_key,
                dest_bucket=dest_bucket,
                dest_prefix=dest_prefix,
                tracking_table_name=tracking_table,
                job_run_id=job_run_id
            )

            splitter.process()


        if __name__ == '__main__':
            main()

  PreProcessingTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Condition: IsCreatePreProcessingResources
    DependsOn: PreProcessingScript
    DeletionPolicy: "Delete"
    UpdateReplacePolicy: "Delete"
    Properties:
      Family: "crcd-preprocessing-task"
      RequiresCompatibilities:
        - FARGATE
      NetworkMode: awsvpc
      Cpu: '1024'
      Memory: '4096'
      ExecutionRoleArn: !GetAtt PreProcessingTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt PreProcessingTaskRole.Arn
      ContainerDefinitions:
        - Name: "crcd-preprocessing"
          Image: "public.ecr.aws/docker/library/python:3.14-slim"
          Essential: true
          Command:
            - /bin/sh
            - -c
            # --root-user-action=ignore suppresses pip's "running as root" warning. It is safe here:
            # this Fargate task is ephemeral and single-purpose - it is destroyed after it runs, so there
            # is no long-lived system to render "unusable", no other packages to conflict with, and no
            # next run reusing the same filesystem.
            - !Sub |
              pip install --quiet --root-user-action=ignore ijson boto3 &&
              python -c "import boto3; boto3.client('s3').download_file('${DashboardBucket}', 'crcd-scripts/crcd_preprocessing_task.py', '/tmp/crcd_preprocessing_task.py')" &&
              python /tmp/crcd_preprocessing_task.py
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref PreProcessingTaskLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: "preprocessing"


  # *************************************************************************************************************************
  # *************************************************************************************************************************
  # Case 2.2 only (multi-account, run in the AWS Config account): configure cross-account S3
  # replication from the AWS Config Logs bucket to the transient bucket in the Dashboard account.
  # The transient bucket, its replication bucket policy, and (if KMS) the destination key grant are
  # created in the Dashboard account step (2.1). This step creates the replication role and, unless
  # the customer opts out, the replication configuration on the AWS Config Logs bucket.
  # *************************************************************************************************************************
  # *************************************************************************************************************************

  # Service role assumed by S3 when replicating files to the transient bucket in the Dashboard account
  PreProcessingReplicationRole:
    Type: AWS::IAM::Role
    Condition: IsConfigAccountNotificationDeployment
    DeletionPolicy: "Delete"
    UpdateReplacePolicy: "Delete"
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: s3.amazonaws.com
            Action: sts:AssumeRole
      # A service role is an IAM role that a service assumes to perform actions on your behalf.
      Path: "/service-role/"
      RoleName: !Ref PreProcessingCrossAccountReplicationRole
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W28
            reason: "Role names are as per our design"

  # Policy for the S3 replication role: read-for-replication on the AWS Config Logs bucket (source),
  # replicate-write on the transient bucket (destination).
  PreProcessingReplicationRoleS3Policy:
    Type: AWS::IAM::Policy
    Condition: IsConfigAccountNotificationDeployment
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - s3:ListBucket
              - s3:GetReplicationConfiguration
              - s3:GetObjectVersionForReplication
              - s3:GetObjectVersionAcl
              - s3:GetObjectVersionTagging
              - s3:GetObjectRetention
              - s3:GetObjectLegalHold
            Resource:
              - !Sub "arn:${AWS::Partition}:s3:::${ConfigBucketName}"
              - !Sub "arn:${AWS::Partition}:s3:::${ConfigBucketName}/*"
              - !Sub "arn:${AWS::Partition}:s3:::${TransientBucketNameForReplication}"
              - !Sub "arn:${AWS::Partition}:s3:::${TransientBucketNameForReplication}/*"
          - Effect: Allow
            Action:
              - s3:ReplicateObject
              - s3:ReplicateDelete
              - s3:ReplicateTags
              - s3:ObjectOwnerOverrideToBucketOwner
            Resource:
              - !Sub "arn:${AWS::Partition}:s3:::${ConfigBucketName}/*"
              - !Sub "arn:${AWS::Partition}:s3:::${TransientBucketNameForReplication}/*"
      PolicyName: !Sub "${PreProcessingCrossAccountReplicationRole}_s3"
      Roles:
        - !Ref PreProcessingReplicationRole

  # When the buckets are KMS-encrypted, the replication role must decrypt with the source key and
  # encrypt with the destination (transient bucket) key.
  PreProcessingReplicationRoleKmsPolicy:
    Type: AWS::IAM::Policy
    Condition: IsS3ReplicationKms
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - kms:Decrypt
              - kms:GenerateDataKey
            Resource: !Ref ConfigBucketKmsKeyArn
          - Effect: Allow
            Action:
              - kms:Encrypt
              - kms:GenerateDataKey
            Resource: !Ref TransientBucketKmsKeyArn
      PolicyName: !Sub "${PreProcessingCrossAccountReplicationRole}_kms"
      Roles:
        - !Ref PreProcessingReplicationRole

  # IAM role for the Lambda that configures replication on the AWS Config Logs bucket
  PreProcessingConfigBucketReplicationConfigurationLambdaRole:
    Type: AWS::IAM::Role
    Condition: IsConfigureS3Replication
    DeletionPolicy: "Delete"
    UpdateReplacePolicy: "Delete"
    Properties:
      RoleName: "crcd-preproc-s3-replication-config-role"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3BucketReplicationPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  # PutReplicationConfiguration requires iam:PassRole on the replication role.
                  # https://docs.aws.amazon.com/AmazonS3/latest/API/API_PutBucketReplication.html
                  - 'iam:PassRole'
                  - 's3:PutReplicationConfiguration'
                  - 's3:GetReplicationConfiguration'
                Resource:
                  - !Sub "arn:${AWS::Partition}:s3:::${ConfigBucketName}"
                  - !GetAtt PreProcessingReplicationRole.Arn

  # Lambda triggered by CloudFormation to configure bucket replication on the AWS Config Logs bucket
  PreProcessingConfigBucketReplicationConfigurationLambda:
  # checkov:skip=CKV_AWS_115: This is called only once by the CFN template.
  # checkov:skip=CKV_AWS_116: No DLQ by design. If this lambda fails, the whole CFN template fails.
    Type: AWS::Lambda::Function
    Condition: IsConfigureS3Replication
    DeletionPolicy: "Delete"
    UpdateReplacePolicy: "Delete"
    Properties:
      FunctionName: !Ref PreProcessingReplicationConfigurationLambdaName
      Description: "CRCD Dashboard Preprocessing - Configures a cross-account S3 replication on the AWS Config Logs bucket to the transient bucket (one-time execution)"
      Handler: index.lambda_handler
      LoggingConfig:
        LogFormat: "Text"
      Role: !GetAtt PreProcessingConfigBucketReplicationConfigurationLambdaRole.Arn
      Timeout: 300
      Runtime: "python3.14"
      MemorySize: 128
      EphemeralStorage:
        Size: 512
      Architectures:
        - "x86_64"
      VpcConfig:
        SecurityGroupIds: []
        SubnetIds: []
        Ipv6AllowedForDualStack: false
      RuntimeManagementConfig:
        UpdateRuntimeOn: "Auto"
      Code:
        ZipFile: |
          import json
          import boto3
          from botocore.exceptions import ClientError

          def lambda_handler(event, context):
            print("Request received:\n", json.dumps(event))

            # Get the necessary parameters from the event
            params = event['ResourceProperties']
            source_bucket_name = params['SourceBucket']
            destination_bucket_kms_key = params['DestinationBucketKmsKeyArn']
            destination_bucket_name = params['DestinationBucket']
            source_account_id = params['SourceAccountId']
            destination_account_id = params['DestinationAccountId']
            replication_role_arn = params['ReplicationRoleArn']
            replication_rule_name = 'crcd-preproc-configfile-replication'

            s3 = boto3.client('s3')

            if event['RequestType'] == 'Delete':
              # Remove only the CRCD preprocessing replication rule
              try:
                existing_config = s3.get_bucket_replication(Bucket=source_bucket_name)
                if 'ReplicationConfiguration' in existing_config:
                  rules = existing_config['ReplicationConfiguration']['Rules']
                  # Filter out the rule with the specified name
                  new_rules = [rule for rule in rules if rule['ID'] != replication_rule_name]
                  if len(new_rules) < len(rules):
                    if new_rules:
                      # Update the replication configuration with the remaining rules
                      new_config = existing_config['ReplicationConfiguration']
                      new_config['Rules'] = new_rules
                      s3.put_bucket_replication(Bucket=source_bucket_name, ReplicationConfiguration=new_config)
                    else:
                      # If no rules remain, delete the entire replication configuration
                      s3.delete_bucket_replication(Bucket=source_bucket_name)
                    print(f"Replication rule '{replication_rule_name}' deleted successfully.")
                  else:
                    print(f"Replication rule '{replication_rule_name}' not found.")
                else:
                  print("No replication configuration found.")
              except ClientError as e:
                if e.response['Error']['Code'] == 'ReplicationConfigurationNotFoundError':
                  print("No replication configuration found.")
                else:
                  send_response(event, context, 'FAILED', {'Error': str(e)})
                  return
            else:
              # Check if replication configuration already exists.
              # CRCD will not override any existing S3 replication configuration.
              try:
                existing_config = s3.get_bucket_replication(Bucket=source_bucket_name)
                if 'ReplicationConfiguration' in existing_config:
                  error_message = f"Replication configuration already exists on bucket {source_bucket_name}. CRCD dashboard Preprocessing deployment cannot proceed."
                  print(error_message)
                  # This will make the CloudFormation template fail
                  send_response(event, context, 'FAILED', {'Error': error_message})
                  return
              except ClientError as e:
                if e.response['Error']['Code'] != 'ReplicationConfigurationNotFoundError':
                  send_response(event, context, 'FAILED', {'Error': str(e)})
                  return

              # Configure the replication
              try:
                if (not destination_bucket_kms_key):
                  print('Replication configuration with SSE-S3 encrypted buckets')
                  replication_configuration = {
                    'Role': replication_role_arn,
                    'Rules': [
                      {
                        'ID': replication_rule_name,
                        'Status': 'Enabled',
                        'Priority': 1,
                        "DeleteMarkerReplication": {"Status": "Disabled"},
                        "Filter": {"Prefix": ""},
                        'Destination': {
                          'Bucket': f'arn:aws:s3:::{destination_bucket_name}',
                          'Account': destination_account_id
                        }
                      }
                    ]
                  }
                else:
                  print('Replication configuration with KMS encrypted buckets')
                  replication_configuration = {
                    'Role': replication_role_arn,
                    'Rules': [
                      {
                        'ID': replication_rule_name,
                        'Status': 'Enabled',
                        'Priority': 1,
                        "DeleteMarkerReplication": {"Status": "Disabled"},
                        "Filter": {"Prefix": ""},
                        'Destination': {
                          'Bucket': f'arn:aws:s3:::{destination_bucket_name}',
                          'Account': destination_account_id,
                          'EncryptionConfiguration': {
                            'ReplicaKmsKeyID': f'{destination_bucket_kms_key}'
                          },
                        },
                        'SourceSelectionCriteria': {
                          'SseKmsEncryptedObjects': {
                            'Status': 'Enabled'
                          },
                          'ReplicaModifications': {
                            'Status': 'Disabled'
                          }
                        }
                      }
                    ]
                  }

                print('Calling the s3 API')
                s3.put_bucket_replication(Bucket=source_bucket_name, ReplicationConfiguration=replication_configuration)
                print('Called the S3 API')
              except Exception as e:
                print('ERROR: ' + str(e))
                send_response(event, context, 'FAILED', {'Error': str(e)})
                return

            send_response(event, context, 'SUCCESS', {})

          def send_response(event, context, response_status, response_data):
            response_body = json.dumps({
              'Status': response_status,
              'Reason': 'See the details in CloudWatch Log Stream: ' + context.log_stream_name,
              'PhysicalResourceId': context.log_stream_name,
              'StackId': event['StackId'],
              'RequestId': event['RequestId'],
              'LogicalResourceId': event['LogicalResourceId'],
              'Data': response_data
            })

            response_url = event['ResponseURL']

            import urllib.request
            req = urllib.request.Request(response_url, data=response_body.encode('utf-8'), method='PUT')
            with urllib.request.urlopen(req) as f:
              print(f.read())
              print(f.info())
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W92
            reason: "This function does not need reserved concurrent executions"

