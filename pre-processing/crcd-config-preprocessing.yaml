        rules_to_suppress:
          - id: W92
            reason: "This function does not need reserved concurrent executions"

  ScriptUploaderLambdaLogGroup:
  # checkov:skip=CKV_AWS_158: No KMS encryption needed
    Type: AWS::Logs::LogGroup
    DeletionPolicy: "Delete"
    UpdateReplacePolicy: "Delete"
    Properties:
      LogGroupName: !Sub "/aws/lambda/${LambdaSupportScriptUploaderName}"
