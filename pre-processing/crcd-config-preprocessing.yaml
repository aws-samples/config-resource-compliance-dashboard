# Config Compliance Resource Dashboard - pre-processing 
# In environments with a large number of resources, AWS Config may generate files that are bigger that 32MB (uncompressed).
# This will break an Athena service limit and make it impossible to run queries, as all queries that try to open one of those files will fail.
# These resources will pre-process AWS Config files and generate smaller files that can potentially avoid the issue.

AWSTemplateFormatVersion: '2010-09-09'
Description: 'AWS Config Resource Compliance Dashboard (CRCD) - Preprocessing AWS Config files using AWS Fargate'

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      -
        Label:
          default: "AWS Config logging - the source of data for the pre-processing job, where your AWS Config files are delivered"
        Parameters:
          - ConfigBucketName
      -
        Label: 
          default: "Pre-processing job configuration"
        Parameters:
          - ConfigureS3EventNotificationToLambdaJobProducer
          - DashboardBucketNamePrefix
      -
        Label:
          default: "Technical Parameters (DO NOT CHANGE)"
        Parameters:
          - PreProcessingLambdaProducerName
          - DynamoDBJobTrackingTableName
          - LambdaSupportJobTriggerConfigurationName
          - LambdaSupportScriptUploaderName
          - LambdaSupportECSServiceRoleName
    
    ParameterLabels:
      ConfigBucketName:
        default: "AWS Config Logs bucket"
      DashboardBucketNamePrefix:
        default: "Dashboard bucket (prefix)"
      DynamoDBJobTrackingTableName:
        default: "Dynamo DB tracking table"
      ConfigureS3EventNotificationToLambdaJobProducer:
        default: "Configure S3 event notification to trigger the job automatically on every new AWS Config file"
      LambdaSupportJobTriggerConfigurationName:
        default: "Name of the Lambda function that performs supporting configurations: S3 object notification"
      PreProcessingLambdaProducerName:
        default: "Name of the Lambda function that triggers the pre-processing job"
      LambdaSupportScriptUploaderName:
        default: "Name of the Lambda function that uploads the preprocessing script to S3"
      LambdaSupportECSServiceRoleName:
        default: "Name of the Lambda function that ensures the ECS service-linked role exists"


Parameters:
  ConfigBucketName:
    Type: String
    Description: "Name of the Amazon S3 bucket collecting AWS Config files (Required)."
    MinLength: 1
    AllowedPattern: '^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$'
    ConstraintDescription: "AWS Config Logs bucket name is missing or does not satisfy the Amazon S3 naming convention."

  DashboardBucketNamePrefix:
    Type: String
    Description: "Prefix of the Amazon S3 bucket that will store the transformed AWS Config files. This can be used as source of data for the dashboard. The Dashboard bucket will be created with the prefix you specify here, account ID and region will be added automatically (Required)."
    AllowedPattern: '^[a-z0-9][a-z0-9-]{1,30}[a-z0-9]$'
    MinLength: 1
    Default: 'crcd-dashboard-bucket' 
    ConstraintDescription: "Dashboard bucket prefix name is missing or does not satisfy the Amazon S3 naming convention."

  PreProcessingLambdaProducerName:
    Type: String
    Default: "crcd-config-preprocessing-producer"
    MinLength: 1
    ConstraintDescription: "Required: AWS Lambda function that triggers the preprocessing job of AWS Config files."
    Description: "Name of the AWS Lambda function that triggers the preprocessing job of AWS Config files (Required)."


  DynamoDBJobTrackingTableName:
    Type: String
    Default: 'CRCDPreprocessingJobTracking'
    MinLength: 1
    ConstraintDescription: "Required: name of the Amazon DynamoDB table used to track the activities of the pre-processing job."
    Description: "Name of the Amazon DynamoDB table used to track the activities of the pre-processing job (Required)."

  ConfigureS3EventNotificationToLambdaJobProducer:
    Type: "String"
    Description:  "Select 'yes' to configure event notifications that will trigger the pre-processing job whenever there is a new AWS Config file added to the bucket. Select 'no' if you already have S3 event notifications configured on the AWS Config Logs bucket. In this case, you must configure S3 event notifications manually."
    AllowedValues: ['<select>', 'yes', 'no']
    Default: "<select>" # This value is used below, careful if you change it

  LambdaSupportJobTriggerConfigurationName:
    Type: "String"
    Default: "crcd-support-configure-s3-notification-preprocessing-job"
    MinLength: 1
    ConstraintDescription: "Required: AWS Lambda function that configures S3 notifications on the AWS Config Logs bucket."
    Description: "Name of the AWS Lambda function that configures S3 notifications on the AWS Config Logs bucket (Required)."

  LambdaSupportScriptUploaderName:
    Type: "String"
    Default: "crcd-support-upload-preprocessing-script"
    MinLength: 1
    ConstraintDescription: "Required: AWS Lambda function that uploads the preprocessing script to S3."
    Description: "Name of the AWS Lambda function that uploads the preprocessing script to S3 (Required)."

  LambdaSupportECSServiceRoleName:
    Type: "String"
    Default: "crcd-support-ensure-ecs-service-role"
    MinLength: 1
    ConstraintDescription: "Required: AWS Lambda function that ensures the ECS service-linked role exists."
    Description: "Name of the AWS Lambda function that ensures the ECS service-linked role exists (Required)."

Conditions:
  IsConfigureS3EventNotificationToLambdaJobProducer:
    # some customers may already have S3 notifications out of the AWS Config Logs bucket
    # we must not override that - and users will have to do that manually later
    !Equals [!Ref ConfigureS3EventNotificationToLambdaJobProducer, 'yes']

Rules:
  MandatoryConfigBucketName:
    Assertions:
      - Assert: !Not
         - !Equals
          - !Ref ConfigBucketName
          - ''
        AssertDescription: "AWS Config Logs bucket name is required"

  MandatoryDashboardBucketNamePrefix:
    Assertions:
      - Assert: !Not
        - !Equals
          - !Ref DashboardBucketNamePrefix
          - ''
        AssertDescription: "Dashboard bucket name prefix is required"
  
  MandatoryPreProcessingLambdaProducerName:
    Assertions:
      - Assert: !Not
        - !Equals
          - !Ref PreProcessingLambdaProducerName
          - ''
        AssertDescription: "Lambda function name is required"


  MandatoryLambdaSupportJobTriggerConfigurationName:
    Assertions:
      - Assert: !Not
        - !Equals
          - !Ref LambdaSupportJobTriggerConfigurationName
          - ''
        AssertDescription: "Lambda function name is required"


  ValidateConfigureS3EventNotificationToLambdaJobProducer:
    # must be selected
    Assertions:
      - Assert: !Not
        - !Equals
          - !Ref ConfigureS3EventNotificationToLambdaJobProducer
          - '<select>'
        AssertDescription: "REQUIRED PARAMETER - Select 'yes' if you want this template to configure the S3 event notification that triggers the pre-processing job when new AWS Config files are received. Select 'no' if you already have S3 event notifications on the AWS Config Logs bucket and want to configure this manually."




Resources:

  # *************************************************************************************************************************
  # *************************************************************************************************************************
  # S3 buckets and resources that deal with S3 buckets
  # *************************************************************************************************************************
  # *************************************************************************************************************************

  # S3 notifications to trigger the Lambda Job Producer function - only if user selected that
  # S3 Bucket Permission for Lambda - AWS Config Logs bucket to trigger this Lambda on each new object
  LambdaInvocationPermissionPreprocessingJobProducer:
    Type: AWS::Lambda::Permission
    Condition: IsConfigureS3EventNotificationToLambdaJobProducer
    DeletionPolicy: "Delete"
    UpdateReplacePolicy: "Delete"
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ConfigFilePreprocessingProducerLambda # Lambda to trigger
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:${AWS::Partition}:s3:::${ConfigBucketName}"


  ConfigBucketNotificationConfigurationLambdaJobProducerTrigger:
    Type: Custom::ConfigBucketLambdaJobProducer
    Condition: IsConfigureS3EventNotificationToLambdaJobProducer
    DependsOn:
    - LambdaInvocationPermissionPreprocessingJobProducer
    Properties:
      ServiceToken: !GetAtt ConfigBucketNotificationConfigurationLambdaJobProducer.Arn
      Bucket: !Ref ConfigBucketName
      # this is needed so that the Lambda function deletes only S3 notification configurations if they have this name
      # passing it here and as part of NotificationConfiguration so that I do not have to hard-code this string on the Lambda code 
      EventNotificationName: "CRCDPreprocessingJobTrigger"
      NotificationConfiguration:
        LambdaFunctionConfigurations:
        - Events: ['s3:ObjectCreated:*']
          LambdaFunctionArn: !GetAtt ConfigFilePreprocessingProducerLambda.Arn
          # this is needed so that the Lambda function deletes only S3 notification configurations if they have this name
          Id: "CRCDPreprocessingJobTrigger"

  ConfigBucketNotificationConfigurationLambdaJobProducerRole:
    Type: AWS::IAM::Role
    Condition: IsConfigureS3EventNotificationToLambdaJobProducer
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3BucketNotificationPolicyJobProducer
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - 's3:PutBucketNotification'
                  - 's3:GetBucketNotification'
                Resource: !Sub "arn:${AWS::Partition}:s3:::${ConfigBucketName}"

  # Lambda triggered by CloudFormation to configure bucket notification on AWS Config AWS Config Logs bucket
  ConfigBucketNotificationConfigurationLambdaJobProducer:
  # checkov:skip=CKV_AWS_115: This is called only once by the CFN template.
  # checkov:skip=CKV_AWS_116: No DLQ by design. If this lambda fails, the whole CFN template fails.
    Type: AWS::Lambda::Function
    DependsOn: ConfigBucketNotificationConfigurationLambdaJobProducerLogGroup
    Condition: IsConfigureS3EventNotificationToLambdaJobProducer
    DeletionPolicy: "Delete"
    UpdateReplacePolicy: "Delete"
    Properties:
      FunctionName: !Sub "${LambdaSupportJobTriggerConfigurationName}"
      Description: "CRCD Dashboard - Configures the AWS Config Logs bucket S3 event notification to trigger the CRCD Lambda Preprocessing Job Producer function (one-time execution)"
      Handler: index.lambda_handler
      Role: !GetAtt ConfigBucketNotificationConfigurationLambdaJobProducerRole.Arn
      Timeout: 300
      Runtime: "python3.14"
      MemorySize: 128
      EphemeralStorage:
        Size: 512
      Architectures:
        - "x86_64"
      TracingConfig:
        Mode: "Active"
      VpcConfig:
        SecurityGroupIds: []
        SubnetIds: []
        Ipv6AllowedForDualStack: false
      RuntimeManagementConfig:
        UpdateRuntimeOn: "Auto"
      LoggingConfig:
        LogFormat: "Text"
        # this is already by default LogGroup: "/aws/lambda/crcd-support-configure-s3-event-notification"
      Code:
        ZipFile: |
          import json
          import boto3

          def lambda_handler(event, context):
              
              print("Request received:\n", json.dumps(event))
              
              # Get the necessary parameters from the event
              params = event['ResourceProperties']
              bucket_name = params['Bucket']
              notification_event_name = params['EventNotificationName']
              notification_config = params['NotificationConfiguration']

              s3 = boto3.client('s3')

              if event['RequestType'] == 'Create':
                  # Check for existing notification configuration
                  # The CRCD Dashboard will not overwrite existing event notifications, and this function will fail
                  try:
                      existing_config = s3.get_bucket_notification_configuration(Bucket=bucket_name)
                      if has_notifications(existing_config):
                          # If there's an existing configuration, fail the Lambda function
                          error_message = f"Existing S3 event configuration found on bucket {bucket_name}. CRCD dashboard deployment cannot proceed."
                          print(error_message)
                          print(f"Existing S3 event configuration: {existing_config}")
                          send_response(event, context, 'FAILED', {'Error': error_message})
                          return  # Exit the function early
                  except Exception as e:
                      error_message = f"Error checking existing configuration: {str(e)}"
                      print(error_message)
                      send_response(event, context, 'FAILED', {'Error': error_message})
                      return  # Exit the function early

              if event['RequestType'] == 'Delete':
                  # Must check if the current event notification is the one from CRCD, only in that case it will be deleted
                  # Will cycle to all notification configurations and delete only the one pertaining to CRCD
                  try:
                      existing_config = s3.get_bucket_notification_configuration(Bucket=bucket_name)

                      # Initialize new configuration
                      new_notification_config = {
                          'LambdaFunctionConfigurations': [],
                          'QueueConfigurations': [],
                          'TopicConfigurations': []
                      }
                      
                      # Flag to check if we found and removed the matching configuration
                      config_removed = False

                      # Iterate through all types of configurations
                      # There could be non overlapping event notifications out of the bucket
                      for config_type in ['LambdaFunctionConfigurations', 'QueueConfigurations', 'TopicConfigurations']:
                          for config in existing_config.get(config_type, []):
                              if config.get('Id') == notification_event_name:
                                  config_removed = True
                                  print(f"Removing CRCD configuration with Id: {notification_event_name}")
                              else:
                                  print(f"Found non-CRCD configuration: {config.get('Id')}")
                                  new_notification_config[config_type].append(config)

                      # Remove empty lists from the new_notification_config
                      # e.g. 'TopicConfigurations' if none were found
                      new_notification_config = {k: v for k, v in new_notification_config.items() if v}

                      if not config_removed:
                          print(f"No matching event notification found for {notification_event_name}. No changes made.")
                          send_response(event, context, 'SUCCESS', {})
                          return

                      # Update notification_config to be used in put_bucket_notification_configuration
                      notification_config = new_notification_config
                      
                  except Exception as e:
                      error_message = f"Error processing existing configuration: {str(e)}"
                      print(error_message)
                      send_response(event, context, 'FAILED', {'Error': error_message})
                      return
              
              try:
                  # Configure the bucket notification
                  s3.put_bucket_notification_configuration(
                      Bucket=bucket_name,
                      NotificationConfiguration=notification_config
                  )
                  
                  # Send a successful response back to CloudFormation
                  send_response(event, context, 'SUCCESS', {})
              
              except Exception as e:
                  # Send a failed response back to CloudFormation
                  send_response(event, context, 'FAILED', {'Error': str(e)})

          def has_notifications(config):
              # Check if the configuration has any S3 notifications as indicated by the types below
              # pass the outcome of s3.get_bucket_notification_configuration
              notification_types = ['TopicConfigurations', 'QueueConfigurations', 'LambdaFunctionConfigurations']
              return any(config.get(type_) for type_ in notification_types)

          def send_response(event, context, response_status, response_data):
              response_body = json.dumps({
                  'Status': response_status,
                  'Reason': 'See the details in CloudWatch Log Stream: ' + context.log_stream_name,
                  'PhysicalResourceId': context.log_stream_name,
                  'StackId': event['StackId'],
                  'RequestId': event['RequestId'],
                  'LogicalResourceId': event['LogicalResourceId'],
                  'Data': response_data
              })

              response_url = event['ResponseURL']
              
              import urllib.request
              req = urllib.request.Request(response_url, data=response_body.encode('utf-8'), method='PUT')
              with urllib.request.urlopen(req) as f:
                  print(f.read())
                  print(f.info())
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W92
            reason: "This function does not need reserved concurrent executions"


  ConfigBucketNotificationConfigurationLambdaJobProducerLogGroup:
  # checkov:skip=CKV_AWS_158: No KMS encryption needed
    Type: AWS::Logs::LogGroup
    Condition: IsConfigureS3EventNotificationToLambdaJobProducer
    DeletionPolicy: "Delete"
    UpdateReplacePolicy: "Delete"
    Properties:
      LogGroupName: !Sub "/aws/lambda/${LambdaSupportJobTriggerConfigurationName}"
      RetentionInDays: 14
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W84
            reason: "No KMS encryption needed"

  DashboardBucket:
  # checkov:skip=CKV_AWS_18: No need of Access Logging, customers will add it if required
    Type: AWS::S3::Bucket
    DeletionPolicy: "Delete"
    UpdateReplacePolicy: "Delete"
    Properties:
      BucketName: !Sub '${DashboardBucketNamePrefix}-${AWS::AccountId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      AccessControl: BucketOwnerFullControl
      # This bucket needs versioning because the default Control Tower AWS Config bucket has it
      # And the Dashboard account installation will use replication, that requires versioning
      VersioningConfiguration:
        Status: Enabled
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      # BSC12 risk mitigation
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
    Metadata:
      cfn-lint:
        config:
          ignore_checks:
            - W3045 # Consider using AWS::S3::BucketPolicy instead of AccessControl
      
  

  # *************************************************************************************************************************
  # *************************************************************************************************************************
  # Lambda that triggers the Fargate task for every new AWS Config file on AWS Config Logs bucket
  # *************************************************************************************************************************
  # *************************************************************************************************************************

  IAMRoleConfigFilePreprocessingProducerLambda:
    Type: AWS::IAM::Role
    DeletionPolicy: "Delete"
    UpdateReplacePolicy: "Delete"
    Properties:
      RoleName: "crcd-lambda-preprocessing-job-producer-role"
      Description: "CRCD Dashboard - Allows to trigger Fargate tasks, send logs to CloudWatch, and write to DynamoDB."
      Path: "/"
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: crcd-preprocessing-trigger-fargate-dynamodb
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                Resource: !GetAtt CRCDJobTrackingTable.Arn
              - Effect: Allow
                Action:
                  - ecs:RunTask
                Resource: !Ref PreProcessingTaskDefinition
              - Effect: Allow
                Action:
                  - iam:PassRole
                Resource:
                  - !GetAtt PreProcessingTaskExecutionRole.Arn
                  - !GetAtt PreProcessingTaskRole.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub "arn:${AWS::Partition}:s3:::${ConfigBucketName}/*"
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub '${DashboardBucket.Arn}/*'

  # Lambda Function that triggers Fargate tasks
  ConfigFilePreprocessingProducerLambda:
  # checkov:skip=CKV_AWS_115: Cuncurrency limit needs are customer-dependent. This lambda is called whenever AWS Config delivers a file to S3, we don't anticipate the need for reserved concurrency for the moment.
  # checkov:skip=CKV_AWS_173: Environment variables are not sensitive.
  # checkov:skip=CKV_AWS_116: No DLQ needed
    Type: AWS::Lambda::Function
    DependsOn: ConfigFilePreprocessingProducerLambdaLogGroup
    DeletionPolicy: "Delete"
    UpdateReplacePolicy: "Delete"
    Properties:
      FunctionName: !Sub "${PreProcessingLambdaProducerName}"
      Description: "CRCD Dashboard - Lambda function that triggers a Fargate task to pre-process new AWS Config files"
      Handler: index.lambda_handler
      Role: !GetAtt IAMRoleConfigFilePreprocessingProducerLambda.Arn
      LoggingConfig:
        LogFormat: "Text"
      Runtime: python3.14
      Timeout: 120
      EphemeralStorage:
        Size: 512
      MemorySize: 128
      Architectures:
        - "x86_64"
      VpcConfig:
        SecurityGroupIds: []
        SubnetIds: []
        Ipv6AllowedForDualStack: false
      Environment:
        Variables:
          DYNAMODB_TRACKING_TABLE_NAME: !Ref DynamoDBJobTrackingTableName
          DASHBOARD_BUCKET_NAME: !Ref DashboardBucket
          ECS_CLUSTER_ARN: !GetAtt PreProcessingECSCluster.Arn
          ECS_TASK_DEFINITION_ARN: !Ref PreProcessingTaskDefinition
          ECS_TASK_SUBNETS: !Join [",", [!Ref PreProcessingPublicSubnet1, !Ref PreProcessingPublicSubnet2]]
          ECS_TASK_SECURITY_GROUPS: !Ref PreProcessingFargateSecurityGroup
          CONFIG_OBJECT_SIZE_THRESHOLD_BYTES: "200000"
      Code:
        ZipFile: |
          import boto3
          import json
          import urllib.parse
          from datetime import datetime
          import os
          import re

          PATTERN = r'^(?P<org_id>[\w-]+)?/?AWSLogs/(?P<account_id>\d+)/Config/(?P<region>[\w-]+)/(?P<year>\d+)/(?P<month>\d+)/(?P<day>\d+)/(?P<type>ConfigSnapshot|ConfigHistory)/[^//]+$'

          DEFAULT_CONFIG_OBJECT_SIZE_THRESHOLD = 200000

          def lambda_handler(event, context):
              tracking_table_name = os.environ["DYNAMODB_TRACKING_TABLE_NAME"]
              dynamodb = boto3.resource('dynamodb').Table(tracking_table_name)
              dashboard_bucket_name = os.environ["DASHBOARD_BUCKET_NAME"]

              ecs = boto3.client('ecs')
              cluster_arn = os.environ["ECS_CLUSTER_ARN"]
              task_definition = os.environ["ECS_TASK_DEFINITION_ARN"]
              subnets = os.environ["ECS_TASK_SUBNETS"].split(",")
              security_groups = os.environ["ECS_TASK_SECURITY_GROUPS"].split(",")

              size_threshold = DEFAULT_CONFIG_OBJECT_SIZE_THRESHOLD
              size_threshold_parameter = os.environ.get("CONFIG_OBJECT_SIZE_THRESHOLD_BYTES", "")
              try:
                  size_threshold = int(size_threshold_parameter) if size_threshold_parameter.strip() else DEFAULT_CONFIG_OBJECT_SIZE_THRESHOLD
              except ValueError:
                  print(f"Warning: CONFIG_OBJECT_SIZE_THRESHOLD_BYTES '{size_threshold_parameter}' is not a valid integer. Using default value of {DEFAULT_CONFIG_OBJECT_SIZE_THRESHOLD} bytes.")

              records = event['Records']
              for record in records:
                  bucket = record['s3']['bucket']['name']
                  key = urllib.parse.unquote_plus(record['s3']['object']['key'])

                  match = re.match(PATTERN, key)
                  if not match:
                      print(f'SKIPPING: Cannot match {key} as AWS Config file, skipping.')
                      continue

                  object_size = record['s3']['object']['size']

                  filename = os.path.basename(key)
                  filename = filename.replace('.json.gz', '')

                  parts = filename.split('_')
                  if len(parts) >= 2:
                      timestamp_and_random = f"{parts[-2]}_{parts[-1]}"
                  else:
                      timestamp_and_random = filename

                  run_id = timestamp_and_random

                  if object_size < size_threshold:
                      print(f"Object size {object_size} bytes is below threshold of {size_threshold} bytes. Copying directly to destination bucket.")
                      s3_client = boto3.client('s3')
                      try:
                          s3_client.copy_object(
                              CopySource={'Bucket': bucket, 'Key': key},
                              Bucket=dashboard_bucket_name,
                              Key=key
                          )
                          dynamodb.put_item(
                              Item={
                                  'source_file': key,
                                  'job_run_id': run_id,
                                  'status': 'COMPLETED',
                                  'start_time': datetime.now().isoformat(),
                                  'end_time': datetime.now().isoformat(),
                                  'object_size': object_size,
                                  'processing_method': 'DIRECT_COPY',
                                  'ttl': int((datetime.now().timestamp()) + (90 * 24 * 60 * 60))
                              }
                          )
                          print(f"Successfully copied {key} to {dashboard_bucket_name}/{key}")
                      except Exception as e:
                          print(f"Error copying object {key}: {str(e)}")
                          dynamodb.put_item(
                              Item={
                                  'source_file': key,
                                  'job_run_id': run_id,
                                  'status': 'FAILED',
                                  'start_time': datetime.now().isoformat(),
                                  'object_size': object_size,
                                  'error_message': str(e),
                                  'ttl': int((datetime.now().timestamp()) + (90 * 24 * 60 * 60))
                              }
                          )
                          raise
                  else:
                      dynamodb.put_item(
                          Item={
                              'source_file': key,
                              'job_run_id': run_id,
                              'status': 'STARTED',
                              'start_time': datetime.now().isoformat(),
                              'object_size': object_size,
                              'processing_method': 'FARGATE',
                              'ttl': int((datetime.now().timestamp()) + (90 * 24 * 60 * 60))
                          }
                      )

                      try:
                          response = ecs.run_task(
                              cluster=cluster_arn,
                              taskDefinition=task_definition,
                              launchType='FARGATE',
                              networkConfiguration={
                                  'awsvpcConfiguration': {
                                      'subnets': subnets,
                                      'securityGroups': security_groups,
                                      'assignPublicIp': 'ENABLED'
                                  }
                              },
                              overrides={
                                  'containerOverrides': [{
                                      'name': 'crcd-preprocessing',
                                      'environment': [
                                          {'name': 'SOURCE_PATH', 'value': f's3://{bucket}/{key}'},
                                          {'name': 'DESTINATION_BUCKET', 'value': dashboard_bucket_name},
                                          {'name': 'TRACKING_TABLE_NAME', 'value': tracking_table_name},
                                          {'name': 'JOB_RUN_ID', 'value': run_id}
                                      ]
                                  }]
                              }
                          )

                          task_arn = response['tasks'][0]['taskArn'] if response['tasks'] else 'UNKNOWN'
                          print(f"Started Fargate task {task_arn} for {key} with run ID: {run_id}")

                      except Exception as e:
                          print(f"Error starting Fargate task for {key}: {str(e)}")
                          dynamodb.update_item(
                              Key={'source_file': key, 'job_run_id': run_id},
                              UpdateExpression="SET #status = :s, error_message = :e",
                              ExpressionAttributeNames={'#status': 'status'},
                              ExpressionAttributeValues={':s': 'FAILED', ':e': str(e)}
                          )
                          raise

              return {
                  'statusCode': 200,
                  'body': json.dumps('Successfully processed S3 event')
              }
      

  # log group for the lambda, with retention period
  ConfigFilePreprocessingProducerLambdaLogGroup:
  # checkov:skip=CKV_AWS_158: No KMS encryption needed
    Type: AWS::Logs::LogGroup
    DeletionPolicy: "Delete"
    UpdateReplacePolicy: "Delete"
    Properties:
      LogGroupName: !Sub "/aws/lambda/${PreProcessingLambdaProducerName}"
      RetentionInDays: 14
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W84
            reason: "No KMS encryption needed"

  # *************************************************************************************************************************
  # *************************************************************************************************************************
  # Dynamo DB table to track the pre-processing activities
  # *************************************************************************************************************************
  # *************************************************************************************************************************

  # DynamoDB Table
  CRCDJobTrackingTable:
  # checkov:skip=CKV_AWS_119: This is a tracking table, no need for encryption
  # checkov:skip=CKV_AWS_28: This is a tracking table, no need for point-in-time recovery
    Type: AWS::DynamoDB::Table
    DeletionPolicy: "Delete"
    UpdateReplacePolicy: "Delete"
    Properties:
      TableName: !Ref DynamoDBJobTrackingTableName
      AttributeDefinitions:
        - AttributeName: source_file
          AttributeType: S
        - AttributeName: job_run_id
          AttributeType: S
      KeySchema:
        - AttributeName: source_file
          KeyType: HASH
        - AttributeName: job_run_id
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true


  # *************************************************************************************************************************
  # *************************************************************************************************************************
  # Fargate task that performs the streaming split of AWS Config files
  # *************************************************************************************************************************
  # *************************************************************************************************************************

  # -----------------------------------------------------------------------------------------------------------------------
  # Dedicated VPC for the pre-processing Fargate task.
  # The stack creates its own isolated VPC so it never touches the customer's existing networking:
  #   - No customer VPC/subnet/route-table inputs are required.
  #   - The gateway endpoints attach only to our route table, so their scoped policies cannot affect any
  #     other workload in the account.
  # This is a PUBLIC VPC: the task gets a public IP and egresses via the Internet Gateway to pull its
  # public container image (public ECR) and PyPI packages, while S3 and DynamoDB traffic (the sensitive
  # Config-data path) stays on the AWS private network via the gateway endpoints below.
  # -----------------------------------------------------------------------------------------------------------------------
  PreProcessingVPC:
  # checkov:skip=CKV2_AWS_11: VPC flow logs not required for this isolated, single-purpose preprocessing VPC
    Type: AWS::EC2::VPC
    DeletionPolicy: "Delete"
    UpdateReplacePolicy: "Delete"
    Properties:
      CidrBlock: 10.0.0.0/24
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: crcd-preprocessing-vpc
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W60
            reason: "Flow logs are not required for this isolated, single-purpose preprocessing VPC"

  PreProcessingInternetGateway:
    Type: AWS::EC2::InternetGateway
    DeletionPolicy: "Delete"
    UpdateReplacePolicy: "Delete"
    Properties:
      Tags:
        - Key: Name
          Value: crcd-preprocessing-igw

  PreProcessingVPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref PreProcessingVPC
      InternetGatewayId: !Ref PreProcessingInternetGateway

  PreProcessingPublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref PreProcessingVPC
      CidrBlock: 10.0.0.0/25
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: crcd-preprocessing-public-subnet-1

  PreProcessingPublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref PreProcessingVPC
      CidrBlock: 10.0.0.128/25
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: crcd-preprocessing-public-subnet-2

  PreProcessingPublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref PreProcessingVPC
      Tags:
        - Key: Name
          Value: crcd-preprocessing-public-rtb

  PreProcessingDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: PreProcessingVPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PreProcessingPublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref PreProcessingInternetGateway

  PreProcessingPublicSubnet1RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PreProcessingPublicSubnet1
      RouteTableId: !Ref PreProcessingPublicRouteTable

  PreProcessingPublicSubnet2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PreProcessingPublicSubnet2
      RouteTableId: !Ref PreProcessingPublicRouteTable

  # Security group for the Fargate task. Egress only, restricted to HTTPS (443). No ingress rules
  # (the task never accepts inbound connections). Outbound 443 is required so the task can pull its
  # public container image (public ECR), install Python dependencies (PyPI), and reach the AWS
  # service endpoints it uses (S3, DynamoDB, CloudWatch Logs).
  PreProcessingFargateSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    DeletionPolicy: "Delete"
    UpdateReplacePolicy: "Delete"
    Properties:
      GroupDescription: "CRCD preprocessing Fargate task - outbound HTTPS (443) only, no inbound"
      VpcId: !Ref PreProcessingVPC
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: "Outbound HTTPS to pull the public container image and PyPI packages, and to reach AWS service endpoints (S3, DynamoDB, CloudWatch Logs)"
      Tags:
        - Key: Name
          Value: crcd-preprocessing-fargate-sg
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W5
            reason: "The Fargate task requires outbound internet access to pull its public container image and PyPI packages; egress is intentionally restricted to TCP port 443"
          - id: W40
            reason: "Egress is intentionally restricted to a single protocol/port (TCP 443) rather than all protocols"

  # -----------------------------------------------------------------------------------------------------------------------
  # Gateway VPC endpoints for S3 and DynamoDB (both free).
  # These keep the Fargate task's S3 (Config file content) and DynamoDB (job tracking) traffic on the
  # AWS private network instead of egressing via the internet gateway to the public service endpoints.
  # They attach only to our dedicated route table, so their scoped policies never affect other workloads.
  # -----------------------------------------------------------------------------------------------------------------------

  # Gateway endpoint for S3 (free). Carries the Fargate task's Config file reads and split-output writes.
  # The endpoint policy restricts access through this endpoint to only the source AWS Config Logs bucket
  # and the Dashboard bucket (and their objects).
  PreProcessingS3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref PreProcessingVPC
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PreProcessingPublicRouteTable
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: "AllowCRCDConfigDataAccess"
            Effect: Allow
            Principal: "*"
            Action:
              - "s3:GetObject"
              - "s3:PutObject"
              - "s3:ListBucket"
            Resource:
              - !Sub "arn:${AWS::Partition}:s3:::${ConfigBucketName}"
              - !Sub "arn:${AWS::Partition}:s3:::${ConfigBucketName}/*"
              - !GetAtt DashboardBucket.Arn
              - !Sub "${DashboardBucket.Arn}/*"

  # Gateway endpoint for DynamoDB (free). Carries the Fargate task's job tracking table updates.
  # The endpoint policy restricts access through this endpoint to only the CRCD job tracking table.
  PreProcessingDynamoDBGatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref PreProcessingVPC
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.dynamodb"
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PreProcessingPublicRouteTable
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: "AllowCRCDJobTrackingTableAccess"
            Effect: Allow
            Principal: "*"
            Action:
              - "dynamodb:GetItem"
              - "dynamodb:UpdateItem"
            Resource:
              - !GetAtt CRCDJobTrackingTable.Arn

  ECSServiceLinkedRoleLambdaRole:
    Type: AWS::IAM::Role
    DeletionPolicy: "Delete"
    UpdateReplacePolicy: "Delete"
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: CreateServiceLinkedRole
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - iam:CreateServiceLinkedRole
                Resource: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/ecs.amazonaws.com/*"

  ECSServiceLinkedRoleLambda:
  # checkov:skip=CKV_AWS_115: One-time execution
  # checkov:skip=CKV_AWS_116: No DLQ needed
    Type: AWS::Lambda::Function
    DependsOn: ECSServiceLinkedRoleLambdaLogGroup
    DeletionPolicy: "Delete"
    UpdateReplacePolicy: "Delete"
    Properties:
      FunctionName: !Sub "${LambdaSupportECSServiceRoleName}"
      Description: "CRCD Dashboard - Creates ECS service-linked role if it does not already exist (one-time execution)"
      Runtime: python3.14
      Timeout: 180
      MemorySize: 128
      Architectures:
        - "x86_64"
      Handler: index.lambda_handler
      Role: !GetAtt ECSServiceLinkedRoleLambdaRole.Arn
      Environment:
        Variables:
          # Exponential backoff configuration for confirming the ECS service-linked role
          # has propagated (IAM is eventually consistent). Both values are configurable.
          ECS_SERVICE_LINKED_ROLE_MAX_ATTEMPTS: "5"
          ECS_SERVICE_LINKED_ROLE_BASE_DELAY_SECONDS: "3"
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          import os
          import time

          def lambda_handler(event, context):
              try:
                  if event['RequestType'] in ['Create', 'Update']:
                      iam = boto3.client('iam')
                      role_name = 'AWSServiceRoleForECS'
                      max_attempts = int(os.environ.get('ECS_SERVICE_LINKED_ROLE_MAX_ATTEMPTS', '5'))
                      base_delay = float(os.environ.get('ECS_SERVICE_LINKED_ROLE_BASE_DELAY_SECONDS', '3'))

                      created = False
                      try:
                          iam.create_service_linked_role(AWSServiceName='ecs.amazonaws.com')
                          created = True
                          print("Created ECS service-linked role")
                      except iam.exceptions.InvalidInputException:
                          print("ECS service-linked role already exists, skipping")

                      # IAM is eventually consistent. When we just created the role, ECS
                      # CreateCluster can fail with "Unable to assume the service linked role"
                      # if it runs before the role has propagated. Confirm the role is
                      # retrievable using exponential backoff (delay = base * 2**attempt),
                      # and fail explicitly if it never appears after max_attempts.
                      if created:
                          for attempt in range(max_attempts):
                              delay = base_delay * (2 ** attempt)
                              time.sleep(delay)
                              try:
                                  iam.get_role(RoleName=role_name)
                                  print(f"ECS service-linked role available after {attempt + 1} attempt(s)")
                                  break
                              except iam.exceptions.NoSuchEntityException:
                                  print(f"Attempt {attempt + 1}/{max_attempts}: role not yet available, backed off {delay}s")
                          else:
                              msg = (f"ECS service-linked role '{role_name}' did not become "
                                     f"available after {max_attempts} attempts")
                              print(msg)
                              cfnresponse.send(event, context, cfnresponse.FAILED, {'Error': msg})
                              return
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
              except Exception as e:
                  print(f"Error: {str(e)}")
                  cfnresponse.send(event, context, cfnresponse.FAILED, {'Error': str(e)})
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W92
            reason: "This function does not need reserved concurrent executions"

  ECSServiceLinkedRoleLambdaLogGroup:
  # checkov:skip=CKV_AWS_158: No KMS encryption needed
    Type: AWS::Logs::LogGroup
    DeletionPolicy: "Delete"
    UpdateReplacePolicy: "Delete"
    Properties:
      LogGroupName: !Sub "/aws/lambda/${LambdaSupportECSServiceRoleName}"
      RetentionInDays: 14
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W84
            reason: "No KMS encryption needed"

  EnsureECSServiceLinkedRole:
    Type: Custom::ECSServiceLinkedRole
    Properties:
      ServiceToken: !GetAtt ECSServiceLinkedRoleLambda.Arn

  PreProcessingECSCluster:
    Type: AWS::ECS::Cluster
    DependsOn: EnsureECSServiceLinkedRole
    DeletionPolicy: "Delete"
    UpdateReplacePolicy: "Delete"
    Properties:
      ClusterName: "crcd-preprocessing-cluster"
      CapacityProviders:
