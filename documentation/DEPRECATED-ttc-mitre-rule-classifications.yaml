# CRCD CIRT Conformance Pack - Rule Classification Reference Data
# 
# This file defines the classification taxonomy and CIRT-recommended AWS Config rules
# based on the Threat Technique Catalog(TTC) for AWS (MITRE ATT&CK® framework)
# https://aws-samples.github.io/threat-technique-catalog-for-aws/
#
# Naming Convention: crcd-cirt-<lv1>-<lv2>-<rule-name>
# Tags: crcd-cirt-lv1=<lv1>, crcd-cirt-lv2=<lv2>

# Schema Documentation
# 
# Rule Structure:
#   rule_name: string (follows naming convention crcd-cirt-<lv1>-<lv2>-<rule-name>)
#   rule_type: enum ["STANDARD", "CUSTOM"]
#     - STANDARD: AWS-managed Config rule (no Lambda function required)
#     - CUSTOM: Custom Config rule backed by Lambda function
#   source_identifier: string
#     - For STANDARD rules: AWS managed rule identifier (e.g., "S3_BUCKET_PUBLIC_READ_PROHIBITED")
#     - For CUSTOM rules: "LAMBDA_ARN_PLACEHOLDER" (replaced with actual Lambda ARN during deployment)
#   classification: object
#     - level1: string (full Level 1 category name)
#     - level1_abbrev: string (Level 1 abbreviation used in rule name)
#     - level2: string (full Level 2 technique name)
#     - level2_abbrev: string (Level 2 abbreviation used in rule name)
#     - mitre_attack_id: string (MITRE ATT&CK technique ID, e.g., "T1190")
#   description: string (brief description of what the rule checks)
#   cirt_rationale: string (CIRT explanation of why this rule is recommended)
#   resource_types: array of strings (AWS resource types evaluated by this rule)
#     Usage:
#     - Maps to the Scope property in AWS::Config::ConfigRule CloudFormation resources
#     - Used to generate least-privilege IAM permissions for Lambda execution roles (CUSTOM rules)
#     - Documents which AWS resources each rule monitors
#     - Enables validation that rule configuration matches evaluated resource types
#     Special cases:
#     - For account-level rules (e.g., ROOT_ACCOUNT_MFA_ENABLED), use empty array: [] - e.g. resource_types: []
#     - Account-level rules check AWS account settings, not specific resources
#   parameters: object (rule-specific configuration parameters, empty object if none)

# Classification Taxonomy
# Level 1 categories match with the Tactics on the Threat Technique Catalog for AWS
# Level 2 categories match with the Techniques on the Threat Technique Catalog for AWS
taxonomy:
  level1_classification:
    - name: "Initial Access"
      abbreviation: "ia"
      description: "Techniques used to gain initial access to AWS environments"
      
    - name: "Execution"
      abbreviation: "ex"
      description: "Techniques that result in adversary-controlled code running on AWS resources"
      
    - name: "Persistence"
      abbreviation: "p"
      description: "Techniques used to maintain access to AWS environments"
      
    - name: "Privilege Escalation"
      abbreviation: "pe"
      description: "Techniques used to gain higher-level permissions in AWS"
      
    - name: "Defense Evasion"
      abbreviation: "da"
      description: "Techniques used to avoid detection in AWS environments"
      
    - name: "Credential Access"
      abbreviation: "ca"
      description: "Techniques used to steal AWS credentials"
      
    - name: "Discovery"
      abbreviation: "d"
      description: "Techniques used to gain knowledge about AWS environments"
    
    - name: "Lateral Movement"
      abbreviation: "lm"
      description: "Techniques used to enter and control remote AWS accounts and or AWS services"
      
    - name: "Collection"
      abbreviation: "c"
      description: "Techniques used to gather data from AWS resources to follow through on the adversary's objectives"
    
    # TODO mentioned in Collection, but not a real Tactic on the site
    - name: "Exfiltration"
      abbreviation: "e"
      description: "Techniques used to steal data from AWS environments"
      
    - name: "Impact"
      abbreviation: "i"
      description: "Techniques used to disrupt availability or compromise integrity"

    - name: "Resource Development"
      abbreviation: "rd"
      description: "Techniques used to develop new resources for AWS that can be used to support targeting"

  level2_classification:
    - name: "S3 Protection"
      abbreviation: "s3"
      description: "Security controls for Amazon S3 buckets and objects"
      
    - name: "IAM Security" # TODO or IAM Protection?
      abbreviation: "iam"
      description: "Identity and Access Management security controls"
      
    - name: "EC2 Security" # TODO or EC2 Protection?
      abbreviation: "ec2"
      description: "Elastic Compute Cloud security controls"
    
    - name: "Resource Access Protection" # TODO this is from us, not mentioned on TTC
      abbreviation: "ra"
      description: "Security controls for VPC firewalls"

    - name: "VPC Security"
      abbreviation: "vpc"
      description: "Virtual Private Cloud network security controls"
      
    - name: "KMS Encryption"
      abbreviation: "kms"
      description: "Key Management Service encryption controls"
      
    - name: "RDS Security"
      abbreviation: "rds"
      description: "Relational Database Service security controls"
      
    - name: "Lambda Security"
      abbreviation: "lambda"
      description: "AWS Lambda function security controls"
      
    - name: "Valid Accounts"
      abbreviation: "va"
      description: "Account access and authentication controls"
      
    - name: "API Security"
      abbreviation: "api"
      description: "API Gateway and API access controls"
      
    - name: "CloudTrail Logging"
      abbreviation: "ct"
      description: "CloudTrail audit logging controls"
      
    - name: "Config Monitoring"
      abbreviation: "cfg"
      description: "AWS Config monitoring and compliance controls"
      
    - name: "EBS Security"
      abbreviation: "ebs"
      description: "Elastic Block Store security controls"
      
    - name: "Secrets Management"
      abbreviation: "sm"
      description: "Secrets Manager and credential protection controls"

# CIRT-Recommended Config Rules
rules:
  # Initial Access - IAM Protection
  - rule_name: "crcd-cirt-ia-iam-root-account-mfa-enabled"
    rule_type: "STANDARD"
    source_identifier: "ROOT_ACCOUNT_MFA_ENABLED"
    classification:
      level1: "Initial Access"
      level1_abbrev: "ia"
      level2: "IAM Protection"
      level2_abbrev: "iam"
      mitre_attack_id: "T1078.004"
    description: "Checks if the root user of your AWS account requires multi-factor authentication for console sign-in"
    cirt_rationale: "The AWS account root user has unrestricted access to all resources within that account, its usage must be protected by Multi-Factor Authentication (MFA)."
    resource_types: []
    parameters:
      MaximumExecutionFrequency: "TwentyFour_Hours"

  - rule_name: "crcd-cirt-ia-iam-iam-root-access-key-check"
    rule_type: "STANDARD"
    source_identifier: "IAM_ROOT_ACCESS_KEY_CHECK"
    classification:
      level1: "Initial Access"
      level1_abbrev: "ia"
      level2: "IAM Protection"
      level2_abbrev: "iam"
      mitre_attack_id: "T1078"
    description: "Checks whether the root user access key exists"
    cirt_rationale: "Root access keys provide unrestricted access to all AWS resources and are high-value targets for attackers. CIRT strongly recommends against creating root access keys and deleting any that exist."
    resource_types: []
    parameters:
      MaximumExecutionFrequency: "TwentyFour_Hours"

  - rule_name: "crcd-cirt-ia-iam-iam-user-mfa-enabled"
    rule_type: "STANDARD"
    source_identifier: "IAM_USER_MFA_ENABLED"
    classification:
      level1: "Initial Access"
      level1_abbrev: "ia"
      level2: "IAM Protection"
      level2_abbrev: "iam"
      mitre_attack_id: "T1078.004"
    description: "Checks if the AWS Identity and Access Management (IAM) users have multi-factor authentication (MFA) enabled."
    cirt_rationale: "Multi-factor authentication provides an additional layer of security against compromised credentials. CIRT frequently responds to incidents where attackers gained access using stolen IAM user credentials that lacked MFA protection. Enabling MFA significantly reduces the risk of unauthorized access even when passwords are compromised."
    resource_types:
      - "AWS::IAM::User"
    parameters: {}

  - rule_name: "crcd-cirt-ia-iam-mfa-enabled-for-iam-console-access"
    rule_type: "STANDARD"
    source_identifier: "MFA_ENABLED_FOR_IAM_CONSOLE_ACCESS"
    classification:
      level1: "Initial Access"
      level1_abbrev: "ia"
      level2: "IAM Protection"
      level2_abbrev: "iam"
      mitre_attack_id: "T1078.004"
    description: "Checks if AWS multi-factor authentication (MFA) is enabled for all AWS Identity and Access Management (IAM) users that use a console password."
    cirt_rationale: "Multi-factor authentication provides an additional layer of security against compromised credentials. CIRT frequently responds to incidents where attackers gained access using stolen IAM user credentials that lacked MFA protection. Enabling MFA significantly reduces the risk of unauthorized access even when passwords are compromised."
    resource_types:
      - "AWS::IAM::User"
    parameters: {}

  # ----------------------------------------------------------------------------------------------------------------
  # Automatically generated rules 
  # Initial Access - S3 Protection
  - rule_name: "crcd-cirt-ia-s3-s3-bucket-public-read-prohibited"
    rule_type: "STANDARD"
    source_identifier: "S3_BUCKET_PUBLIC_READ_PROHIBITED"
    classification:
      level1: "Initial Access"
      level1_abbrev: "ia"
      level2: "S3 Protection"
      level2_abbrev: "s3"
      mitre_attack_id: "T1190"
    description: "Checks that S3 buckets do not allow public read access"
    cirt_rationale: "Publicly readable S3 buckets are a common attack vector for initial access and data exposure. CIRT frequently observes unauthorized access through misconfigured S3 bucket permissions."
    resource_types:
      - "AWS::S3::Bucket"
    parameters: {}

  - rule_name: "crcd-cirt-ia-s3-s3-bucket-public-write-prohibited"
    rule_type: "STANDARD"
    source_identifier: "S3_BUCKET_PUBLIC_WRITE_PROHIBITED"
    classification:
      level1: "Initial Access"
      level1_abbrev: "ia"
      level2: "S3 Protection"
      level2_abbrev: "s3"
      mitre_attack_id: "T1190"
    description: "Checks that S3 buckets do not allow public write access"
    cirt_rationale: "Publicly writable S3 buckets can be exploited for data injection, malware distribution, and resource abuse. CIRT has observed attackers using public write access for cryptocurrency mining and botnet operations."
    resource_types:
      - "AWS::S3::Bucket"
    parameters: {}

  - rule_name: "crcd-cirt-ia-s3-s3-bucket-level-public-access-prohibited"
    rule_type: "STANDARD"
    source_identifier: "S3_BUCKET_LEVEL_PUBLIC_ACCESS_PROHIBITED"
    classification:
      level1: "Initial Access"
      level1_abbrev: "ia"
      level2: "S3 Protection"
      level2_abbrev: "s3"
      mitre_attack_id: "T1190"
    description: "Checks that S3 buckets have public access blocked at the bucket level"
    cirt_rationale: "Bucket-level public access blocks provide defense-in-depth protection against accidental exposure. CIRT recommends this control to prevent configuration errors from exposing sensitive data."
    resource_types:
      - "AWS::S3::Bucket"
    parameters: {}

  # Persistence - Valid Accounts
  - rule_name: "crcd-cirt-p-va-iam-root-access-key-check"
    rule_type: "STANDARD"
    source_identifier: "IAM_ROOT_ACCESS_KEY_CHECK"
    classification:
      level1: "Persistence"
      level1_abbrev: "p"
      level2: "Valid Accounts"
      level2_abbrev: "va"
      mitre_attack_id: "T1078"
    description: "Checks whether the root user access key exists"
    cirt_rationale: "Root access keys provide unrestricted access to all AWS resources and are high-value targets for attackers. CIRT strongly recommends against creating root access keys and deleting any that exist."
    resource_types:
      - "AWS::IAM::User"
    parameters: {}

  - rule_name: "crcd-cirt-p-iam-iam-user-unused-credentials-check"
    rule_type: "STANDARD"
    source_identifier: "IAM_USER_UNUSED_CREDENTIALS_CHECK"
    classification:
      level1: "Persistence"
      level1_abbrev: "p"
      level2: "IAM Security"
      level2_abbrev: "iam"
      mitre_attack_id: "T1078"
    description: "Checks whether IAM users have unused credentials for a specified time period"
    cirt_rationale: "Unused credentials represent unnecessary attack surface and may indicate compromised or orphaned accounts. CIRT recommends regular credential rotation and removal of unused access."
    resource_types:
      - "AWS::IAM::User"
    parameters:
      maxCredentialUsageAge: "90"

  # Privilege Escalation - IAM Security
  - rule_name: "crcd-cirt-pe-iam-iam-policy-no-statements-with-admin-access"
    rule_type: "STANDARD"
    source_identifier: "IAM_POLICY_NO_STATEMENTS_WITH_ADMIN_ACCESS"
    classification:
      level1: "Privilege Escalation"
      level1_abbrev: "pe"
      level2: "IAM Security"
      level2_abbrev: "iam"
      mitre_attack_id: "T1078.004"
    description: "Checks whether IAM policies grant administrative privileges"
    cirt_rationale: "Overly permissive IAM policies enable privilege escalation and lateral movement. CIRT frequently observes attackers exploiting administrative permissions to expand their access."
    resource_types:
      - "AWS::IAM::Policy"
    parameters: {}

  - rule_name: "crcd-cirt-pe-iam-iam-user-no-policies-check"
    rule_type: "STANDARD"
    source_identifier: "IAM_USER_NO_POLICIES_CHECK"
    classification:
      level1: "Privilege Escalation"
      level1_abbrev: "pe"
      level2: "IAM Security"
      level2_abbrev: "iam"
      mitre_attack_id: "T1078.004"
    description: "Checks that IAM policies are not attached directly to users"
    cirt_rationale: "Direct policy attachment to users makes permission management difficult and increases risk of privilege escalation. CIRT recommends using groups and roles for permission management."
    resource_types:
      - "AWS::IAM::User"
    parameters: {}

  # Defense Evasion - CloudTrail Logging
  - rule_name: "crcd-cirt-da-ct-cloud-trail-enabled"
    rule_type: "STANDARD"
    source_identifier: "CLOUD_TRAIL_ENABLED"
    classification:
      level1: "Defense Evasion"
      level1_abbrev: "da"
      level2: "CloudTrail Logging"
      level2_abbrev: "ct"
      mitre_attack_id: "T1562.008"
    description: "Checks whether CloudTrail is enabled in the AWS account"
    cirt_rationale: "CloudTrail provides audit logs essential for incident detection and response. CIRT relies on CloudTrail data for security investigations and attackers often attempt to disable logging."
    resource_types:
      - "AWS::CloudTrail::Trail"
    parameters: {}

  - rule_name: "crcd-cirt-da-ct-cloud-trail-log-file-validation-enabled"
    rule_type: "STANDARD"
    source_identifier: "CLOUD_TRAIL_LOG_FILE_VALIDATION_ENABLED"
    classification:
      level1: "Defense Evasion"
      level1_abbrev: "da"
      level2: "CloudTrail Logging"
      level2_abbrev: "ct"
      mitre_attack_id: "T1562.008"
    description: "Checks whether CloudTrail log file validation is enabled"
    cirt_rationale: "Log file validation ensures CloudTrail logs have not been tampered with. CIRT uses validated logs to ensure integrity of forensic evidence during investigations."
    resource_types:
      - "AWS::CloudTrail::Trail"
    parameters: {}

  # Defense Evasion - Config Monitoring
  - rule_name: "crcd-cirt-da-cfg-config-enabled"
    rule_type: "CUSTOM"
    source_identifier: "LAMBDA_ARN_PLACEHOLDER"
    classification:
      level1: "Defense Evasion"
      level1_abbrev: "da"
      level2: "Config Monitoring"
      level2_abbrev: "cfg"
      mitre_attack_id: "T1562.008"
    description: "Checks whether AWS Config is enabled in all regions"
    cirt_rationale: "AWS Config provides continuous monitoring of resource configurations. Attackers may disable Config to evade detection. CIRT recommends enabling Config in all regions for comprehensive visibility."
    resource_types:
      - "AWS::Config::ConfigurationRecorder"
    parameters: {}

  # Credential Access - IAM Security
  - rule_name: "crcd-cirt-ca-iam-access-keys-rotated"
    rule_type: "STANDARD"
    source_identifier: "ACCESS_KEYS_ROTATED"
    classification:
      level1: "Credential Access"
      level1_abbrev: "ca"
      level2: "IAM Security"
      level2_abbrev: "iam"
      mitre_attack_id: "T1552.001"
    description: "Checks whether IAM access keys are rotated within a specified number of days"
    cirt_rationale: "Regular access key rotation limits the window of opportunity for compromised credentials. CIRT frequently responds to incidents involving long-lived, compromised access keys."
    resource_types:
      - "AWS::IAM::User"
    parameters:
      maxAccessKeyAge: "90"

  - rule_name: "crcd-cirt-ca-sm-secretsmanager-rotation-enabled-check"
    rule_type: "STANDARD"
    source_identifier: "SECRETSMANAGER_ROTATION_ENABLED_CHECK"
    classification:
      level1: "Credential Access"
      level1_abbrev: "ca"
      level2: "Secrets Management"
      level2_abbrev: "sm"
      mitre_attack_id: "T1552"
    description: "Checks whether secrets stored in Secrets Manager have rotation enabled"
    cirt_rationale: "Automatic secret rotation reduces the risk of credential compromise. CIRT recommends rotation for all secrets, especially database credentials and API keys."
    resource_types:
      - "AWS::SecretsManager::Secret"
    parameters: {}

  # Exfiltration - S3 Protection
  - rule_name: "crcd-cirt-e-s3-s3-bucket-logging-enabled"
    rule_type: "STANDARD"
    source_identifier: "S3_BUCKET_LOGGING_ENABLED"
    classification:
      level1: "Exfiltration"
      level1_abbrev: "e"
      level2: "S3 Protection"
      level2_abbrev: "s3"
      mitre_attack_id: "T1537"
    description: "Checks whether S3 bucket logging is enabled"
    cirt_rationale: "S3 access logs are critical for detecting data exfiltration attempts. CIRT uses S3 logs to identify unauthorized data access and transfer during security investigations."
    resource_types:
      - "AWS::S3::Bucket"
    parameters: {}

  - rule_name: "crcd-cirt-e-s3-s3-bucket-versioning-enabled"
    rule_type: "STANDARD"
    source_identifier: "S3_BUCKET_VERSIONING_ENABLED"
    classification:
      level1: "Exfiltration"
      level1_abbrev: "e"
      level2: "S3 Protection"
      level2_abbrev: "s3"
      mitre_attack_id: "T1537"
    description: "Checks whether S3 bucket versioning is enabled"
    cirt_rationale: "Versioning protects against data deletion and modification during exfiltration attempts. CIRT recommends versioning to enable recovery from ransomware and data destruction attacks."
    resource_types:
      - "AWS::S3::Bucket"
    parameters: {}

  # Impact - EBS Security
  - rule_name: "crcd-cirt-i-ebs-ec2-ebs-encryption-by-default"
    rule_type: "STANDARD"
    source_identifier: "EC2_EBS_ENCRYPTION_BY_DEFAULT"
    classification:
      level1: "Impact"
      level1_abbrev: "i"
      level2: "EBS Security"
      level2_abbrev: "ebs"
      mitre_attack_id: "T1486"
    description: "Checks whether EBS encryption is enabled by default"
    cirt_rationale: "EBS encryption protects data at rest from unauthorized access. CIRT recommends encryption by default to ensure all volumes are protected, especially during ransomware incidents."
    resource_types:
      - "AWS::EC2::Volume"
    parameters: {}

  - rule_name: "crcd-cirt-i-rds-rds-storage-encrypted"
    rule_type: "STANDARD"
    source_identifier: "RDS_STORAGE_ENCRYPTED"
    classification:
      level1: "Impact"
      level1_abbrev: "i"
      level2: "RDS Security"
      level2_abbrev: "rds"
      mitre_attack_id: "T1486"
    description: "Checks whether RDS instances have storage encryption enabled"
    cirt_rationale: "Database encryption protects sensitive data from unauthorized access and is critical during data breach incidents. CIRT strongly recommends encryption for all RDS instances."
    resource_types:
      - "AWS::RDS::DBInstance"
    parameters: {}

  # Execution - Lambda Security
  - rule_name: "crcd-cirt-ex-lambda-lambda-function-public-access-prohibited"
    rule_type: "STANDARD"
    source_identifier: "LAMBDA_FUNCTION_PUBLIC_ACCESS_PROHIBITED"
    classification:
      level1: "Execution"
      level1_abbrev: "ex"
      level2: "Lambda Security"
      level2_abbrev: "lambda"
      mitre_attack_id: "T1204"
    description: "Checks whether Lambda functions have public access"
    cirt_rationale: "Publicly accessible Lambda functions can be exploited for code execution and resource abuse. CIRT has observed attackers invoking public Lambda functions for cryptocurrency mining and data exfiltration."
    resource_types:
      - "AWS::Lambda::Function"
    parameters: {}

  # Discovery - VPC Security
  - rule_name: "crcd-cirt-d-vpc-vpc-flow-logs-enabled"
    rule_type: "STANDARD"
    source_identifier: "VPC_FLOW_LOGS_ENABLED"
    classification:
      level1: "Discovery"
      level1_abbrev: "d"
      level2: "VPC Security"
      level2_abbrev: "vpc"
      mitre_attack_id: "T1046"
    description: "Checks whether VPC Flow Logs are enabled"
    cirt_rationale: "VPC Flow Logs provide network traffic visibility essential for detecting reconnaissance and lateral movement. CIRT uses flow logs to identify scanning activity and unauthorized network connections."
    resource_types:
      - "AWS::EC2::VPC"
    parameters: {}

  # Lateral Movement - EC2 Security
  - rule_name: "crcd-cirt-lm-ec2-ec2-security-group-attached-to-eni"
    rule_type: "STANDARD"
    source_identifier: "EC2_SECURITY_GROUP_ATTACHED_TO_ENI"
    classification:
      level1: "Lateral Movement"
      level1_abbrev: "lm"
      level2: "EC2 Security"
      level2_abbrev: "ec2"
      mitre_attack_id: "T1021"
    description: "Checks whether security groups are attached to elastic network interfaces"
    cirt_rationale: "Unattached security groups may indicate misconfiguration or attempts to bypass network controls. CIRT recommends ensuring all network interfaces have appropriate security group protection."
    resource_types:
      - "AWS::EC2::NetworkInterface"
    parameters: {}

  - rule_name: "crcd-cirt-lm-vpc-vpc-sg-open-only-to-authorized-ports"
    rule_type: "STANDARD"
    source_identifier: "VPC_SG_OPEN_ONLY_TO_AUTHORIZED_PORTS"
    classification:
      level1: "Lateral Movement"
      level1_abbrev: "lm"
      level2: "VPC Security"
      level2_abbrev: "vpc"
      mitre_attack_id: "T1021"
    description: "Checks whether security groups allow access only to authorized ports"
    cirt_rationale: "Overly permissive security groups enable lateral movement within AWS environments. CIRT frequently observes attackers exploiting open ports to move between resources."
    resource_types:
      - "AWS::EC2::SecurityGroup"
    parameters:
      authorizedTcpPorts: "80,443"

  # Initial Access - EC2 Security
  - rule_name: "crcd-cirt-ia-ec2-autoscaling-launchconfig-requires-imdsv2"
    rule_type: "STANDARD"
    source_identifier: "AUTOSCALING_LAUNCHCONFIG_REQUIRES_IMDSV2"
    classification:
      level1: "Initial Access"
      level1_abbrev: "ia"
      level2: "EC2 Security"
      level2_abbrev: "ec2"
      mitre_attack_id: "T1552.005"
    description: "Checks whether Amazon EC2 Auto Scaling groups have launch configurations that require Instance Metadata Service Version 2 (IMDSv2)"
    cirt_rationale: "IMDSv2 provides enhanced security for instance metadata by requiring session-oriented requests, which prevents Server-Side Request Forgery (SSRF) attacks. CIRT has observed attackers exploiting IMDSv1 to steal IAM credentials from EC2 instances. Requiring IMDSv2 significantly reduces the risk of credential theft through metadata service exploitation."
    resource_types:
      - "AWS::AutoScaling::LaunchConfiguration"
    parameters: {}

  - rule_name: "crcd-cirt-ia-ec2-ec2-imdsv2-check"
    rule_type: "STANDARD"
    source_identifier: "EC2_IMDSV2_CHECK"
    classification:
      level1: "Initial Access"
      level1_abbrev: "ia"
      level2: "EC2 Security"
      level2_abbrev: "ec2"
      mitre_attack_id: "T1552.005"
    description: "Checks whether EC2 instances are configured to require Instance Metadata Service Version 2 (IMDSv2)"
    cirt_rationale: "IMDSv2 protects against SSRF attacks that attempt to access instance metadata and steal IAM credentials. CIRT frequently investigates incidents where attackers exploited IMDSv1 vulnerabilities to gain unauthorized access to temporary credentials. Enforcing IMDSv2 on all EC2 instances is a critical security control to prevent credential theft."
    resource_types:
      - "AWS::EC2::Instance"
    parameters: {}

  - rule_name: "crcd-cirt-ia-ec2-ec2-launch-template-imdsv2-check"
    rule_type: "STANDARD"
    source_identifier: "EC2_LAUNCH_TEMPLATE_IMDSV2_CHECK"
    classification:
      level1: "Initial Access"
      level1_abbrev: "ia"
      level2: "EC2 Security"
      level2_abbrev: "ec2"
      mitre_attack_id: "T1552.005"
    description: "Checks whether EC2 launch templates are configured to require Instance Metadata Service Version 2 (IMDSv2)"
    cirt_rationale: "Launch templates define the configuration for EC2 instances, and requiring IMDSv2 in templates ensures all instances launched from them are protected against metadata service exploitation. CIRT recommends enforcing IMDSv2 at the template level to prevent misconfigurations and ensure consistent security posture across all instances launched from the template."
    resource_types:
      - "AWS::EC2::LaunchTemplate"
    parameters: {}

  # Initial Access - S3 Protection
  - rule_name: "crcd-cirt-ia-s3-s3-access-point-in-vpc-only"
    rule_type: "STANDARD"
    source_identifier: "S3_ACCESS_POINT_IN_VPC_ONLY"
    classification:
      level1: "Initial Access"
      level1_abbrev: "ia"
      level2: "S3 Protection"
      level2_abbrev: "s3"
      mitre_attack_id: "T1190"
    description: "Checks whether Amazon S3 access points are configured to only allow access from within a VPC"
    cirt_rationale: "S3 access points that allow public internet access increase the attack surface for data exfiltration and unauthorized access. CIRT recommends restricting S3 access points to VPC-only access to ensure data can only be accessed through controlled network paths. This prevents direct internet-based attacks and provides an additional layer of network-level security for sensitive data stored in S3."
    resource_types:
      - "AWS::S3::AccessPoint"
    parameters: {}

  - rule_name: "crcd-cirt-ia-s3-s3-access-point-public-access-blocks"
    rule_type: "STANDARD"
    source_identifier: "S3_ACCESS_POINT_PUBLIC_ACCESS_BLOCKS"
    classification:
      level1: "Initial Access"
      level1_abbrev: "ia"
      level2: "S3 Protection"
      level2_abbrev: "s3"
      mitre_attack_id: "T1190"
    description: "Checks whether Amazon S3 access points have public access block settings enabled"
    cirt_rationale: "Public access block settings on S3 access points provide defense-in-depth protection against accidental public exposure of data. CIRT recommends enabling all public access block settings on S3 access points to prevent misconfigurations that could lead to data breaches. These settings work in conjunction with bucket policies and access point policies to ensure comprehensive protection against unauthorized public access."
    resource_types:
      - "AWS::S3::AccessPoint"
    parameters: {}

  - rule_name: "crcd-cirt-ia-s3-s3-account-level-public-access-blocks"
    rule_type: "STANDARD"
    source_identifier: "S3_ACCOUNT_LEVEL_PUBLIC_ACCESS_BLOCKS"
    classification:
      level1: "Initial Access"
      level1_abbrev: "ia"
      level2: "S3 Protection"
      level2_abbrev: "s3"
      mitre_attack_id: "T1190"
    description: "Checks whether Amazon S3 account-level public access block settings are enabled"
    cirt_rationale: "Account-level public access block settings provide the highest level of protection against accidental public exposure of S3 data across all buckets in an AWS account. CIRT strongly recommends enabling these settings to prevent any bucket from being made public, regardless of individual bucket policies. This control is critical for organizations handling sensitive data and provides a safety net against misconfigurations at the bucket level."
    resource_types: []
    parameters: {}

  - rule_name: "crcd-cirt-ia-s3-s3-account-level-public-access-blocks-periodic"
    rule_type: "STANDARD"
    source_identifier: "S3_ACCOUNT_LEVEL_PUBLIC_ACCESS_BLOCKS_PERIODIC"
    classification:
      level1: "Initial Access"
      level1_abbrev: "ia"
      level2: "S3 Protection"
      level2_abbrev: "s3"
      mitre_attack_id: "T1190"
    description: "Periodically checks whether Amazon S3 account-level public access block settings remain enabled"
    cirt_rationale: "Continuous monitoring of account-level public access block settings ensures they remain enabled and have not been inadvertently disabled. CIRT recommends periodic evaluation to detect and alert on any changes to these critical security controls. This periodic check complements change-triggered evaluations and provides assurance that account-level protections are consistently maintained."
    resource_types: []
    parameters:
      MaximumExecutionFrequency: "TwentyFour_Hours"

  - rule_name: "crcd-cirt-ia-s3-s3-bucket-level-public-access-prohibited"
    rule_type: "STANDARD"
    source_identifier: "S3_BUCKET_LEVEL_PUBLIC_ACCESS_PROHIBITED"
    classification:
      level1: "Initial Access"
      level1_abbrev: "ia"
      level2: "S3 Protection"
      level2_abbrev: "s3"
      mitre_attack_id: "T1190"
    description: "Checks if S3 buckets are publicly accessible"
    cirt_rationale: "Bucket-level public access blocks provide defense-in-depth protection against accidental exposure. CIRT recommends this control to prevent configuration errors from exposing sensitive data. This rule checks individual bucket settings and complements account-level public access blocks, ensuring comprehensive protection against unauthorized public access to S3 data."
    resource_types:
      - "AWS::S3::Bucket"
    parameters:
      # Comma-separated list of known allowed public Amazon S3 bucket names.
      excludedPublicBuckets: ""

  - rule_name: "crcd-cirt-ia-ra-vpc-sg-port-restriction-check"
    rule_type: "STANDARD"
    source_identifier: "VPC_SG_PORT_RESTRICTION_CHECK"
    classification:
      level1: "Initial Access"
      level1_abbrev: "ia"
      level2: "Resource Access Protection"
      level2_abbrev: "ra"
      mitre_attack_id: "XXXXX.005"
    description: "Checks whether security groups allow unrestricted inbound ports"
    cirt_rationale: "Unrestricted inbound ports enable lateral movement within AWS environments. CIRT frequently observes attackers exploiting open ports to move between resources."
    resource_types:
      - "AWS::EC2::SecurityGroup"
    parameters:
      # Comma-separated list of ports that should not be open for incoming traffic over the full IP range. Valid port numbers range from 0 to 65535. If not specified, the rule defaults to check for 22 and 3389.
      # TODO add ports?
      restrictPorts: "22,3389"


# Naming Convention Documentation
naming_convention:
  format: "crcd-cirt-<lv1>-<lv2>-<rule-name>"
  components:
    - name: "crcd-cirt"
      description: "Fixed prefix identifying CRCD CIRT conformance pack rules"
    - name: "lv1"
      description: "Level 1 classification abbreviation (e.g., ia, p, pe)"
    - name: "lv2"
      description: "Level 2 classification abbreviation (e.g., s3, iam, vpc)"
    - name: "rule-name"
      description: "Descriptive rule name in kebab-case"
  examples:
    - "crcd-cirt-ia-s3-s3-bucket-public-read-prohibited"
    - "crcd-cirt-p-va-iam-root-access-key-check"
    - "crcd-cirt-pe-iam-iam-policy-no-statements-with-admin-access"

# Tag Structure Documentation
tag_structure:
  tags:
    - key: "crcd-cirt-lv1"
      description: "Level 1 classification abbreviation"
      values: ["ia", "ex", "p", "pe", "da", "ca", "d", "lm", "c", "e", "i"]
      purpose: "Enable filtering and querying rules by Level 1 category"
      
    - key: "crcd-cirt-lv2"
      description: "Level 2 classification abbreviation"
      values: ["s3", "iam", "ec2", "vpc", "kms", "rds", "lambda", "va", "api", "ct", "cfg", "ebs", "sm"]
      purpose: "Enable filtering and querying rules by Level 2 technique"
  
  usage_examples:
    - description: "Query all Initial Access rules"
      filter: "crcd-cirt-lv1=ia"
    - description: "Query all S3 protection rules"
      filter: "crcd-cirt-lv2=s3"
    - description: "Query Initial Access rules for S3"
      filter: "crcd-cirt-lv1=ia AND crcd-cirt-lv2=s3"
