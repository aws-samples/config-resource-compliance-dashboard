AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Prerequisites for the Operational Best Practices for AWS Security Incident Response
  conformance pack (extended version). Deploys Lambda functions and IAM roles required
  by the custom Config rules. Deploy this template first, then use the output Lambda
  ARNs as parameters in the extended conformance pack template.

Parameters:
  RootUsageThresholdDays:
    Type: String
    Default: '5'
    Description: "Number of days to look back for root account usage. If root was used within this threshold, the account is marked NON_COMPLIANT."
    AllowedPattern: ^[1-9][0-9]{0,2}$
    ConstraintDescription: "Must be a number between 1 and 999."

Resources:

  # ============================================================================
  # Custom Rule: Root Account Not Used Regularly
  # ============================================================================

  RootNotUsedRegularlyLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: 'CRCDConfPackRuleRootNotUsedRegularly'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ConfigRuleEvaluationPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - config:PutEvaluations
                Resource: '*'
        - PolicyName: RootAccountCheckPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - iam:GetAccountSummary
                  - iam:GetCredentialReport
                  - iam:GenerateCredentialReport
                  - cloudtrail:LookupEvents
                Resource: '*'

  RootNotUsedRegularlyLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: '/aws/lambda/crcd-root-not-used-regularly'
      RetentionInDays: 30

  RootNotUsedRegularlyLambda:
    Type: AWS::Lambda::Function
    DependsOn: RootNotUsedRegularlyLogGroup
    Properties:
      FunctionName: 'crcd-root-not-used-regularly'
      Description: "CRCD custom Config rule - Checks whether the root user is not used regularly"
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt RootNotUsedRegularlyLambdaRole.Arn
      Timeout: 420
      Architectures:
        - x86_64
      Environment:
        Variables:
          LOG_LEVEL: INFO
      Code:
        ZipFile: |
          """
          CRCD Custom Config Rule: Root Account Not Used Regularly

          Checks whether the root user is not used regularly by examining the
          IAM Credential Report for root user activity.
          """
          import json
          import logging
          import os
          import time
          import csv
          from io import StringIO
          from datetime import datetime, timedelta
          import boto3
          from botocore.exceptions import ClientError

          logger = logging.getLogger()
          log_level = os.environ.get('LOG_LEVEL', 'INFO')
          logger.setLevel(getattr(logging, log_level))

          ASSUME_ROLE_MODE = False

          def lambda_handler(event, context):
              global AWS_CONFIG_CLIENT
              logger.info(f"Received event: {json.dumps(event)}")
              annotation = 'Unable to determine root account usage'
              compliance_type = 'INSUFFICIENT_DATA'
              resource_type = 'AWS::::Account'
              account_id = event.get('accountId', '')

              try:
                  if 'configRuleId' not in event:
                      raise ValueError("Missing required field: configRuleId")

                  invoking_event = json.loads(event['invokingEvent'])
                  AWS_CONFIG_CLIENT = get_client('config', event)

                  if invoking_event['messageType'] != 'ScheduledNotification':
                      raise ValueError("Invalid message type: " + str(invoking_event['messageType']))

                  rule_parameters = {}
                  if 'ruleParameters' in event and event['ruleParameters']:
                      rule_parameters = json.loads(event['ruleParameters'])

                  root_usage_threshold_days = int(rule_parameters.get('RootUsageThresholdDays', '5'))

                  if not account_id:
                      account_id = invoking_event.get('awsAccountId', context.invoked_function_arn.split(':')[4])

                  compliance_type, last_used_date = evaluate_root_usage(root_usage_threshold_days)
                  annotation = get_annotation(compliance_type, last_used_date, root_usage_threshold_days)
                  logger.info(f"Compliance: {compliance_type} - {annotation}")

              except ClientError as e:
                  logger.error(f"AWS API error: {e}", exc_info=True)
                  compliance_type = 'INSUFFICIENT_DATA'
              except ValueError as e:
                  logger.error(f"Invalid event: {e}", exc_info=True)
                  compliance_type = 'NOT_APPLICABLE'
                  annotation = str(e)
              except Exception as e:
                  logger.error(f"Unexpected error: {e}", exc_info=True)
                  compliance_type = 'INSUFFICIENT_DATA'

              AWS_CONFIG_CLIENT.put_evaluations(
                  Evaluations=[{
                      'ComplianceResourceType': resource_type,
                      'ComplianceResourceId': account_id,
                      'ComplianceType': compliance_type,
                      'Annotation': annotation,
                      'OrderingTimestamp': invoking_event['notificationCreationTime']
                  }],
                  ResultToken=event['resultToken'])

          def evaluate_root_usage(root_usage_threshold_days):
              iam_client = boto3.client('iam')
              report_status = iam_client.generate_credential_report()

              max_wait_time = 360
              start_time = time.time()
              wait_interval = 1
              while report_status['State'] != 'COMPLETE':
                  if time.time() - start_time > max_wait_time:
                      break
                  time.sleep(wait_interval)
                  report_status = iam_client.generate_credential_report()
                  wait_interval = min(wait_interval * 1.5, 10)

              if report_status['State'] != 'COMPLETE':
                  return 'INSUFFICIENT_DATA', None

              response = iam_client.get_credential_report()
              report_content = response['Content'].decode('utf-8')
              csv_reader = csv.DictReader(StringIO(report_content))

              root_entry = None
              for row in csv_reader:
                  if row.get('user') == '<root_account>':
                      root_entry = row
                      break

              if not root_entry:
                  return 'INSUFFICIENT_DATA', None

              threshold_date = datetime.now() - timedelta(days=root_usage_threshold_days)
              last_used_date = None

              for field in ['password_last_used', 'access_key_1_last_used_date', 'access_key_2_last_used_date']:
                  value = root_entry.get(field)
                  if value and value not in ('N/A', 'no_information'):
                      try:
                          dt = datetime.strptime(value, '%Y-%m-%dT%H:%M:%S+00:00')
                          if last_used_date is None or dt > last_used_date:
                              last_used_date = dt
                      except ValueError:
                          pass

              if last_used_date is None:
                  return 'COMPLIANT', None
              elif last_used_date < threshold_date:
                  return 'COMPLIANT', last_used_date
              else:
                  return 'NON_COMPLIANT', last_used_date

          def get_annotation(compliance_type, last_used_date, threshold_days):
              if compliance_type == 'COMPLIANT':
                  if last_used_date:
                      return f'Root account last used on {last_used_date.strftime("%Y-%m-%d")}, more than {threshold_days} days ago'
                  return 'Root account has not been used (no usage recorded)'
              elif compliance_type == 'NON_COMPLIANT':
                  if last_used_date:
                      days_ago = (datetime.now() - last_used_date).days
                      return f'Root account was used {days_ago} days ago on {last_used_date.strftime("%Y-%m-%d")}, within the {threshold_days}-day threshold'
                  return f'Root account has been used within the last {threshold_days} days'
              return 'Unable to determine root account usage'

          def get_client(service, event):
              if not ASSUME_ROLE_MODE:
                  return boto3.client(service)
              credentials = get_assume_role_credentials(event["executionRoleArn"])
              return boto3.client(service, aws_access_key_id=credentials['AccessKeyId'],
                                  aws_secret_access_key=credentials['SecretAccessKey'],
                                  aws_session_token=credentials['SessionToken'])

          def get_assume_role_credentials(role_arn):
              sts_client = boto3.client('sts')
              assume_role_response = sts_client.assume_role(RoleArn=role_arn, RoleSessionName="configLambdaExecution")
              return assume_role_response['Credentials']

  RootNotUsedRegularlyLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref RootNotUsedRegularlyLambda
      Action: lambda:InvokeFunction
      Principal: config.amazonaws.com
      SourceAccount: !Ref AWS::AccountId

  # ============================================================================
  # Custom Rule: IAM User Access Key Check
  # ============================================================================

  UserAccessKeyCheckLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: 'CRCDConfPackRuleUserAccessKeyCheck'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: ConfigRuleEvaluationPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - config:PutEvaluations
                Resource: '*'
        - PolicyName: IAMUserAccessKeyCheckPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - iam:ListUsers
                  - iam:GetUser
                  - iam:ListAccessKeys
                  - iam:GetAccessKeyLastUsed
                Resource: '*'

  UserAccessKeyCheckLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: '/aws/lambda/crcd-user-access-key-check'
      RetentionInDays: 30

  UserAccessKeyCheckLambda:
    Type: AWS::Lambda::Function
    DependsOn: UserAccessKeyCheckLogGroup
    Properties:
      FunctionName: 'crcd-user-access-key-check'
      Description: "CRCD custom Config rule - Checks whether IAM users have active access keys"
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt UserAccessKeyCheckLambdaRole.Arn
      Timeout: 60
      Architectures:
        - x86_64
      Environment:
        Variables:
          LOG_LEVEL: INFO
      Code:
        ZipFile: |
          """
          CRCD Custom Config Rule: IAM User Access Key Check

          Checks whether IAM users have active access keys. It is strongly
          recommended to not create access keys as they provide unrestricted
          access to AWS resources and are high-value targets for attackers.
          """
          import json
          import logging
          import os
          from datetime import datetime
          import boto3
          from botocore.exceptions import ClientError

          logger = logging.getLogger()
          log_level = os.environ.get('LOG_LEVEL', 'INFO')
          logger.setLevel(getattr(logging, log_level))

          ASSUME_ROLE_MODE = False

          def lambda_handler(event, context):
              global AWS_CONFIG_CLIENT
              logger.info(f"Received event: {json.dumps(event)}")

              try:
                  invoking_event = json.loads(event['invokingEvent'])
                  AWS_CONFIG_CLIENT = get_client('config', event)

                  if invoking_event['messageType'] == 'ScheduledNotification':
                      evaluate_periodic_compliance(event)
                  else:
                      raise ValueError(f"Invalid message type: {invoking_event['messageType']}")

              except Exception as e:
                  logger.error(f"Error: {e}", exc_info=True)

          def evaluate_periodic_compliance(event):
              iam_client = get_client('iam', event)
              evaluations = []

              try:
                  paginator = iam_client.get_paginator('list_users')
                  for page in paginator.paginate():
                      for user in page['Users']:
                          user_name = user['UserName']
                          user_id = user['UserId']
                          compliance_type, annotation = evaluate_user_compliance(user_name, iam_client)
                          evaluations.append({
                              'ComplianceResourceType': 'AWS::IAM::User',
                              'ComplianceResourceId': user_id,
                              'ComplianceType': compliance_type,
                              'Annotation': annotation,
                              'OrderingTimestamp': datetime.utcnow()
                          })
              except Exception as e:
                  logger.error(f'Error during periodic evaluation: {str(e)}')

              if evaluations:
                  AWS_CONFIG_CLIENT.put_evaluations(
                      Evaluations=evaluations,
                      ResultToken=event['resultToken']
                  )

          def evaluate_user_compliance(user_name, iam_client):
              try:
                  response = iam_client.list_access_keys(UserName=user_name)
                  access_keys = response.get('AccessKeyMetadata', [])
                  active_keys = [key for key in access_keys if key['Status'] == 'Active']

                  if active_keys:
                      key_ids = [key.get('AccessKeyId') for key in active_keys]
                      return 'NON_COMPLIANT', f'IAM user {user_name} has {len(active_keys)} active access key(s): {", ".join(key_ids)}'
                  else:
                      return 'COMPLIANT', f'IAM user {user_name} has no active access keys'

              except Exception as exc:
                  logger.error(f"Error evaluating IAM user {user_name}: {exc}")
                  return 'INSUFFICIENT_DATA', f"Error evaluating IAM user {user_name}: {exc}"

          def get_client(service, event):
              if not ASSUME_ROLE_MODE:
                  return boto3.client(service)
              credentials = get_assume_role_credentials(event["executionRoleArn"])
              return boto3.client(service, aws_access_key_id=credentials['AccessKeyId'],
                                  aws_secret_access_key=credentials['SecretAccessKey'],
                                  aws_session_token=credentials['SessionToken'])

          def get_assume_role_credentials(role_arn):
              sts_client = boto3.client('sts')
              assume_role_response = sts_client.assume_role(RoleArn=role_arn, RoleSessionName="configLambdaExecution")
              return assume_role_response['Credentials']

  UserAccessKeyCheckLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UserAccessKeyCheckLambda
      Action: lambda:InvokeFunction
      Principal: config.amazonaws.com
      SourceAccount: !Ref AWS::AccountId

Outputs:
  RootNotUsedRegularlyLambdaArn:
    Description: "ARN of the Root Not Used Regularly Lambda function. Use this as the RootNotUsedRegularlyLambdaArn parameter in the extended conformance pack."
    Value: !GetAtt RootNotUsedRegularlyLambda.Arn

  UserAccessKeyCheckLambdaArn:
    Description: "ARN of the User Access Key Check Lambda function. Use this as the UserAccessKeyCheckLambdaArn parameter in the extended conformance pack."
    Value: !GetAtt UserAccessKeyCheckLambda.Arn
