AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Prerequisites for the Threat-Informed Security Best Practices (Fundamental) Extended
  conformance pack. Deploys Lambda functions and IAM roles required
  by the custom Config rules. Deploy this template first, then use the output Lambda
  ARNs as parameters in the extended conformance pack template.

Resources:

  # ============================================================================
  # Custom Rule: Root Account Not Used Regularly
  # ============================================================================

  RootNotUsedRegularlyLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: 'SIREConfPackRuleRootNotUsedRegularly'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: ConfigRuleEvaluationPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - config:PutEvaluations
                Resource: '*'
        - PolicyName: RootAccountCheckPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - iam:GetAccountSummary
                  - iam:GetCredentialReport
                  - iam:GenerateCredentialReport
                  - cloudtrail:LookupEvents
                Resource: '*'

  RootNotUsedRegularlyLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: '/aws/lambda/sire-root-not-used-regularly'
      RetentionInDays: 30

  RootNotUsedRegularlyLambda:
    Type: AWS::Lambda::Function
    DependsOn: RootNotUsedRegularlyLogGroup
    Properties:
      FunctionName: 'sire-root-not-used-regularly'
      Description: "Threat-Informed Security Best Practices (Fundamental) Conformance Pack custom AWS Config rule - Root account not used regularly"
      Runtime: python3.14
      Handler: index.lambda_handler
      Role: !GetAtt RootNotUsedRegularlyLambdaRole.Arn
      Timeout: 420
      Architectures:
        - x86_64
      Environment:
        Variables:
          LOG_LEVEL: INFO
      Code:
        ZipFile: |
          """
          Threat-Informed Security Best Practices (Fundamental)
          Custom Config Rule: Root Account Not Used Regularly

          Checks whether the root user is not used regularly by examining the IAM Credential Report
          for root user activity.

          CONFIGURATION:
          --------------
          This Lambda function receives data from AWS Config rule parameters.

          Rule Parameter:
            - RootUsageThresholdDays (integer, default: 5)
              Number of days to look back for root account usage. If root was used within this
              threshold, the account is marked NON_COMPLIANT.

          The parameter is passed to the Lambda function via the 'ruleParameters' field in the
          AWS Config evaluation event as a JSON string: {"RootUsageThresholdDays": "5"}

          BEHAVIOR:
          ---------
          This implementation checks if the root user was used at least once in the last
          RootUsageThresholdDays days. The rule is COMPLIANT if root was last used more than
          RootUsageThresholdDays ago (or never used).

          LIMITATION:
          -----------
          If the root user is used once, the rule will remain NON_COMPLIANT until
          RootUsageThresholdDays days have passed since that usage.

          DISCARDED ALTERNATIVE APPROACH:
          ---------------------
          A more sophisticated implementation could count how many times root was used in the
          last RootUsageThresholdDays, and flag as NON_COMPLIANT only if used more than X times.
          However, this would require querying CloudTrail records, which introduces additional cost.
          """

          import json
          import logging
          import os
          from datetime import datetime, timedelta, timezone
          import boto3
          from botocore.exceptions import ClientError

          # Configure logging for CloudWatch Logs
          logger = logging.getLogger()
          log_level = os.environ.get('LOG_LEVEL', 'INFO')
          logger.setLevel(getattr(logging, log_level))

          # Set to True to get the lambda to assume the Role attached on the Config Service (useful for cross-account).
          # This check does not need cross-account access
          ASSUME_ROLE_MODE = False

          # Maximum length of an evaluation annotation
          MAX_ANNOTATION_LENGTH = 256

          # NOTE: The RootUsageThresholdDays threshold is NOT configured via environment variable.
          # It is passed as a rule parameter from AWS Config via the 'ruleParameters' field in the evaluation event.

          def lambda_handler(event, context):
              """
              AWS Config custom rule evaluation handler for root account usage check.

              This function evaluates whether the root user has been used within the
              configured threshold period by checking the IAM Credential Report.

              Args:
                  event: AWS Config evaluation event containing:
                      - configRuleId: The Config rule identifier (required)
                      - configRuleName: The Config rule name
                      - accountId: AWS account ID
                      - evaluationMode: DETECTIVE or PROACTIVE
                      - ruleParameters: JSON string containing rule parameters (optional)
                          Example: '{"RootUsageThresholdDays": "5"}'

                  context: Lambda context object

              Rule Parameters (from AWS Config):
                  RootUsageThresholdDays (integer, default: 5):
                      Number of days to look back for root account usage.
                      Configured in the conformance pack template's InputParameters.

              Sends one evaluation (COMPLIANT or NON_COMPLIANT) for the account to AWS Config.

              Error handling:
                  AWS Config does not accept INSUFFICIENT_DATA from PutEvaluations, and NOT_APPLICABLE
                  would hide a real finding. On errors no evaluation is sent, so Config keeps its
                  previous result, and the function raises so the failure is visible in the rule's
                  evaluation status.
              """
              # Event payloads may contain identifiers; log at DEBUG only
              logger.debug(f"Received event: {json.dumps(event)}")

              try:
                  # Validate event structure
                  for field in ('configRuleId', 'invokingEvent', 'resultToken'):
                      if field not in event:
                          raise ValueError(f"Missing required field: {field}")

                  invoking_event = json.loads(event['invokingEvent'])
                  logger.debug('CRCD-ConfPack: Received invoking event: ' + json.dumps(invoking_event))

                  # This rule supports only periodic evaluation
                  if invoking_event['messageType'] != 'ScheduledNotification':
                      raise ValueError("This rule accepts only periodic evaluation. Invalid message type: " + str(invoking_event['messageType']))

                  account_id = event.get('accountId')

                  # Extract rule parameters
                  rule_parameters = {}
                  if 'ruleParameters' in event and event['ruleParameters']:
                      rule_parameters = json.loads(event['ruleParameters'])

                  # Get threshold from rule parameters with default fallback
                  # the default value of RootUsageThresholdDays is hardcoded because users must make a
                  # cloud formation update so that the new value goes in all lambda functions in all accounts
                  root_usage_threshold_days = int(rule_parameters.get('RootUsageThresholdDays', '5'))

                  # Fallback to extracting account ID from invoking event or context if not in event
                  if not account_id:
                      account_id = invoking_event.get('awsAccountId')
                  if not account_id:
                      account_id = context.invoked_function_arn.split(':')[4]

                  logger.info(f"Evaluating root account usage for account: {account_id}")
                  logger.info(f"Threshold: {root_usage_threshold_days} days")

                  # Evaluate compliance, raises if the usage cannot be determined
                  compliance_type, last_used_date = evaluate_root_usage(account_id, root_usage_threshold_days)

                  annotation = get_annotation(compliance_type, last_used_date, root_usage_threshold_days)

                  logger.info(
                      f"Compliance decision for account {account_id}: "
                      f"{compliance_type} - {annotation}"
                  )

                  # For periodic rules, there's no specific configuration item
                  # We evaluate at the account level
                  response = get_client('config', event).put_evaluations(
                      Evaluations=[
                          {
                              'ComplianceResourceType': 'AWS::::Account',
                              'ComplianceResourceId': account_id,
                              'ComplianceType': compliance_type,
                              'Annotation': annotation[:MAX_ANNOTATION_LENGTH],
                              'OrderingTimestamp': invoking_event.get('notificationCreationTime', datetime.now(timezone.utc))
                          },
                      ],
                      ResultToken=event['resultToken'])
                  if response.get('FailedEvaluations'):
                      raise RuntimeError(f"Config rejected the evaluation for account {account_id}")

              except ClientError as e:
                  error_code = e.response['Error']['Code']
                  error_msg = e.response['Error']['Message']
                  logger.error(
                      f"AWS API error evaluating root account usage: {error_code} - {error_msg}",
                      exc_info=True
                  )
                  raise

              except Exception as e:
                  logger.error(f"Error evaluating root account usage: {e}", exc_info=True)
                  raise


          def evaluate_root_usage(account_id, root_usage_threshold_days):
              """
              Evaluate whether root account is used regularly by checking IAM credential report.

              This function retrieves the IAM credential report and checks when the root
              user last used password or access keys.

              Args:
                  account_id (str): AWS account ID
                  root_usage_threshold_days (int): Number of days to look back for root usage.
                      This value comes from AWS Config rule parameters (RootUsageThresholdDays).
                      If root was used within this threshold, returns NON_COMPLIANT.

              Returns:
                  tuple: (compliance_status, last_used_date) where:
                      - compliance_status (str): COMPLIANT or NON_COMPLIANT
                      - last_used_date (datetime): datetime of last root usage, or None if never used
              """
              try:
                  # Create IAM client (only boto3/botocore, no external dependencies)
                  iam_client = boto3.client('iam')

                  logger.info("Generating IAM credential report")

                  # Generate credential report (may take a few seconds on first call)
                  report_status = iam_client.generate_credential_report()

                  # Wait for report to be ready if needed, with exponential backoff
                  # It can take up to 4 minutes to generate a credential report
                  import time
                  max_wait_time = 360 # 6 minutes
                  start_time = time.time()
                  wait_interval = 1

                  while report_status['State'] != 'COMPLETE':
                      if time.time() - start_time > max_wait_time:
                          break
                      time.sleep(wait_interval)
                      report_status = iam_client.generate_credential_report()
                      wait_interval = min(wait_interval * 1.5, 10)  # Cap at 10 seconds

                  if report_status['State'] != 'COMPLETE':
                      raise RuntimeError("IAM Credential report generation timed out")

                  # Get the credential report
                  logger.info("Retrieving IAM credential report")
                  response = iam_client.get_credential_report()
                  report_content = response['Content'].decode('utf-8')

                  # Parse CSV report
                  import csv
                  from io import StringIO

                  csv_reader = csv.DictReader(StringIO(report_content))

                  # Find root user entry (user == '<root_account>')
                  root_entry = None
                  for row in csv_reader:
                      if row.get('user') == '<root_account>':
                          root_entry = row
                          break

                  if not root_entry:
                      raise RuntimeError("Root account entry not found in credential report")

                  logger.info(f"Found root account entry in credential report")

                  # Check last usage dates
                  threshold_date = datetime.now(timezone.utc) - timedelta(days=root_usage_threshold_days)
                  last_used_date = None

                  # Check password last used
                  password_last_used = root_entry.get('password_last_used')
                  if password_last_used and password_last_used != 'N/A' and password_last_used != 'no_information':
                      try:
                          password_date = datetime.strptime(password_last_used, '%Y-%m-%dT%H:%M:%S+00:00').replace(tzinfo=timezone.utc)
                          if last_used_date is None or password_date > last_used_date:
                              last_used_date = password_date
                          logger.info(f"Root password last used: {password_last_used}")
                      except ValueError as e:
                          logger.warning(f"Could not parse password_last_used date: {e}")

                  # Check access key 1 last used
                  access_key_1_last_used = root_entry.get('access_key_1_last_used_date')
                  if access_key_1_last_used and access_key_1_last_used != 'N/A' and access_key_1_last_used != 'no_information':
                      try:
                          key1_date = datetime.strptime(access_key_1_last_used, '%Y-%m-%dT%H:%M:%S+00:00').replace(tzinfo=timezone.utc)
                          if last_used_date is None or key1_date > last_used_date:
                              last_used_date = key1_date
                          logger.info(f"Root access key 1 last used: {access_key_1_last_used}")
                      except ValueError as e:
                          logger.warning(f"Could not parse access_key_1_last_used_date: {e}")

                  # Check access key 2 last used
                  access_key_2_last_used = root_entry.get('access_key_2_last_used_date')
                  if access_key_2_last_used and access_key_2_last_used != 'N/A' and access_key_2_last_used != 'no_information':
                      try:
                          key2_date = datetime.strptime(access_key_2_last_used, '%Y-%m-%dT%H:%M:%S+00:00').replace(tzinfo=timezone.utc)
                          if last_used_date is None or key2_date > last_used_date:
                              last_used_date = key2_date
                          logger.info(f"Root access key 2 last used: {access_key_2_last_used}")
                      except ValueError as e:
                          logger.warning(f"Could not parse access_key_2_last_used_date: {e}")

                  # Determine compliance
                  if last_used_date is None:
                      # No usage recorded
                      logger.info("No root usage detected")
                      return 'COMPLIANT', None
                  elif last_used_date < threshold_date:
                      # Used, but not within threshold
                      logger.info(f"Root last used {last_used_date}, before threshold {threshold_date}")
                      return 'COMPLIANT', last_used_date
                  else:
                      # Used within threshold
                      logger.info(f"Root last used {last_used_date}, within threshold {threshold_date}")
                      return 'NON_COMPLIANT', last_used_date

              except ClientError as e:
                  logger.error(f"IAM API error: {e}", exc_info=True)
                  raise

              except Exception as e:
                  logger.error(f"Error evaluating root usage: {e}", exc_info=True)
                  raise


          def get_annotation(compliance_type, last_used_date, root_usage_threshold_days):
              """
              Get human-readable annotation for compliance status.

              Args:
                  compliance_type: COMPLIANT or NON_COMPLIANT
                  last_used_date: datetime of last root usage, or None
                  root_usage_threshold_days: how far in the past (in days) the root user must have been used last for COMPLIANT outcome

              Returns:
                  Human-readable annotation string
              """
              if compliance_type == 'COMPLIANT':
                  if last_used_date:
                      return (
                          f'Root account last used on {last_used_date.strftime("%Y-%m-%d")}, '
                          f'which is more than {root_usage_threshold_days} days ago'
                      )
                  else:
                      return f'Root account has not been used (no usage recorded)'
              elif compliance_type == 'NON_COMPLIANT':
                  if last_used_date:
                      days_ago = (datetime.now(timezone.utc) - last_used_date).days
                      return (
                          f'Root account was used {days_ago} days ago on {last_used_date.strftime("%Y-%m-%d")}, '
                          f'within the {root_usage_threshold_days}-day threshold'
                      )
                  else:
                      return f'Root account has been used within the last {root_usage_threshold_days} days'
              else:
                  return 'Unable to determine root account usage'


          # This gets the client after assuming the Config service role
          # either in the same AWS account or cross-account.
          def get_client(service, event):
              """Return the service boto client. It should be used instead of directly calling the client.
              Keyword arguments:
              service -- the service name used for calling the boto.client()
              event -- the event variable given in the lambda handler
              """
              if not ASSUME_ROLE_MODE:
                  return boto3.client(service)
              credentials = get_assume_role_credentials(event["executionRoleArn"])
              return boto3.client(service, aws_access_key_id=credentials['AccessKeyId'],
                                  aws_secret_access_key=credentials['SecretAccessKey'],
                                  aws_session_token=credentials['SessionToken']
                                  )

          def get_assume_role_credentials(role_arn):
              sts_client = boto3.client('sts')
              try:
                  assume_role_response = sts_client.assume_role(RoleArn=role_arn, RoleSessionName="configLambdaExecution")
                  return assume_role_response['Credentials']
              except ClientError as ex:
                  # Scrub error message for any internal account info leaks
                  if 'AccessDenied' in ex.response['Error']['Code']:
                      ex.response['Error']['Message'] = "AWS Config does not have permission to assume the IAM role."
                  else:
                      ex.response['Error']['Message'] = "InternalError"
                      ex.response['Error']['Code'] = "InternalError"
                  raise ex
  RootNotUsedRegularlyLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref RootNotUsedRegularlyLambda
      Action: lambda:InvokeFunction
      Principal: config.amazonaws.com
      SourceAccount: !Ref AWS::AccountId

  # ============================================================================
  # Custom Rule: IAM User Access Key Check
  # ============================================================================

  UserAccessKeyCheckLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: 'SIREConfPackRuleUserAccessKeyCheck'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: ConfigRuleEvaluationPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - config:PutEvaluations
                Resource: '*'
              # Reads the rule's previous results to report deleted IAM users as NOT_APPLICABLE
              - Effect: Allow
                Action:
                  - config:GetComplianceDetailsByConfigRule
                Resource: !Sub 'arn:${AWS::Partition}:config:${AWS::Region}:${AWS::AccountId}:config-rule/*'
        - PolicyName: IAMUserAccessKeyCheckPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - iam:ListUsers
                  - iam:GetUser
                  - iam:ListAccessKeys
                  - iam:GetAccessKeyLastUsed
                Resource: '*'

  UserAccessKeyCheckLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: '/aws/lambda/sire-user-access-key-check'
      RetentionInDays: 30

  UserAccessKeyCheckLambda:
    Type: AWS::Lambda::Function
    DependsOn: UserAccessKeyCheckLogGroup
    Properties:
      FunctionName: 'sire-user-access-key-check'
      Description: "Threat-Informed Security Best Practices (Fundamental) Conformance Pack custom AWS Config rule - IAM users access key check"
      Runtime: python3.14
      Handler: index.lambda_handler
      Role: !GetAtt UserAccessKeyCheckLambdaRole.Arn
      Timeout: 60
      Architectures:
        - x86_64
      Environment:
        Variables:
          LOG_LEVEL: INFO
      Code:
        ZipFile: |
          """
          Threat-Informed Security Best Practices (Fundamental)
          Custom Config Rule: IAM User Access Key Check

          Checks whether IAM users have access keys. It is strongly recommended to not
          create access keys and deleting any that exist, as they provide unrestricted
          access to AWS resources and are high-value targets for attackers.

          ERROR HANDLING:
          ---------------
          AWS Config does not accept INSUFFICIENT_DATA from PutEvaluations, and NOT_APPLICABLE
          would hide a real finding. On errors the function does not send an evaluation for the
          affected resource, so Config keeps its previous result. All valid evaluations are sent
          first, then the function raises, so the failure is visible in the rule's evaluation status.

          DELETED USERS:
          --------------
          This is a periodic rule, so Config does not remove results of deleted users. After a
          complete listing of the IAM users, the function sends NOT_APPLICABLE for users that have
          a COMPLIANT or NON_COMPLIANT result but no longer exist.
          """

          import json
          import logging
          import os
          from datetime import datetime, timezone
          import boto3
          import botocore

          # Configure logging for CloudWatch Logs
          logger = logging.getLogger()
          log_level = os.environ.get('LOG_LEVEL', 'INFO')
          logger.setLevel(getattr(logging, log_level))


          # Set to True to get the lambda to assume the Role attached on the Config Service (useful for cross-account).
          # This check does not need cross-account access
          ASSUME_ROLE_MODE = False

          # PutEvaluations accepts at most 100 evaluations per call
          MAX_EVALUATIONS_PER_CALL = 100
          # Maximum length of an evaluation annotation
          MAX_ANNOTATION_LENGTH = 256

          def lambda_handler(event, context):
              """
              AWS Config custom rule evaluation handler for IAM user access key check.

              This function evaluates whether IAM users have active access keys.
              IAM users should not have access keys as they are high-value targets for attackers.

              Args:
                  event: AWS Config evaluation event containing:
                      - configRuleId: The Config rule identifier
                      - configRuleName: The Config rule name
                      - accountId: AWS account ID
                      - invokingEvent: JSON string, messageType must be ScheduledNotification
                      - resultToken: token to pass to PutEvaluations
                  context: Lambda context object

              Raises:
                  Any error, after all valid evaluations have been sent to AWS Config.
              """
              logger.debug(f"CRCD-ConfPack: Received event: {json.dumps(event)}")

              try:
                  check_defined(event, 'event')
                  # Validate event structure
                  for field in ('configRuleId', 'configRuleName', 'invokingEvent', 'resultToken'):
                      if field not in event:
                          raise ValueError(f"Missing required field: {field}")

                  invoking_event = json.loads(event['invokingEvent'])
                  logger.debug(f"CRCD-ConfPack: Received invoking event: {json.dumps(invoking_event)}")

                  # This rule supports only periodic evaluation
                  if invoking_event['messageType'] != 'ScheduledNotification':
                      raise ValueError(f"This rule accepts only periodic evaluation. Invalid message type: {invoking_event['messageType']}")

                  evaluate_periodic_compliance(event)

              except Exception as e:
                  logger.error(f"CRCD-ConfPack: Error evaluating IAM user access keys: {e}", exc_info=True)
                  raise

          # Helper function used to validate input
          def check_defined(reference, reference_name):
              if not reference:
                  raise ValueError(f"Error: {reference_name} is not defined")
              return reference

          # This gets the client after assuming the Config service role
          # either in the same AWS account or cross-account.
          def get_client(service, event):
              """
              Returns the service boto client. It should be used instead of directly calling the client.

              Keyword arguments:
              service -- the service name used for calling the boto.client()
              event -- the event variable given in the lambda handler
              """
              if not ASSUME_ROLE_MODE:
                  return boto3.client(service)
              credentials = get_assume_role_credentials(event["executionRoleArn"])
              return boto3.client(service, aws_access_key_id=credentials['AccessKeyId'],
                                  aws_secret_access_key=credentials['SecretAccessKey'],
                                  aws_session_token=credentials['SessionToken']
                                  )

          def get_assume_role_credentials(role_arn):
              sts_client = boto3.client('sts')
              try:
                  assume_role_response = sts_client.assume_role(RoleArn=role_arn, RoleSessionName="configLambdaExecution")
                  return assume_role_response['Credentials']
              except botocore.exceptions.ClientError as ex:
                  # Scrub error message for any internal account info leaks
                  if 'AccessDenied' in ex.response['Error']['Code']:
                      ex.response['Error']['Message'] = "AWS Config does not have permission to assume the IAM role."
                  else:
                      ex.response['Error']['Message'] = "InternalError"
                      ex.response['Error']['Code'] = "InternalError"
                  raise ex


          def evaluate_periodic_compliance(event):
              """
              Evaluate all IAM users in the account during periodic evaluation.

              Users that cannot be evaluated are skipped (Config keeps their previous result).
              Valid evaluations are always sent; the function raises afterwards if anything failed.
              """
              iam_client = get_client('iam', event)
              config_client = get_client('config', event)
              evaluations = []
              current_user_ids = set()
              failed_users = []
              errors = []
              listing_complete = False

              try:
                  paginator = iam_client.get_paginator('list_users')
                  for page in paginator.paginate():
                      for user in page['Users']:
                          user_name = user['UserName']
                          user_id = user['UserId']
                          current_user_ids.add(user_id)
                          logger.info(f"CRCD-ConfPack: periodic compliance, checking IAM user {user_name} (id {user_id})")
                          try:
                              compliance_type, annotation = evaluate_user_compliance(user_name, iam_client)
                          except Exception as exc:
                              # Skip this user, do not send an invalid or misleading result
                              logger.error(f"CRCD-ConfPack: Error evaluating IAM user {user_name}: {exc}")
                              failed_users.append(user_name)
                              continue

                          logger.info(f"CRCD-ConfPack: compliance decision for {user_name}: {compliance_type} - annotation: {annotation}")
                          evaluations.append(build_evaluation(user_id, compliance_type, annotation))
                  listing_complete = True
              except Exception as e:
                  # Keep the evaluations collected so far, they are sent below
                  logger.error(f"CRCD-ConfPack: Error listing IAM users, sending partial results: {e}")
                  errors.append(f"listing IAM users failed: {e}")

              # Only a complete listing tells which users were deleted
              if listing_complete:
                  try:
                      evaluations.extend(get_deleted_user_evaluations(config_client, event['configRuleName'], current_user_ids))
                  except Exception as e:
                      logger.error(f"CRCD-ConfPack: Error reading previous results, deleted users not cleaned up: {e}")
                      errors.append(f"reading previous results failed: {e}")

              failed_evaluations = put_evaluations_in_batches(config_client, evaluations, event['resultToken'])
              if failed_evaluations:
                  errors.append(f"Config rejected {failed_evaluations} evaluation(s)")
              if failed_users:
                  errors.append(f"{len(failed_users)} IAM user(s) not evaluated: {', '.join(failed_users)}")
              if errors:
                  raise RuntimeError('; '.join(errors))

          def get_deleted_user_evaluations(config_client, config_rule_name, current_user_ids):
              """Return NOT_APPLICABLE evaluations for users that have a result but no longer exist"""
              evaluations = []
              paginator = config_client.get_paginator('get_compliance_details_by_config_rule')
              for page in paginator.paginate(ConfigRuleName=config_rule_name, ComplianceTypes=['COMPLIANT', 'NON_COMPLIANT']):
                  for result in page.get('EvaluationResults', []):
                      qualifier = result['EvaluationResultIdentifier']['EvaluationResultQualifier']
                      if qualifier.get('ResourceType') == 'AWS::IAM::User' and qualifier.get('ResourceId') not in current_user_ids:
                          logger.info(f"CRCD-ConfPack: IAM user id {qualifier['ResourceId']} no longer exists, reporting NOT_APPLICABLE")
                          evaluations.append(build_evaluation(qualifier['ResourceId'], 'NOT_APPLICABLE', 'IAM user no longer exists'))
              return evaluations

          def build_evaluation(user_id, compliance_type, annotation):
              return {
                  'ComplianceResourceType': 'AWS::IAM::User',
                  'ComplianceResourceId': user_id,
                  'ComplianceType': compliance_type,
                  'Annotation': annotation[:MAX_ANNOTATION_LENGTH],
                  'OrderingTimestamp': datetime.now(timezone.utc)
              }

          def put_evaluations_in_batches(config_client, evaluations, result_token):
              """Send evaluations in batches of 100. Returns the number of evaluations Config rejected."""
              failed = 0
              for i in range(0, len(evaluations), MAX_EVALUATIONS_PER_CALL):
                  response = config_client.put_evaluations(
                      Evaluations=evaluations[i:i + MAX_EVALUATIONS_PER_CALL],
                      ResultToken=result_token
                  )
                  for failed_evaluation in response.get('FailedEvaluations', []):
                      logger.error(f"CRCD-ConfPack: Config rejected evaluation for {failed_evaluation.get('ComplianceResourceId')}")
                      failed += 1
              return failed

          def evaluate_user_compliance(user_name, iam_client):
              """Evaluate a single IAM user's compliance. Raises on API errors."""
              logger.info(f"CRCD-ConfPack: checking IAM user {user_name}")

              response = iam_client.list_access_keys(UserName=user_name)
              access_keys = response.get('AccessKeyMetadata', [])

              # Check for active access keys only
              active_keys = [key for key in access_keys if key['Status'] == 'Active']
              logger.info(f"CRCD-ConfPack: Access keys found: {len(access_keys)}, Active keys: {len(active_keys)}")

              compliance_type = 'NON_COMPLIANT' if active_keys else 'COMPLIANT'
              annotation = get_annotation(compliance_type, user_name, len(active_keys))
              return compliance_type, annotation


          def get_annotation(compliance_type, user_name, access_key_count):
              """
              Get human-readable annotation for compliance status.

              Args:
                  compliance_type: COMPLIANT or NON_COMPLIANT
                  user_name: IAM user name
                  access_key_count: Number of active access keys

              Returns:
                  Human-readable annotation string
              """
              if compliance_type == 'COMPLIANT':
                  return f'IAM user {user_name} does not have active access keys'
              # Do not place AccessKeyIds into Config annotations and logs
              # Just returning the number of keys
              return f'IAM user {user_name} has {access_key_count} active access key(s).'
  UserAccessKeyCheckLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UserAccessKeyCheckLambda
      Action: lambda:InvokeFunction
      Principal: config.amazonaws.com
      SourceAccount: !Ref AWS::AccountId

Outputs:
  RootNotUsedRegularlyLambdaArn:
    Description: "ARN of the Root Not Used Regularly Lambda function. Use this as the RootNotUsedRegularlyLambdaArn parameter in the extended conformance pack."
    Value: !GetAtt RootNotUsedRegularlyLambda.Arn

  UserAccessKeyCheckLambdaArn:
