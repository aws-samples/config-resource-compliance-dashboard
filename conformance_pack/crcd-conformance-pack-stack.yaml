# Security Best Practices for Security Incident Response Engineering Team conformance pack
# Supports two deployment mode: standalone account and AWS Organizations

AWSTemplateFormatVersion: '2010-09-09'
Description: 'CRCD Dashboard Security Best Practices for Security Incident Response Engineering Team Conformance Pack - Deploys IAM rules in current region and all other rules in all regions'

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Deployment Mode"
        Parameters:
          - DeploymentMode
          - DeploymentAccount
      - Label:
          default: "Deployment Configuration"
        Parameters:
          - TargetOrganizationalUnitIds
          - ExcludedAccountsIDs
          - DeploymentRegions
      - Label:
          default: "IAM Protection rule parameters"
        Parameters:
          - RootUsageThresholdDays
      - Label:
          default: "S3 Protection rule parameters"
        Parameters:
          - S3BucketLevelPublicAccessProhibitedExcludedParamPublicBuckets
          - S3AccessPointPublicAccessBlocksParamExcludedAccessPoints
          - S3AccountLevelPublicAccessParamIgnorePublicAcls
          - S3AccountLevelPublicAccessParamBlockPublicPolicy
          - S3AccountLevelPublicAccessParamBlockPublicAcls
          - S3AccountLevelPublicAccessParamRestrictPublicBuckets
      - Label:
          default: "Resource Access Protection rule parameters"
        Parameters:
          - VPCSecurityGroupPortRestrictionParamRestrictedPorts
          - VPCSecurityGroupPortRestrictionParamProtocolType
          - VPCSecurityGroupPortRestrictionParamExcludeExternalSecurityGroups
          - VPCSecurityGroupPortRestrictionParamIpType
      - Label:
          default: "Technical parameters - do not change"
        Parameters:
          - ConformancePackName

    ParameterLabels:
      DeploymentMode:
        default: "Deployment mode"
      DeploymentAccount:
        default: "Deployment account type (used only in deployment mode: AWS Organizations)"

      DeploymentRegions:
        default: "Deployment Regions"
      ConformancePackName:
        default: "Conformance Pack name"
      ExcludedAccountsIDs:
        default: "Accounts to exclude (used only in deployment mode: AWS Organizations)"
      TargetOrganizationalUnitIds:
        default: "Target Organization Root or Organizational Unit IDs"

      VPCSecurityGroupPortRestrictionParamRestrictedPorts:
        default: "VPC Security Group Port Restriction Check rule: restricted ports"
      VPCSecurityGroupPortRestrictionParamProtocolType:
        default: "VPC Security Group Port Restriction Check rule: protocol type"
      VPCSecurityGroupPortRestrictionParamExcludeExternalSecurityGroups:
        default: "VPC Security Group Port Restriction Check rule: exclude external security groups"
      VPCSecurityGroupPortRestrictionParamIpType:
        default: "VPC Security Group Port Restriction Check rule: IP type"
      S3BucketLevelPublicAccessProhibitedExcludedParamPublicBuckets:
        default: "S3 Bucket-Level Public Access Prohibited rule: excluded public buckets"
      S3AccessPointPublicAccessBlocksParamExcludedAccessPoints:
        default: "S3 Access Point Public Access Block rule: excluded access points"
      RootUsageThresholdDays:
        default: "Root Account Not Used Regularly rule: root account usage threshold (days)"
      S3AccountLevelPublicAccessParamIgnorePublicAcls:
        default: "S3 Account-Level Public Access Block rule: enforce option IgnorePublicAcls"
      S3AccountLevelPublicAccessParamBlockPublicPolicy:
        default: "S3 Account-Level Public Access Block rule: enforce option BlockPublicPolicy"
      S3AccountLevelPublicAccessParamBlockPublicAcls:
        default: "S3 Account-Level Public Access Block rule: enforce option BlockPublicAcls"
      S3AccountLevelPublicAccessParamRestrictPublicBuckets:
        default: "S3 Account-Level Public Access Block rule: enforce option RestrictPublicBuckets"
      

Parameters:
  DeploymentMode:
    Type: String
    Default: AWS Organizations
    AllowedValues:
      - AWS Organizations
      - Standalone
    Description: Choose deployment mode - AWS Organizations for multi-account and multi-region deployment, or Standalone for single-account multi-region deployment.

  RootUsageThresholdDays:
    Type: String
    Default: '5'
    Description: Number of days to look back for root account usage. If root was used within this threshold, the account is marked NON_COMPLIANT (Required).
    AllowedPattern: ^[1-9][0-9]{0,2}$
    ConstraintDescription: Must be a number between 1 and 999

  DeploymentAccount:
    Type: String
    Default: Delegated Admin
    AllowedValues:
      - Delegated Admin
      - Management Account
    Description: Type of deployment account (this account). Select 'Delegated Admin' if this account is the AWS Config and AWS CloudFormation delegated admin, or 'Management Account' if you run this template from the management account of your AWS Organization.

  DeploymentRegions:
    Type: CommaDelimitedList
    Default: 'us-east-1,us-east-2,us-west-2,eu-west-1,eu-central-1,ap-southeast-1'
    Description: Comma-separated list of regions where AWS Config is enabled and the conformance pack should be deployed.
    AllowedPattern: ^[a-z]{2}-[a-z]+-\d{1}$
    ConstraintDescription: Must be a valid AWS region code (e.g., us-east-1, eu-west-1)

  ConformancePackName:
    Type: String
    # Default: Security-Best-Practices-for-Security-Incident-Response-Engineering-Team-Fundamental
    Default: Security-Best-Practices-for-Incident-Response-Fundamental
    Description: Name of the conformance pack (required).
    AllowedPattern: ^[a-zA-Z][-a-zA-Z0-9]{0,127}$ # Conformance pack names have a limit of 256 characters, but AWS Config adds to it, so here we limit to 128 (the field is pre-populated anyway)
    ConstraintDescription: Must begin with a letter and contain only alphanumeric characters and hyphens

  TargetOrganizationalUnitIds:
    Type: CommaDelimitedList
    Description: Enter the root OU ID (r-xxxx) to deploy to all accounts of your organization, or specify a comma-separated list of Organizational Unit IDs (ou-xxxx-xxxxxxxx) to deploy to. Leave empty in standalone mode.
    Default: ''
    # AllowedPatterns allows empty for the standalone mode
    AllowedPattern: ^$|^r-[a-z0-9]{4,32}$|^ou-[a-z0-9]+-[a-z0-9]+(,ou-[a-z0-9]+-[a-z0-9]+)*$
    ConstraintDescription: Must be empty, a single root ID (r-xxxx), or a comma-separated list of valid OU IDs (ou-xxxx-xxxxxxxx)

  ExcludedAccountsIDs:
    Type: CommaDelimitedList
    Default: ''
    Description: A comma-separated list of accounts that will not receive the organization conformance pack (leave empty to deploy to all accounts). Make sure you add here any account ID where AWS Config is not enabled, otherwise the entire stack will fail.

  S3BucketLevelPublicAccessProhibitedExcludedParamPublicBuckets:
    Type: String
    Default: ''
    Description: "Comma-separated list of known allowed public Amazon S3 bucket names - for info https://docs.aws.amazon.com/config/latest/developerguide/s3-bucket-level-public-access-prohibited.html"
  
  S3AccessPointPublicAccessBlocksParamExcludedAccessPoints:
    Type: String
    Default: ''
    Description: "Comma-separated list of names for allowed public Amazon S3 access points - for info https://docs.aws.amazon.com/config/latest/developerguide/s3-access-point-public-access-blocks.html"

  VPCSecurityGroupPortRestrictionParamRestrictedPorts:
    Type: String
    Default: '22,3389'
    Description: "Comma-separated list of ports that should not be open for incoming traffic over the full IP range. Valid port numbers range from 0 to 65535. Default value for the rule is '22,3389'. For info https://docs.aws.amazon.com/config/latest/developerguide/vpc-sg-port-restriction-check.html"

  VPCSecurityGroupPortRestrictionParamProtocolType:
    Type: String
    Default: 'ALL'
    Description: The Transmission Protocol Type for the rule to check. Valid values include 'TCP', 'UDP', and 'ALL'. If set to 'ALL', the rule will check for rules that use either 'TCP', 'UDP', or 'ALL' (-1) protocol. Default value for the rule is 'ALL'.
    AllowedValues:
      - ALL
      - TCP
      - UDP
  
  VPCSecurityGroupPortRestrictionParamExcludeExternalSecurityGroups:
    Type: String
    Default: 'true'
    Description: Indicates whether to exclude external security groups from the rule. Set to 'true' to exclude external security groups from the rule. Set to 'false' to include external security groups in the rule evaluation. Default value for the rule is 'true'.
    AllowedValues:
      - 'true'
      - 'false'

  VPCSecurityGroupPortRestrictionParamIpType:
    Type: String
    Default: 'ALL'
    Description: The Internet Protocol (IP) version for the rule to check. Valid values include 'IPv4', 'IPv6', and 'ALL' (case-insensitive). Default value for the rule is 'ALL'.
    AllowedValues:
      - IPv4
      - IPv6
      - ALL

  S3AccountLevelPublicAccessParamIgnorePublicAcls:
    Type: String
    Default: 'true'
    Description: "Indicates whether to check that IgnorePublicAcls option is enforced or not. Set to 'true' to check the option is enforced. Set to 'false' to ignore the option. Default value for the rule is 'true'. For info https://docs.aws.amazon.com/config/latest/developerguide/s3-account-level-public-access-blocks-periodic.html and https://docs.aws.amazon.com/AmazonS3/latest/userguide/access-control-block-public-access.html"
    AllowedValues:
      - 'true'
      - 'false'
  
  S3AccountLevelPublicAccessParamBlockPublicPolicy:
    Type: String
    Default: 'true'
    Description: "Indicates whether to check that BlockPublicPolicy option is enforced or not. Set to 'true' to check the option is enforced. Set to 'false' to ignore the option. Default value for the rule is 'true'."
    AllowedValues:
      - 'true'
      - 'false'

  S3AccountLevelPublicAccessParamBlockPublicAcls:
    Type: String
    Default: 'true'
    Description: "Indicates whether to check that BlockPublicAcls option is enforced or not. Set to 'true' to check the option is enforced. Set to 'false' to ignore the option. Default value for the rule is 'true'."
    AllowedValues:
      - 'true'
      - 'false'

  S3AccountLevelPublicAccessParamRestrictPublicBuckets:
    Type: String
    Default: 'true'
    Description: "Indicates whether to check that RestrictPublicBuckets option is enforced or not. Set to 'true' to check the option is enforced. Set to 'false' to ignore the option. Default value for the rule is 'true'."
    AllowedValues:
      - 'true'
      - 'false'

Conditions:
  IsDelegatedAdminAccount: !Equals [!Ref DeploymentAccount, 'Delegated Admin']
  HasExcludedAccounts: !Not [!Equals [!Join [',', !Ref ExcludedAccountsIDs], '']]
  HasExcludedPublicBuckets: !Not [!Equals [!Ref S3BucketLevelPublicAccessProhibitedExcludedParamPublicBuckets, '']]
  HasExcludedAccessPoints: !Not [!Equals [!Ref S3AccessPointPublicAccessBlocksParamExcludedAccessPoints, '']]
  HasRestrictedPorts: !Not [!Equals [!Ref VPCSecurityGroupPortRestrictionParamRestrictedPorts, '']]
  DeploymentModeIsStandalone: !Equals [!Ref DeploymentMode, 'Standalone']


Resources:

  # ============================================================================
  # Uploads the AWS Config Conformance Pack template to S3
  # Then it is referenced by the resources deployed on each DeploymentMode
  # The template is the same for organization and single account deployment, 
  # but these two modes use different cloud formation resources. 
  # Without referencing the conf pack template from S3, we'd have to duplicate the entire conformance pack template.
  # ============================================================================

  CrcdConfPackTemplateBucket:
  # checkov:skip=CKV_AWS_21: Bucket will how the conformance pack templates and is used only once
  # checkov:skip=CKV_AWS_18: No need of Access Logging, customers will add it if required
    Type: AWS::S3::Bucket
    DeletionPolicy: "Delete"
    UpdateReplacePolicy: "Delete"
    Properties:
      BucketName: !Sub 'sire-conformance-pack-templates-${AWS::AccountId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      AccessControl: BucketOwnerFullControl
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      # BSC12 risk mitigation
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
    Metadata:
      cfn-lint:
        config:
          ignore_checks:
            - W3045 # Consider using AWS::S3::BucketPolicy instead of AccessControl
      cfn_nag:
        rules_to_suppress:
          - id: W35
            reason: "We accept the bucket has no access logging"
          - id: W51
            reason: "We accept the bucket has no bucket policy"
      guard:
        SuppressedRules:
          - S3_BUCKET_LOGGING_ENABLED
          - S3_BUCKET_VERSIONING_ENABLED
  
  CrcdConformancePackUploaderLambdaRole:
    Type: AWS::IAM::Role
    DeletionPolicy: "Delete"
    UpdateReplacePolicy: "Delete"
    Properties:
      Description: "CRCD Dashboard Conformance Pack - role for a Lambda used during deployment"
      RoleName: 'CRCDConfPackUploaderUtility'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3UtilityBucketAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                  - s3:DeleteObjectVersion
                  - s3:ListBucketVersions
                Resource: 
                  - !Sub '${CrcdConfPackTemplateBucket.Arn}/*'
                  - !GetAtt CrcdConfPackTemplateBucket.Arn
  
  TemplateUploaderLambda:
  # checkov:skip=CKV_AWS_115: This lambda is called once at deployment time. No need for reserved concurrency.
  # checkov:skip=CKV_AWS_116: No DQL needed.
    Type: AWS::Lambda::Function
    DeletionPolicy: "Delete"
    UpdateReplacePolicy: "Delete"
    Properties:
      FunctionName: 'sire-conf-pack-support-uploader'
      Description: "CRCD Dashboard - Security Best Practices for Security Incident Response Engineering Team Conformance Pack - Supports the deployment of the Conformance Pack (one-time execution)"
      Runtime: python3.12
      Timeout: 120
      MemorySize: 128
      Architectures:
        - "x86_64"
      TracingConfig:
        Mode: "Active"
      VpcConfig:
        SecurityGroupIds: []
        SubnetIds: []
        Ipv6AllowedForDualStack: false
      LoggingConfig:
        LogFormat: "Text"
      Handler: index.lambda_handler
      Role: !GetAtt CrcdConformancePackUploaderLambdaRole.Arn
      Code:
        ZipFile: |
          import boto3
          import cfnresponse
          import json
          
          def lambda_handler(event, context):
              try:
                  if event['RequestType'] in ['Create', 'Update']:
                      s3 = boto3.client('s3')
                      bucket = event['ResourceProperties']['Bucket']
                      key = event['ResourceProperties']['Key']
                      content = event['ResourceProperties']['Content']
                      
                      # Upload the script to S3
                      s3.put_object(
                          Bucket=bucket,
                          Key=key,
                          Body=content,
                          ContentType='text/x-python' # TODO this is a YAML file
                      )
                      
                      response_data = {
                          'Message': f'Successfully uploaded script to s3://{bucket}/{key}'
                      }
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, response_data)
                  
                  elif event['RequestType'] == 'Delete':
                      # Handle delete event, we must delete the files, empty the bucket
                      s3 = boto3.resource('s3')
                      bucket = event['ResourceProperties']['Bucket']
                      # object_versions handles both versioned and non-versioned buckets
                      s3.Bucket(bucket).object_versions.all().delete()
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                      
              except Exception as e:
                  cfnresponse.send(event, context, cfnresponse.FAILED, {'Error': str(e)})
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W58
            reason: "Permission to write CloudWatch logs is given in IAMRoleLambdaPartitionerConfig"
          - id: W92
            reason: "This function does not need reserved concurrent executions"

  # Triggers the Lambda from CloudFormation
  # The Lambda uploads the conformance pack template to S3, to support multiple deployment modes
  CrcdConformancePackTemplate:
    Type: Custom::CrcdConformancePackUploaderLambda
    Properties:
      ServiceToken: !GetAtt TemplateUploaderLambda.Arn
      Bucket: !Ref CrcdConfPackTemplateBucket
      Key: 'sire-conformance-pack-DO-NOT-DELETE.yaml'
      Content: |
        Parameters:
          DeploymentRegion:
            Type: String
            Default: ''

          VPCSecurityGroupPortRestrictionParamRestrictedPorts:
            Type: String
            Default: ''
          VPCSecurityGroupPortRestrictionParamProtocolType:
            Type: String
          VPCSecurityGroupPortRestrictionParamExcludeExternalSecurityGroups:
            Type: String
          VPCSecurityGroupPortRestrictionParamIpType:
            Type: String
          
          S3AccountLevelPublicAccessParamIgnorePublicAcls:
            Type: String
          S3AccountLevelPublicAccessParamBlockPublicPolicy:
            Type: String
          S3AccountLevelPublicAccessParamBlockPublicAcls:
            Type: String
          S3AccountLevelPublicAccessParamRestrictPublicBuckets:
            Type: String

          S3BucketLevelPublicAccessProhibitedExcludedParamPublicBuckets:
            Type: String
            Default: ''
          
          S3AccessPointPublicAccessBlocksParamExcludedAccessPoints:
            Type: String
            Default: ''

        Conditions:
          HasRestrictedPorts:
            Fn::Not:
            - Fn::Equals:
              - ''
              - Ref: VPCSecurityGroupPortRestrictionParamRestrictedPorts
          
          HasExcludedPublicBuckets: 
            Fn::Not: 
            - Fn::Equals: 
              - ''
              - Ref: S3BucketLevelPublicAccessProhibitedExcludedParamPublicBuckets
          
          HasExcludedAccessPoints:
            Fn::Not: 
            - Fn::Equals: 
              - ''
              - Ref: S3AccessPointPublicAccessBlocksParamExcludedAccessPoints
          
          # Managing Regional availability of AWS Config rules
          # Region check - rules
          # AUTOSCALING_LAUNCHCONFIG_REQUIRES_IMDSV2
          # S3_ACCESS_POINT_IN_VPC_ONLY
          # S3_ACCESS_POINT_PUBLIC_ACCESS_BLOCKS
          # are not supported in these regions
          # ap-southeast-7  # Thailand
          # ap-southeast-5  # Malaysia
          # mx-central-1    # Mexico
          # ap-east-1       # Taipei (Hong Kong)
          # ca-west-1       # Calgary
          IsUnsupportedRegion3Rules:
            Fn::Or:
              - Fn::Equals:
                - Ref: DeploymentRegion
                - 'ap-southeast-7'
              - Fn::Equals:
                - Ref: DeploymentRegion
                - 'ap-southeast-5'
              - Fn::Equals:
                - Ref: DeploymentRegion
                - 'mx-central-1'
              - Fn::Equals:
                - Ref: DeploymentRegion
                - 'ap-east-1'
              - Fn::Equals:
                - Ref: DeploymentRegion
                - 'ca-west-1'
          IsSupportedRegion3Rules:
            Fn::Not:
              - Condition: IsUnsupportedRegion3Rules

          # EC2_LAUNCH_TEMPLATE_IMDSV2_CHECK is not supported in these regions
          # ap-southeast-7  Thailand
          # ap-southeast-5  Malaysia
          # mx-central-1    Mexico
          # ap-east-1       Taipei (Hong Kong)
          # ca-west-1       Calgary
          # me-central-1    Middle East UAE
          # ap-south-2      Asia Pacific (Hyderabad)
          # ap-southeast-4  Asia Pacific (Melbourne)
          # us-gov-east-1   AWS GovCloud (US-East)
          # us-gov-west-1   AWS GovCloud (US-West)
          # il-central-1    Israel (Tel Aviv) 
          # eu-south-2      Europe (Spain) 
          # eu-central-2    Europe (Zurich)
          # need to nest Fn::Or since it supports max 10 conditions
          IsUnsupportedRegionImdsv2:
            Fn::Or:
              - Fn::Or:
                - Fn::Equals:
                  - Ref: DeploymentRegion
                  - 'ap-southeast-7'
                - Fn::Equals:
                  - Ref: DeploymentRegion
                  - 'ap-southeast-5'
                - Fn::Equals:
                  - Ref: DeploymentRegion
                  - 'mx-central-1'
                - Fn::Equals:
                  - Ref: DeploymentRegion
                  - 'ap-east-1'
                - Fn::Equals:
                  - Ref: DeploymentRegion
                  - 'ca-west-1'
                - Fn::Equals:
                  - Ref: DeploymentRegion
                  - 'me-central-1'
                - Fn::Equals:
                  - Ref: DeploymentRegion
                  - 'ap-south-2'
              - Fn::Or:
                - Fn::Equals:
                  - Ref: DeploymentRegion
                  - 'ap-southeast-4'
                - Fn::Equals:
                  - Ref: DeploymentRegion
                  - 'us-gov-east-1'
                - Fn::Equals:
                  - Ref: DeploymentRegion
                  - 'us-gov-west-1'
                - Fn::Equals:
                  - Ref: DeploymentRegion
                  - 'il-central-1'
                - Fn::Equals:
                  - Ref: DeploymentRegion
                  - 'eu-south-2'
                - Fn::Equals:
                  - Ref: DeploymentRegion
                  - 'eu-central-2'
          IsSupportedRegionImdsv2:
            Fn::Not:
              - Condition: IsUnsupportedRegionImdsv2

          # VPC_SG_PORT_RESTRICTION_CHECK is not supported in these regions
          # are not supported in these regions
          # ap-southeast-7  # Thailand
          # ap-southeast-5  # Malaysia
          # mx-central-1    # Mexico
          # ap-east-1       # Taipei (Hong Kong)
          # ca-west-1       # Calgary
          # cn-north-1      # China (Beijing) 
          IsUnsupportedRegionSgPortRestriction:
            Fn::Or:
              - Fn::Equals:
                - Ref: DeploymentRegion
                - 'ap-southeast-7'
              - Fn::Equals:
                - Ref: DeploymentRegion
                - 'ap-southeast-5'
              - Fn::Equals:
                - Ref: DeploymentRegion
                - 'mx-central-1'
              - Fn::Equals:
                - Ref: DeploymentRegion
                - 'ap-east-1'
              - Fn::Equals:
                - Ref: DeploymentRegion
                - 'ca-west-1'
              - Fn::Equals:
                - Ref: DeploymentRegion
                - 'cn-north-1'
          IsSupportedRegionSgPortRestriction:
            Fn::Not:
              - Condition: IsUnsupportedRegionSgPortRestriction

        Resources:
          # ============================================================================
          # Initial Access - S3 Protection
          # ============================================================================

          S3BucketPublicReadProhibited:
            Type: AWS::Config::ConfigRule
            Properties:
              ConfigRuleName: sire-ia-s3-s3-bucket-public-read-prohibited
              Description: Checks that S3 buckets do not allow public read access
              Source:
                Owner: AWS
                SourceIdentifier: S3_BUCKET_PUBLIC_READ_PROHIBITED
              Scope:
                ComplianceResourceTypes:
                  - AWS::S3::Bucket
              
          S3BucketPublicWriteProhibited:
            Type: AWS::Config::ConfigRule
            Properties:
              ConfigRuleName: sire-ia-s3-s3-bucket-public-write-prohibited
              Description: Checks that S3 buckets do not allow public write access
              Source:
                Owner: AWS
                SourceIdentifier: S3_BUCKET_PUBLIC_WRITE_PROHIBITED
              Scope:
                ComplianceResourceTypes:
                  - AWS::S3::Bucket
          
          S3AccessPointInVpcOnly:
            Type: AWS::Config::ConfigRule
            Condition: IsSupportedRegion3Rules
            Properties:
              ConfigRuleName: sire-ia-s3-s3-access-point-in-vpc-only
              Description: Checks whether Amazon S3 access points are configured to only allow access from within a VPC
              Source:
                Owner: AWS
                SourceIdentifier: S3_ACCESS_POINT_IN_VPC_ONLY
              Scope:
                ComplianceResourceTypes:
                  - AWS::S3::AccessPoint
              
          S3AccessPointPublicAccessBlocks:
            Type: AWS::Config::ConfigRule
            Condition: IsSupportedRegion3Rules
            Properties:
              ConfigRuleName: sire-ia-s3-s3-access-point-public-access-blocks
              Description: Checks whether Amazon S3 access points have public access block settings enabled
              Source:
                Owner: AWS
                SourceIdentifier: S3_ACCESS_POINT_PUBLIC_ACCESS_BLOCKS
              Scope:
                ComplianceResourceTypes:
                  - AWS::S3::AccessPoint
            InputParameters:
                excludedAccessPoints:
                  Fn::If:
                  - HasExcludedAccessPoints
                  - Ref: S3AccessPointPublicAccessBlocksParamExcludedAccessPoints
                  - Ref: AWS::NoValue

          S3AccountLevelPublicAccessParamBlocksPeriodic:
            Type: AWS::Config::ConfigRule
            Properties:
              ConfigRuleName: sire-ia-s3-s3-account-level-public-access-blocks-periodic
              Description: Periodically checks whether Amazon S3 account-level public access block settings remain enabled
              Source:
                Owner: AWS
                SourceIdentifier: S3_ACCOUNT_LEVEL_PUBLIC_ACCESS_BLOCKS_PERIODIC
              MaximumExecutionFrequency: TwentyFour_Hours
              InputParameters:
                IgnorePublicAcls:
                  Ref: S3AccountLevelPublicAccessParamIgnorePublicAcls
                BlockPublicPolicy:
                  Ref: S3AccountLevelPublicAccessParamBlockPublicPolicy
                BlockPublicAcls:
                  Ref: S3AccountLevelPublicAccessParamBlockPublicAcls
                RestrictPublicBuckets:
                  Ref: S3AccountLevelPublicAccessParamRestrictPublicBuckets
          
          S3BucketLevelPublicAccessProhibited:
            Type: AWS::Config::ConfigRule
            Properties:
              ConfigRuleName: sire-ia-s3-s3-bucket-level-public-access-prohibited
              Description: Checks if S3 buckets are publicly accessible
              Source:
                Owner: AWS
                SourceIdentifier: S3_BUCKET_LEVEL_PUBLIC_ACCESS_PROHIBITED
              Scope:
                ComplianceResourceTypes:
                  - AWS::S3::Bucket
              InputParameters:
                excludedPublicBuckets:
                  Fn::If:
                  - HasExcludedPublicBuckets
                  - Ref: S3BucketLevelPublicAccessProhibitedExcludedParamPublicBuckets
                  - Ref: AWS::NoValue
          
          # ============================================================================
          # Initial Access - EC2 Security
          # ============================================================================

          AutoscalingLaunchconfigRequiresImdsv2:
            Type: AWS::Config::ConfigRule
            Condition: IsSupportedRegion3Rules
            Properties:
              ConfigRuleName: sire-ia-ec2-autoscaling-launchconfig-requires-imdsv2
              Description: Checks whether Amazon EC2 Auto Scaling groups have launch configurations that require Instance Metadata Service Version 2 (IMDSv2)
              Source:
                Owner: AWS
                SourceIdentifier: AUTOSCALING_LAUNCHCONFIG_REQUIRES_IMDSV2
              Scope:
                ComplianceResourceTypes:
                  - AWS::AutoScaling::LaunchConfiguration

          Ec2Imdsv2Check:
            Type: AWS::Config::ConfigRule
            Properties:
              ConfigRuleName: sire-ia-ec2-ec2-imdsv2-check
              Description: Checks whether EC2 instances are configured to require Instance Metadata Service Version 2 (IMDSv2)
              Source:
                Owner: AWS
                SourceIdentifier: EC2_IMDSV2_CHECK
              Scope:
                ComplianceResourceTypes:
                  - AWS::EC2::Instance
          
          Ec2LaunchTemplateImdsv2Check:
            Type: AWS::Config::ConfigRule
            Condition: IsSupportedRegionImdsv2
            Properties:
              ConfigRuleName: sire-ia-ec2-ec2-launch-template-imdsv2-check
              Description: Checks whether EC2 launch templates are configured to require Instance Metadata Service Version 2 (IMDSv2)
              Source:
                Owner: AWS
                SourceIdentifier: EC2_LAUNCH_TEMPLATE_IMDSV2_CHECK
              Scope:
                ComplianceResourceTypes:
                  - AWS::EC2::LaunchTemplate
        
          # ============================================================================
          # Initial Access - Resource Access Protection
          # ============================================================================
          
          VPCSecurityGroupPortRestrictionParamCheck:
            Type: AWS::Config::ConfigRule
            Condition: IsSupportedRegionSgPortRestriction
            Properties:
              ConfigRuleName: sire-ia-ra-vpc-sg-port-restriction-check
              Source:
                Owner: AWS
                SourceIdentifier: VPC_SG_PORT_RESTRICTION_CHECK
              Description: Checks whether security groups allow unrestricted inbound ports
              Scope:
                ComplianceResourceTypes:
                  - AWS::EC2::SecurityGroup
              InputParameters:
                restrictPorts:
                  Fn::If:
                  - HasRestrictedPorts
                  - Ref: VPCSecurityGroupPortRestrictionParamRestrictedPorts
                  - Ref: AWS::NoValue
                protocolType:
                  Ref: VPCSecurityGroupPortRestrictionParamProtocolType
                excludeExternalSecurityGroups:
                  Ref: VPCSecurityGroupPortRestrictionParamExcludeExternalSecurityGroups
                ipType:
                  Ref: VPCSecurityGroupPortRestrictionParamIpType



  # ============================================================================
  # ConformancePack for SIRE Config rules
  #
  # This stackset runs in all specified regions of current account to deploy 
  # 1. [Organization deployment mode] an organization conformance pack which then will deploy in the same region on all accounts
  # 2. [Standalone deployment mode] a conformance pack 
  #
  # Regional availability of rules is handled within the template.
  # ============================================================================
  # IAM Role for StackSet Administration (SELF_MANAGED mode)
  StackSetAdministrationRole:
    Type: AWS::IAM::Role
    DeletionPolicy: "Delete"
    UpdateReplacePolicy: "Delete"
    Properties:
      RoleName: CRCDConfPackStackSetAdministrationRole # was: AWSCloudFormationStackSetAdministrationRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AssumeRole-AWSCloudFormationStackSetExecutionRole
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sts:AssumeRole
                Resource:
                  - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/CRCDConfPackStackSetExecutionRole'

  # IAM Role for StackSet Execution (SELF_MANAGED mode)
  StackSetExecutionRole:
    Type: AWS::IAM::Role
    DeletionPolicy: "Delete"
    UpdateReplacePolicy: "Delete"
    Properties:
      RoleName: CRCDConfPackStackSetExecutionRole # was: AWSCloudFormationStackSetExecutionRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !GetAtt StackSetAdministrationRole.Arn
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AdministratorAccess

  # This stack set iterates through the specified regions of the current account
  CRCDConfPackStackSet:
    Type: AWS::CloudFormation::StackSet
    DependsOn: CrcdConformancePackTemplate
    DeletionPolicy: "Delete"
    UpdateReplacePolicy: "Delete"
    Properties:
      StackSetName: !Sub '${ConformancePackName}-org-stackset'
      Description: Deploys CRCD conformance pack rules
      PermissionModel: SELF_MANAGED # Runs on this account only
      AdministrationRoleARN: 
        !GetAtt StackSetAdministrationRole.Arn
      ExecutionRoleName:
        !Ref StackSetExecutionRole
      StackInstancesGroup:
        - DeploymentTargets:
            Accounts:
              - !Ref 'AWS::AccountId'  # Current account only
          Regions: !Ref DeploymentRegions

      Parameters:
        - ParameterKey: ConformancePackName
          ParameterValue: !Ref ConformancePackName

        # Will pass the installation mode to the sub template
        - ParameterKey: DeploymentMode
          ParameterValue: !Ref DeploymentMode

        # Path to the template file
        - ParameterKey: ConformancePackTemplateS3Uri
          ParameterValue: !Sub 's3://${CrcdConfPackTemplateBucket}/sire-conformance-pack-DO-NOT-DELETE.yaml'

        # convert the array ExcludedAccountsIDs to String, from now on this parameter is a string in the sub templates
        - Fn::If:
          - HasExcludedAccounts
          - ParameterKey: ExcludedAccountsIDs
            ParameterValue: !Join [',', !Ref ExcludedAccountsIDs]
          - Ref: AWS::NoValue
        
        # parameters to VPC_SG_PORT_RESTRICTION_CHECK rule
        - ParameterKey: VPCSecurityGroupPortRestrictionParamProtocolType
          ParameterValue: !Ref VPCSecurityGroupPortRestrictionParamProtocolType
        - ParameterKey: VPCSecurityGroupPortRestrictionParamExcludeExternalSecurityGroups
          ParameterValue: !Ref VPCSecurityGroupPortRestrictionParamExcludeExternalSecurityGroups
        - ParameterKey: VPCSecurityGroupPortRestrictionParamIpType
          ParameterValue: !Ref VPCSecurityGroupPortRestrictionParamIpType
        - Fn::If:
          - HasRestrictedPorts
          - ParameterKey: VPCSecurityGroupPortRestrictionParamRestrictedPorts
            ParameterValue: !Ref VPCSecurityGroupPortRestrictionParamRestrictedPorts
          - Ref: AWS::NoValue
        
        # parameters to S3_ACCOUNT_LEVEL_PUBLIC_ACCESS_BLOCKS_PERIODIC rule
        - ParameterKey: S3AccountLevelPublicAccessParamIgnorePublicAcls
          ParameterValue: !Ref S3AccountLevelPublicAccessParamIgnorePublicAcls
        - ParameterKey: S3AccountLevelPublicAccessParamBlockPublicPolicy
          ParameterValue: !Ref S3AccountLevelPublicAccessParamBlockPublicPolicy
        - ParameterKey: S3AccountLevelPublicAccessParamBlockPublicAcls
          ParameterValue: !Ref S3AccountLevelPublicAccessParamBlockPublicAcls
        - ParameterKey: S3AccountLevelPublicAccessParamRestrictPublicBuckets
          ParameterValue: !Ref S3AccountLevelPublicAccessParamRestrictPublicBuckets
        
        # parameters to S3_BUCKET_LEVEL_PUBLIC_ACCESS_PROHIBITED rule
        - Fn::If:
          - HasExcludedPublicBuckets
          - ParameterKey: S3BucketLevelPublicAccessProhibitedExcludedParamPublicBuckets
            ParameterValue: !Ref S3BucketLevelPublicAccessProhibitedExcludedParamPublicBuckets
          - Ref: AWS::NoValue
        
        # parameters to S3_ACCESS_POINT_PUBLIC_ACCESS_BLOCKS rule
        - Fn::If:
          - HasExcludedAccessPoints
          - ParameterKey: S3AccessPointPublicAccessBlocksParamExcludedAccessPoints
            ParameterValue: !Ref S3AccessPointPublicAccessBlocksParamExcludedAccessPoints
          - Ref: AWS::NoValue

      TemplateBody: |
        AWSTemplateFormatVersion: '2010-09-09'
        Description: 'SIRE Conformance Pack - deployed via StackSet'

        Parameters:
          ConformancePackName:
            Type: String
          DeploymentMode:
            Type: String
          ExcludedAccountsIDs:
            Type: String
            Default: ''
          ConformancePackTemplateS3Uri:
            Type: String

          
          # parameters to VPC_SG_PORT_RESTRICTION_CHECK rule
          VPCSecurityGroupPortRestrictionParamProtocolType:
            Type: String
          VPCSecurityGroupPortRestrictionParamExcludeExternalSecurityGroups:
            Type: String
          VPCSecurityGroupPortRestrictionParamIpType:
            Type: String
          VPCSecurityGroupPortRestrictionParamRestrictedPorts:
            Type: String
            Default: ''
          
          # parameters to S3_ACCOUNT_LEVEL_PUBLIC_ACCESS_BLOCKS_PERIODIC rule
          S3AccountLevelPublicAccessParamIgnorePublicAcls:
            Type: String
          S3AccountLevelPublicAccessParamBlockPublicPolicy:
            Type: String
          S3AccountLevelPublicAccessParamBlockPublicAcls:
            Type: String
          S3AccountLevelPublicAccessParamRestrictPublicBuckets:
            Type: String

          # parameters to S3_BUCKET_LEVEL_PUBLIC_ACCESS_PROHIBITED rule
          S3BucketLevelPublicAccessProhibitedExcludedParamPublicBuckets:
            Type: String
            Default: ''

          # parameters to S3_ACCESS_POINT_PUBLIC_ACCESS_BLOCKS rule
          S3AccessPointPublicAccessBlocksParamExcludedAccessPoints:
            Type: String
            Default: ''

        Conditions:
          # parameters that come from a drop down list are always provided
          # the others must have this construct
          HasExcludedPublicBuckets: !Not [!Equals [!Ref S3BucketLevelPublicAccessProhibitedExcludedParamPublicBuckets, '']]
          HasRestrictedPorts: !Not [!Equals [!Ref VPCSecurityGroupPortRestrictionParamRestrictedPorts, '']]
          HasExcludedAccessPoints: !Not [!Equals [!Ref S3AccessPointPublicAccessBlocksParamExcludedAccessPoints, '']]
          HasExcludedAccounts: !Not [!Equals [!Ref ExcludedAccountsIDs, '']] # checking the STRING parameter has data

          DeploymentModeIsOrganization: !Equals [!Ref DeploymentMode, 'AWS Organizations']
          DeploymentModeIsStandalone: !Equals [!Ref DeploymentMode, 'Standalone']   

        Resources:
          CRCDStandaloneConformancePack:
            Type: AWS::Config::ConformancePack
            Condition: DeploymentModeIsStandalone
            Properties:
              ConformancePackName: !Ref ConformancePackName
              
              ConformancePackInputParameters:
                # Current region of deployment for this stackset, must be passed to the nested template
                - ParameterName: DeploymentRegion
                  ParameterValue: !Ref AWS::Region
                
                - ParameterName: VPCSecurityGroupPortRestrictionParamProtocolType
                  ParameterValue: !Ref VPCSecurityGroupPortRestrictionParamProtocolType
                - ParameterName: VPCSecurityGroupPortRestrictionParamExcludeExternalSecurityGroups
                  ParameterValue: !Ref VPCSecurityGroupPortRestrictionParamExcludeExternalSecurityGroups
                - ParameterName: VPCSecurityGroupPortRestrictionParamIpType
                  ParameterValue: !Ref VPCSecurityGroupPortRestrictionParamIpType
                - Fn::If:
                  - HasRestrictedPorts
                  - ParameterName: VPCSecurityGroupPortRestrictionParamRestrictedPorts
                    ParameterValue: !Ref VPCSecurityGroupPortRestrictionParamRestrictedPorts
                  - Ref: AWS::NoValue

                - ParameterName: S3AccountLevelPublicAccessParamIgnorePublicAcls
                  ParameterValue: !Ref S3AccountLevelPublicAccessParamIgnorePublicAcls
                - ParameterName: S3AccountLevelPublicAccessParamBlockPublicPolicy
                  ParameterValue: !Ref S3AccountLevelPublicAccessParamBlockPublicPolicy
                - ParameterName: S3AccountLevelPublicAccessParamBlockPublicAcls
                  ParameterValue: !Ref S3AccountLevelPublicAccessParamBlockPublicAcls
                - ParameterName: S3AccountLevelPublicAccessParamRestrictPublicBuckets
                  ParameterValue: !Ref S3AccountLevelPublicAccessParamRestrictPublicBuckets
                
                - Fn::If:
                  - HasExcludedPublicBuckets
                  - ParameterName: S3BucketLevelPublicAccessProhibitedExcludedParamPublicBuckets
                    ParameterValue: !Ref S3BucketLevelPublicAccessProhibitedExcludedParamPublicBuckets
                  - Ref: AWS::NoValue

                - Fn::If:
                  - HasExcludedAccessPoints
                  - ParameterName: S3AccessPointPublicAccessBlocksParamExcludedAccessPoints
                    ParameterValue: !Ref S3AccessPointPublicAccessBlocksParamExcludedAccessPoints
                  - Ref: AWS::NoValue

              # If you don't specify it, AWS Config will use the default delivery channel's S3 bucket that's already configured in your organization's management account.
              # The name of the Amazon S3 bucket where AWS Config stores conformance pack templates. 
              # DeliveryS3Bucket:
              TemplateS3Uri: !Ref ConformancePackTemplateS3Uri

          CRCDOrganizationConformancePack:
            Type: AWS::Config::OrganizationConformancePack
            Condition: DeploymentModeIsOrganization
            Properties:
              OrganizationConformancePackName: !Ref ConformancePackName
              
              ConformancePackInputParameters:
                # Current region of deployment for this stackset, must be passed to the nested template
                - ParameterName: DeploymentRegion
                  ParameterValue: !Ref AWS::Region
                
                - ParameterName: VPCSecurityGroupPortRestrictionParamProtocolType
                  ParameterValue: !Ref VPCSecurityGroupPortRestrictionParamProtocolType
                - ParameterName: VPCSecurityGroupPortRestrictionParamExcludeExternalSecurityGroups
                  ParameterValue: !Ref VPCSecurityGroupPortRestrictionParamExcludeExternalSecurityGroups
                - ParameterName: VPCSecurityGroupPortRestrictionParamIpType
                  ParameterValue: !Ref VPCSecurityGroupPortRestrictionParamIpType
                - Fn::If:
                  - HasRestrictedPorts
                  - ParameterName: VPCSecurityGroupPortRestrictionParamRestrictedPorts
                    ParameterValue: !Ref VPCSecurityGroupPortRestrictionParamRestrictedPorts
                  - Ref: AWS::NoValue

                - ParameterName: S3AccountLevelPublicAccessParamIgnorePublicAcls
                  ParameterValue: !Ref S3AccountLevelPublicAccessParamIgnorePublicAcls
                - ParameterName: S3AccountLevelPublicAccessParamBlockPublicPolicy
                  ParameterValue: !Ref S3AccountLevelPublicAccessParamBlockPublicPolicy
                - ParameterName: S3AccountLevelPublicAccessParamBlockPublicAcls
                  ParameterValue: !Ref S3AccountLevelPublicAccessParamBlockPublicAcls
                - ParameterName: S3AccountLevelPublicAccessParamRestrictPublicBuckets
                  ParameterValue: !Ref S3AccountLevelPublicAccessParamRestrictPublicBuckets
                
                - Fn::If:
                  - HasExcludedPublicBuckets
                  - ParameterName: S3BucketLevelPublicAccessProhibitedExcludedParamPublicBuckets
                    ParameterValue: !Ref S3BucketLevelPublicAccessProhibitedExcludedParamPublicBuckets
                  - Ref: AWS::NoValue

                - Fn::If:
                  - HasExcludedAccessPoints
                  - ParameterName: S3AccessPointPublicAccessBlocksParamExcludedAccessPoints
                    ParameterValue: !Ref S3AccessPointPublicAccessBlocksParamExcludedAccessPoints
                  - Ref: AWS::NoValue

              # A comma-separated list of accounts excluded from organization conformance pack.
              ExcludedAccounts: !If 
                - HasExcludedAccounts
                - !Split [',', !Ref ExcludedAccountsIDs]
                - !Ref 'AWS::NoValue'

              # If you don't specify it, AWS Config will use the default delivery channel's S3 bucket that's already configured in your organization's management account.
              # The name of the Amazon S3 bucket where AWS Config stores conformance pack templates. 
              # DeliveryS3Bucket:
              TemplateS3Uri: !Ref ConformancePackTemplateS3Uri

  # ============================================================================
  # IAM rules are deployed on the current region only
  # [Standalone mode] The stack set contains custom rules whose lambda logic is deployed in the current region
  # [Organization mode] The stack set contains custom rules whose lambda logic is deployed in the current region in all accounts of the organization
  # ============================================================================
  CRCDIAMRulesStackSet:
    Type: AWS::CloudFormation::StackSet
    Properties:
      # StackSetName: !Sub '${ConformancePackName}-iam-rules-stackset'
      StackSetName: !Sub '${ConformancePackName}-extended-stackset'
      Description: Deploys CRCD conformance pack IAM rules
      PermissionModel: !If
        - DeploymentModeIsStandalone
        - SELF_MANAGED
        - SERVICE_MANAGED
      
      AdministrationRoleARN: !If
        - DeploymentModeIsStandalone
        - !GetAtt StackSetAdministrationRole.Arn
        - !Ref 'AWS::NoValue'
      ExecutionRoleName: !If
        - DeploymentModeIsStandalone
        - !Ref StackSetExecutionRole
        - !Ref 'AWS::NoValue'

      CallAs: !If
      - DeploymentModeIsStandalone
      - !Ref 'AWS::NoValue'
      - !If [IsDelegatedAdminAccount, DELEGATED_ADMIN, SELF]

      AutoDeployment: !If
      - DeploymentModeIsStandalone
      - !Ref 'AWS::NoValue'
      - Enabled: true
        RetainStacksOnAccountRemoval: false
      
      Capabilities:
        # This stack creates IAM roles with custom role names
        # Since the IAM roles have explicit RoleName properties, CloudFormation needs the stronger acknowledgment that we're creating named IAM resources
        # The template will be created in a single region, roles will be created only once per account
        - CAPABILITY_NAMED_IAM

      StackInstancesGroup:
      - DeploymentTargets: !If
          - DeploymentModeIsStandalone
          - Accounts:
              - !Ref 'AWS::AccountId'
          - OrganizationalUnitIds: !Ref TargetOrganizationalUnitIds
            AccountFilterType: !If [HasExcludedAccounts, DIFFERENCE, NONE]
            Accounts: !If [HasExcludedAccounts, !Ref ExcludedAccountsIDs, !Ref 'AWS::NoValue']
        Regions:
          - !Ref 'AWS::Region'

      Parameters:
        - ParameterKey: ConformancePackName
          ParameterValue: !Sub '${ConformancePackName}-Extended' # Follows the naming convention of the conformance pack
          # ParameterValue: !Sub '${ConformancePackName}-IA-IAM' # Follows the naming convention of the conformance pack
        - ParameterKey: RootUsageThresholdDays
          ParameterValue: !Ref RootUsageThresholdDays
      TemplateBody: |
        AWSTemplateFormatVersion: '2010-09-09'
        Description: 'CRCD IAM Rules - deployed via StackSet (region-limited)'

        Parameters:
          ConformancePackName:
            Type: String
          RootUsageThresholdDays:
            Type: String
            Default: '5'

        Resources:
          # Lambda Execution Role for Root Account Usage Check
          RootNotUsedRegularlyLambdaRole:
            Type: AWS::IAM::Role
            DeletionPolicy: Delete
            UpdateReplacePolicy: Delete
            Properties:
              RoleName: 'CRCDConfPackRuleRootNotUsedRegularly'
              AssumeRolePolicyDocument:
                Version: '2012-10-17'
                Statement:
                  - Effect: Allow
                    Principal:
                      Service: lambda.amazonaws.com
                    Action: sts:AssumeRole
              ManagedPolicyArns:
                - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
              Policies:
                - PolicyName: ConfigRuleEvaluationPolicy
                  PolicyDocument:
                    Version: '2012-10-17'
                    Statement:
                      - Effect: Allow
                        Action:
                          - config:PutEvaluations
                        Resource: '*'
                - PolicyName: RootAccountCheckPolicy
                  PolicyDocument:
                    Version: '2012-10-17'
                    Statement:
                      - Effect: Allow
                        Action:
                          - iam:GetAccountSummary
                          - iam:GetCredentialReport
                          - iam:GenerateCredentialReport
                          - cloudtrail:LookupEvents
                        Resource: '*'
            Metadata:
              guard:
                SuppressedRules:
                  - IAM_NO_INLINE_POLICY_CHECK

          # Lambda Execution Role for IAM User Access Key Check
          UserAccessKeyCheckLambdaRole:
            Type: AWS::IAM::Role
            DeletionPolicy: Delete
            UpdateReplacePolicy: Delete
            Properties:
              RoleName: 'CRCDConfPackRuleUserAccessKeyCheck'
              AssumeRolePolicyDocument:
                Version: '2012-10-17'
                Statement:
                  - Effect: Allow
                    Principal:
                      Service: lambda.amazonaws.com
                    Action: sts:AssumeRole
              ManagedPolicyArns:
                - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
              Policies:
                - PolicyName: ConfigRuleEvaluationPolicy
                  PolicyDocument:
                    Version: '2012-10-17'
                    Statement:
                      - Effect: Allow
                        Action:
                          - config:PutEvaluations
                        Resource: '*'
                - PolicyName: IAMUserAccessKeyCheckPolicy
                  PolicyDocument:
                    Version: '2012-10-17'
                    Statement:
                      - Effect: Allow
                        Action:
                          - iam:ListUsers
                          - iam:GetUser
                          - iam:ListAccessKeys
                          - iam:GetAccessKeyLastUsed
                        Resource: '*'
            Metadata:
              guard:
                SuppressedRules:
                  - IAM_NO_INLINE_POLICY_CHECK

          # CloudWatch Log Group for Root Not Used Regularly Lambda
          RootNotUsedRegularlyLogGroup:
          # checkov:skip=CKV_AWS_158: No KMS encryption needed
            Type: AWS::Logs::LogGroup
            DeletionPolicy: Delete
            UpdateReplacePolicy: Delete
            Properties:
              LogGroupName: '/aws/lambda/sire-root-not-used-regularly'
              RetentionInDays: 30
            Metadata:
              cfn_nag:
                rules_to_suppress:
                  - id: W84
                    reason: No KMS encryption needed
              guard:
                SuppressedRules:
                  - CLOUDWATCH_LOG_GROUP_ENCRYPTED

          # CloudWatch Log Group for User Access Key Check Lambda
          UserAccessKeyCheckLogGroup:
          # checkov:skip=CKV_AWS_158: No KMS encryption needed
            Type: AWS::Logs::LogGroup
            DeletionPolicy: Delete
            UpdateReplacePolicy: Delete
            Properties:
              LogGroupName: '/aws/lambda/sire-user-access-key-check'
              RetentionInDays: 30
            Metadata:
              cfn_nag:
                rules_to_suppress:
                  - id: W84
                    reason: No KMS encryption needed
              guard:
                SuppressedRules:
                  - CLOUDWATCH_LOG_GROUP_ENCRYPTED

          # Custom Lambda Function: Root Account Not Used Regularly
          RootNotUsedRegularlyLambda:
          # checkov:skip=CKV_AWS_117: No need to access VPC resources.
          # checkov:skip=CKV_AWS_115: Cuncurrency limit needs are customer dependent. This lambda is called daily by AWS Config, we don't anticipate the need for reserved concurrency.
          # checkov:skip=CKV_AWS_173: Environment variables are not sensitive.
          # checkov:skip=CKV_AWS_116: No DQL needed.
            Type: AWS::Lambda::Function
            DependsOn: RootNotUsedRegularlyLogGroup
            DeletionPolicy: Delete
            UpdateReplacePolicy: Delete
            Properties:
              FunctionName: 'sire-root-not-used-regularly'
              Description: Security Best Practices for Security Incident Response Engineering Team Conformance Pack custom AWS Config rule - Root account not used regularly
              Runtime: python3.11
              Handler: index.lambda_handler
              Role: !GetAtt RootNotUsedRegularlyLambdaRole.Arn
              Timeout: 420
              Code:
                ZipFile: |
                  """
                  Security Best Practices for Security Incident Response Engineering Team
                  Custom Config Rule: Root Account Not Used Regularly
                  
                  Checks whether the root user is not used regularly by examining the IAM Credential Report
                  for root user activity.
                  
                  CONFIGURATION:
                  --------------
                  This Lambda function receives data from AWS Config rule parameters.
                  
                  Rule Parameter:
                    - RootUsageThresholdDays (integer, default: 5)
                      Number of days to look back for root account usage. If root was used within this
                      threshold, the account is marked NON_COMPLIANT.
                  
                  The parameter is passed to the Lambda function via the 'ruleParameters' field in the
                  AWS Config evaluation event as a JSON string: {"RootUsageThresholdDays": "5"}
                  
                  BEHAVIOR:
                  ---------
                  This implementation checks if the root user was used at least once in the last 
                  RootUsageThresholdDays days. The rule is COMPLIANT if root was last used more than
                  RootUsageThresholdDays ago (or never used).
                  
                  LIMITATION:
                  -----------
                  If the root user is used once, the rule will remain NON_COMPLIANT until 
                  RootUsageThresholdDays days have passed since that usage.
                  
                  DISCARDED ALTERNATIVE APPROACH:
                  ---------------------
                  A more sophisticated implementation could count how many times root was used in the 
                  last RootUsageThresholdDays, and flag as NON_COMPLIANT only if used more than X times.
                  However, this would require querying CloudTrail records, which introduces additional cost.
                  """
                  
                  import json
                  import logging
                  import os
                  from datetime import datetime, timedelta
                  import boto3
                  from botocore.exceptions import ClientError
                  
                  # Configure logging for CloudWatch Logs
                  logger = logging.getLogger()
                  log_level = os.environ.get('LOG_LEVEL', 'INFO')
                  logger.setLevel(getattr(logging, log_level))
                  
                  # Set to True to get the lambda to assume the Role attached on the Config Service (useful for cross-account).
                  # This check does not need cross-account access
                  ASSUME_ROLE_MODE = False
                  
                  # NOTE: The RootUsageThresholdDays threshold is NOT configured via environment variable.
                  # It is passed as a rule parameter from AWS Config via the 'ruleParameters' field in the evaluation event.
                  
                  def lambda_handler(event, context):
                      """
                      AWS Config custom rule evaluation handler for root account usage check.
                      
                      This function evaluates whether the root user has been used within the
                      configured threshold period by checking the IAM Credential Report.
                      
                      Args:
                          event: AWS Config evaluation event containing:
                              - configRuleId: The Config rule identifier (required)
                              - configRuleName: The Config rule name
                              - accountId: AWS account ID
                              - evaluationMode: DETECTIVE or PROACTIVE
                              - ruleParameters: JSON string containing rule parameters (optional)
                                  Example: '{"RootUsageThresholdDays": "5"}'
                                  
                          context: Lambda context object
                      
                      Rule Parameters (from AWS Config):
                          RootUsageThresholdDays (integer, default: 5):
                              Number of days to look back for root account usage.
                              Configured in the conformance pack template's InputParameters.
                      
                      Returns:
                          dict: Compliance evaluation result containing:
                              - compliance_type: COMPLIANT | NON_COMPLIANT | INSUFFICIENT_DATA | NOT_APPLICABLE
                              - annotation: Human-readable explanation
                              - resource_type: 'AWS::::Account'
                              - resource_id: AWS account ID
                      """
                      global AWS_CONFIG_CLIENT
                  
                      logger.info(f"Received event: {json.dumps(event)}")
                      
                      try:
                          # Validate event structure
                          if 'configRuleId' not in event:
                              raise ValueError("Missing required field: configRuleId")
                  
                          invoking_event = json.loads(event['invokingEvent'])
                          logger.debug('CRCD-ConfPack: Received invoking event: ' + json.dumps(invoking_event))
                  
                          AWS_CONFIG_CLIENT = get_client('config', event)
                  
                          # This rule supports only periodic evaluation
                          if invoking_event['messageType'] != 'ScheduledNotification':
                              logger.logError('CRCD-ConfPack: This rule accepts only periodic evaluation. Invalid message type: ' + invoking_event['messageType'])
                              raise ValueError("Invalid message type: " + str(invoking_event['messageType']))
                  
                          # Extract Config rule parameters
                          config_rule_id = event['configRuleId']
                          account_id = event.get('accountId')
                  
                          # Extract rule parameters
                          rule_parameters = {}
                          if 'ruleParameters' in event and event['ruleParameters']:
                              rule_parameters = json.loads(event['ruleParameters'])
                          
                          # Get threshold from rule parameters with default fallback
                          # the default value of RootUsageThresholdDays is hardcoded because users must make a 
                          # cloud formation update so that the new value goes in all lambda functions in all accounts
                          root_usage_threshold_days = int(rule_parameters.get('RootUsageThresholdDays', '5'))
                          
                          # Fallback to extracting account ID from invoking event or context if not in event
                          if not account_id:
                              account_id = invoking_event['awsAccountId']
                          if not account_id:
                              account_id = context.invoked_function_arn.split(':')[4]
                          
                          # For periodic rules, there's no specific configuration item
                          # We evaluate at the account level
                          resource_type = 'AWS::::Account'
                          
                          logger.info(f"Evaluating root account usage for account: {account_id}")
                          logger.info(f"Threshold: {root_usage_threshold_days} days")
                          
                          # Evaluate compliance
                          compliance_type, last_used_date = evaluate_root_usage(account_id, root_usage_threshold_days)
                          
                          annotation = get_annotation(compliance_type, last_used_date, root_usage_threshold_days)
                          
                          logger.info(
                              f"Compliance decision for account {account_id}: "
                              f"{compliance_type} - {annotation}"
                          )
                      
                      except ClientError as e:
                          error_code = e.response['Error']['Code']
                          error_msg = e.response['Error']['Message']
                          logger.error(
                              f"AWS API error evaluating root account usage: {error_code} - {error_msg}",
                              exc_info=True
                          )
                  
                          compliance_type = 'INSUFFICIENT_DATA'
                      
                      except ValueError as e:
                          logger.error(f"Invalid event structure: {e}", exc_info=True)
                          compliance_type = 'NOT_APPLICABLE'
                      
                      except Exception as e:
                          logger.error(f"Unexpected error evaluating root account usage: {e}", exc_info=True)
                          compliance_type = 'INSUFFICIENT_DATA'
                  
                      # returns result to AWS Config
                      AWS_CONFIG_CLIENT.put_evaluations(
                          Evaluations=[
                              {
                                  'ComplianceResourceType': resource_type,
                                  'ComplianceResourceId': account_id,
                                  'ComplianceType': compliance_type,
                                  'Annotation': annotation, 
                                  'OrderingTimestamp': invoking_event['notificationCreationTime']
                              },
                          ],
                          ResultToken=event['resultToken'])
                  
                  def evaluate_root_usage(account_id, root_usage_threshold_days):
                      """
                      Evaluate whether root account is used regularly by checking IAM credential report.
                      
                      This function retrieves the IAM credential report and checks when the root
                      user last used password or access keys.
                      
                      Args:
                          account_id (str): AWS account ID
                          root_usage_threshold_days (int): Number of days to look back for root usage.
                              This value comes from AWS Config rule parameters (RootUsageThresholdDays).
                              If root was used within this threshold, returns NON_COMPLIANT.
                      
                      Returns:
                          tuple: (compliance_status, last_used_date) where:
                              - compliance_status (str): COMPLIANT, NON_COMPLIANT, NOT_APPLICABLE, or INSUFFICIENT_DATA
                              - last_used_date (datetime): datetime of last root usage, or None if never used
                      """
                      try:
                          # Create IAM client (only boto3/botocore, no external dependencies)
                          iam_client = boto3.client('iam')
                          
                          logger.info("Generating IAM credential report")
                          
                          # Generate credential report (may take a few seconds on first call)
                          report_status = iam_client.generate_credential_report()
                          
                          # Wait for report to be ready if needed, with exponential backoff
                          # It can take up to 4 minutes to generate a credential report 
                          import time
                          max_wait_time = 360 # 6 minutes
                          start_time = time.time()
                          wait_interval = 1
                  
                          while report_status['State'] != 'COMPLETE':
                              if time.time() - start_time > max_wait_time:
                                  break
                              time.sleep(wait_interval)
                              report_status = iam_client.generate_credential_report()
                              wait_interval = min(wait_interval * 1.5, 10)  # Cap at 10 seconds
                          
                          if report_status['State'] != 'COMPLETE':
                              logger.error("IAM Credential report generation timed out")
                              return 'INSUFFICIENT_DATA', None
                          
                          # Get the credential report
                          logger.info("Retrieving IAM credential report")
                          response = iam_client.get_credential_report()
                          report_content = response['Content'].decode('utf-8')
                          
                          # Parse CSV report
                          import csv
                          from io import StringIO
                          
                          csv_reader = csv.DictReader(StringIO(report_content))
                          
                          # Find root user entry (user == '<root_account>')
                          root_entry = None
                          for row in csv_reader:
                              if row.get('user') == '<root_account>':
                                  root_entry = row
                                  break
                          
                          if not root_entry:
                              logger.error("Root account entry not found in credential report")
                              return 'INSUFFICIENT_DATA', None
                          
                          logger.info(f"Found root account entry in credential report")
                          
                          # Check last usage dates
                          threshold_date = datetime.now() - timedelta(days=root_usage_threshold_days)
                          last_used_date = None
                          
                          # Check password last used
                          password_last_used = root_entry.get('password_last_used')
                          if password_last_used and password_last_used != 'N/A' and password_last_used != 'no_information':
                              try:
                                  password_date = datetime.strptime(password_last_used, '%Y-%m-%dT%H:%M:%S+00:00')
                                  if last_used_date is None or password_date > last_used_date:
                                      last_used_date = password_date
                                  logger.info(f"Root password last used: {password_last_used}")
                              except ValueError as e:
                                  logger.warning(f"Could not parse password_last_used date: {e}")
                          
                          # Check access key 1 last used
                          access_key_1_last_used = root_entry.get('access_key_1_last_used_date')
                          if access_key_1_last_used and access_key_1_last_used != 'N/A' and access_key_1_last_used != 'no_information':
                              try:
                                  key1_date = datetime.strptime(access_key_1_last_used, '%Y-%m-%dT%H:%M:%S+00:00')
                                  if last_used_date is None or key1_date > last_used_date:
                                      last_used_date = key1_date
                                  logger.info(f"Root access key 1 last used: {access_key_1_last_used}")
                              except ValueError as e:
                                  logger.warning(f"Could not parse access_key_1_last_used_date: {e}")
                          
                          # Check access key 2 last used
                          access_key_2_last_used = root_entry.get('access_key_2_last_used_date')
                          if access_key_2_last_used and access_key_2_last_used != 'N/A' and access_key_2_last_used != 'no_information':
                              try:
                                  key2_date = datetime.strptime(access_key_2_last_used, '%Y-%m-%dT%H:%M:%S+00:00')
                                  if last_used_date is None or key2_date > last_used_date:
                                      last_used_date = key2_date
                                  logger.info(f"Root access key 2 last used: {access_key_2_last_used}")
                              except ValueError as e:
                                  logger.warning(f"Could not parse access_key_2_last_used_date: {e}")
                          
                          # Determine compliance
                          if last_used_date is None:
                              # No usage recorded
                              logger.info("No root usage detected")
                              return 'COMPLIANT', None
                          elif last_used_date < threshold_date:
                              # Used, but not within threshold
                              logger.info(f"Root last used {last_used_date}, before threshold {threshold_date}")
                              return 'COMPLIANT', last_used_date
                          else:
                              # Used within threshold
                              logger.info(f"Root last used {last_used_date}, within threshold {threshold_date}")
                              return 'NON_COMPLIANT', last_used_date
                      
                      except ClientError as e:
                          logger.error(f"IAM API error: {e}", exc_info=True)
                          raise
                      
                      except Exception as e:
                          logger.error(f"Error evaluating root usage: {e}", exc_info=True)
                          raise
                  
                  
                  def get_annotation(compliance_type, last_used_date, root_usage_threshold_days):
                      """
                      Get human-readable annotation for compliance status.
                      
                      Args:
                          compliance_type: COMPLIANT, NON_COMPLIANT, NOT_APPLICABLE, or INSUFFICIENT_DATA
                          last_used_date: datetime of last root usage, or None
                          root_usage_threshold_days: how far in the past (in days) the root user must have been used last for COMPLIANT outcome
                      
                      Returns:
                          Human-readable annotation string
                      """
                      if compliance_type == 'COMPLIANT':
                          if last_used_date:
                              return (
                                  f'Root account last used on {last_used_date.strftime("%Y-%m-%d")}, '
                                  f'which is more than {root_usage_threshold_days} days ago'
                              )
                          else:
                              return f'Root account has not been used (no usage recorded)'
                      elif compliance_type == 'NON_COMPLIANT':
                          if last_used_date:
                              days_ago = (datetime.now() - last_used_date).days
                              return (
                                  f'Root account was used {days_ago} days ago on {last_used_date.strftime("%Y-%m-%d")}, '
                                  f'within the {root_usage_threshold_days}-day threshold'
                              )
                          else:
                              return f'Root account has been used within the last {root_usage_threshold_days} days'
                      else:
                          return 'Unable to determine root account usage'
                  
                  
                  # This gets the client after assuming the Config service role
                  # either in the same AWS account or cross-account.
                  def get_client(service, event):
                      """Return the service boto client. It should be used instead of directly calling the client.
                      Keyword arguments:
                      service -- the service name used for calling the boto.client()
                      event -- the event variable given in the lambda handler
                      """
                      if not ASSUME_ROLE_MODE:
                          return boto3.client(service)
                      credentials = get_assume_role_credentials(event["executionRoleArn"])
                      return boto3.client(service, aws_access_key_id=credentials['AccessKeyId'],
                                          aws_secret_access_key=credentials['SecretAccessKey'],
                                          aws_session_token=credentials['SessionToken']
                                          )
              Environment:
                Variables:
                  LOG_LEVEL: INFO
