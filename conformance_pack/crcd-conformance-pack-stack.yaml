                  - LAMBDA_INSIDE_VPC

          # Permission for Config to invoke Lambda
          RootNotUsedRegularlyLambdaPermission:
            Type: AWS::Lambda::Permission
            DeletionPolicy: Delete
            UpdateReplacePolicy: Delete
            Properties:
              FunctionName: !Ref RootNotUsedRegularlyLambda
